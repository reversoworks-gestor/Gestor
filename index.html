function initials(name){
  const parts = (name||"").trim().split(/\s+/).filter(Boolean);
  if(parts.length===0) return "RG";
  return parts.slice(0,2).map(w=>w[0]).join("").toUpperCase();
}

function printDoc(type, data){
  const s = state.settings;
  const t = calcDocTotals(data);
  const client = state.clients.find(c=>c.id===data.clientId) || {name:"—"};
  const isEstimate = type==="estimate";
  const displayStatus = isEstimate ? effectiveEstimateStatus(data) : data.status;
  const statusColors = {
    draft:["#EEF0F3","#5b6472"], sent:["#E4EEF6","#2C6E9E"], paid:["#E7F5EC","#1E7A46"],
    partial:["#FDF3DC","#8A5A00"],
    overdue:["#FBEAE9","#B3261E"], accepted:["#E7F5EC","#1E7A46"], expired:["#FBEAE9","#B3261E"]
  };
  const sc = statusColors[displayStatus] || statusColors.draft;
  const paid = isEstimate ? 0 : sumPayments(data);
  const balance = isEstimate ? 0 : Math.max(0, t.total - paid);
  const docWord = isEstimate ? "Orçamento" : "Fatura";

  const metaRows = [
    ["Documento", docWord.toUpperCase() + " · " + escapeHTML(data.number)],
    ["Data", fmtDate(data.date)],
  ];
  if(data.poNumber) metaRows.push(["P.O. / Ref.", escapeHTML(data.poNumber)]);
  metaRows.push([isEstimate ? "Válido até" : "Vencimento", fmtDate(isEstimate ? data.validUntil : data.dueDate)]);

  const effectiveShipAddr = (data.shippingAddress && formatAddressLines(data.shippingAddress).length)
    ? data.shippingAddress
    : client.address;

  const html = `
    <div class="doc-page">
      <div class="doc-header-v2">
        <div class="doc-brand-block">
          <img class="doc-logo-img" src="${LOGO_DATA_URI}" alt="Logo">
          <div class="doc-brandname">${escapeHTML(s.businessName)}</div>
          <div class="doc-company-block">
            ${escapeHTML(s.address||"").replace(/\n/g,"<br>")}${s.address ? "<br>" : ""}
            ${s.phone ? "Tel: "+escapeHTML(s.phone) : ""}${s.phone && s.email ? " · " : ""}${s.email ? "Email: "+escapeHTML(s.email) : ""}
            ${s.ein ? "<br>EIN: "+escapeHTML(s.ein) : ""}
          </div>
        </div>
        <div class="doc-type-block">
          <div class="doc-title-tag">${docWord.toUpperCase()}</div>
          <div class="doc-status-stamp" style="background:${sc[0]}; color:${sc[1]};">${statusLabel(type,displayStatus)}</div>
          ${data.businessLine ? `<div class="stat-hint" style="margin-top:6px;">${escapeHTML(data.businessLine)}</div>` : ""}
        </div>
      </div>

      <div class="doc-meta-row">
        <div class="doc-meta-col">
          <div class="label">Cobrar de</div>
          <div class="content">
            <strong>${escapeHTML(client.name)}</strong>${client.type==="company" ? ' <span style="font-size:10.5px; color:#8991A0;">(Empresa)</span>' : ""}<br>
            ${formatAddressHTML(client.address)}${formatAddressLines(client.address).length ? "<br>" : ""}
            ${escapeHTML(client.email||"")}${client.phone ? " · "+escapeHTML(client.phone) : ""}
          </div>
        </div>
        ${data.requiresShipping ? `
        <div class="doc-meta-col">
          <div class="label">Enviar para</div>
          <div class="content">${formatAddressHTML(effectiveShipAddr) || "<span style='color:#B3261E;'>Endereço de envio não informado</span>"}</div>
        </div>` : ""}
        <div class="doc-meta-col" style="flex:0 0 auto;">
          <table class="doc-meta-table">
            ${metaRows.map(([k,v])=>`<tr><td class="k">${k}</td><td class="v">${v}</td></tr>`).join("")}
          </table>
        </div>
      </div>

      <table class="doc-items-v2">
        <thead><tr>
          <th style="width:10%">Qtd.</th>
          <th style="width:48%">Descrição</th>
          <th class="num" style="width:20%">Preço unit.</th>
          <th class="num" style="width:22%">Total</th>
        </tr></thead>
        <tbody>
          ${data.items.map(it=>`
            <tr>
              <td>${it.qty}</td>
              <td>${escapeHTML(it.desc)}</td>
              <td class="num">${fmtMoney(it.rate)}</td>
              <td class="num">${fmtMoney((Number(it.qty)||0)*(Number(it.rate)||0))}</td>
            </tr>`).join("")}
        </tbody>
      </table>

      <div class="doc-totals">
        <div class="row"><span>Subtotal</span><span>${fmtMoney(t.subtotal)}</span></div>
        ${data.applyTax ? `<div class="row"><span>Imposto sobre vendas ${(data.taxRate*100).toFixed(2)}%</span><span>${fmtMoney(t.taxAmount)}</span></div>` : ""}
        <div class="row grand"><span>TOTAL</span><span>${fmtMoney(t.total)}</span></div>
        ${!isEstimate && paid>0 ? `
        <div class="row"><span>Pago</span><span>${fmtMoney(paid)}</span></div>
        <div class="row balance"><span>Saldo devedor</span><span>${fmtMoney(balance)}</span></div>` : ""}
      </div>

      ${data.fromEstimateNumber ? `<div style="font-size:11.5px; color:#8991A0; margin-top:6px;">Gerado do orçamento ${escapeHTML(data.fromEstimateNumber)}</div>` : ""}

      ${s.ownerName ? `
      <div style="margin-top:36px;">
        <div class="doc-sig-script">${escapeHTML(s.ownerName)}</div>
        <div style="border-top:1px solid var(--line); width:210px; margin-top:2px; padding-top:4px; font-size:10.5px; color:#8991A0;">
          ${escapeHTML(s.ownerName)}${s.businessName ? " — "+escapeHTML(s.businessName) : ""}
        </div>
      </div>` : ""}
      ${isEstimate ? `<div class="doc-sign"><div class="line">Aceito por (assinatura do cliente)</div><div class="line">Data</div></div>` : ""}

      <div class="doc-thankyou">Obrigado!</div>

      ${data.notes ? `
      <div class="doc-terms">
        <div class="bar"></div>
        <div class="content">
          <div class="heading">${isEstimate ? "Condições" : "Termos e condições"}</div>
          ${escapeHTML(data.notes).replace(/\n/g,"<br>")}
        </div>
      </div>` : ""}

      ${s.disclaimerText ? `
      <div class="doc-terms" style="margin-top:14px;">
        <div class="bar"></div>
        <div class="content">
          <div class="heading">Produção, entrega, garantia e reembolso</div>
          ${escapeHTML(s.disclaimerText).replace(/\n/g,"<br>")}
        </div>
      </div>` : ""}

      <div class="doc-footer">${escapeHTML(s.businessName)} — documento gerado em ${fmtDate(todayISO())}</div>
    </div>
  `;
  document.getElementById("print-area").innerHTML = html;
  window.print();
}

function printTaxReport(reportData){
  const s = state.settings;
  const html = `
    <div class="doc-page">
      <div class="doc-header">
        <div><div class="doc-brand">${escapeHTML(s.businessName)}<span class="line-tag">Relatório fiscal</span></div></div>
        <div class="doc-meta">
          <div class="doc-title">${escapeHTML(reportData.periodLabel)}</div>
          <div style="margin-top:8px;">Gerado em ${fmtDate(todayISO())}</div>
        </div>
      </div>
      <div class="doc-totals" style="width:100%;">
        <div class="row"><span>Receita de faturas (pagamentos recebidos)</span><span>${fmtMoney(reportData.invoiceIncome)}</span></div>
        <div class="row"><span>Receita de vendas marketplace (líquida)</span><span>${fmtMoney(reportData.marketplaceIncome)}</span></div>
        <div class="row"><span>Receita bruta total</span><span>${fmtMoney(reportData.income)}</span></div>
        <div class="row"><span>Despesas totais</span><span>${fmtMoney(reportData.expenseTotal)}</span></div>
        <div class="row grand"><span>Lucro líquido estimado</span><span>${fmtMoney(reportData.net)}</span></div>
      </div>
      <table class="doc-table" style="margin-top:24px;">
        <thead><tr><th>Categoria de despesa</th><th class="num">Total</th></tr></thead>
        <tbody>
          ${reportData.byCategory.map(([cat,val])=>`<tr><td>${escapeHTML(cat)}</td><td class="num">${fmtMoney(val)}</td></tr>`).join("")}
        </tbody>
      </table>
      <div class="doc-notes">
Lembretes fiscais (sole proprietorship, Schedule C + Schedule SE):
— Self-employment tax de 15,3% incide sobre o lucro líquido.
— Estimated taxes trimestrais recomendados acima de ~$1.000/ano de lucro projetado.
— Vendas via marketplace (Etsy/eBay/Amazon) já recolhem imposto sobre vendas automaticamente (AB 147); vendas diretas são responsabilidade própria.
— Receita de marketplace aqui já está líquida de taxas da plataforma.
— Este relatório é organizacional, não é aconselhamento fiscal. Confirme com seu contador antes de declarar.
      </div>
    </div>
  `;
  document.getElementById("print-area").innerHTML = html;
  window.print();
}

/* =========================================================
   MARKETPLACE SALES

function netSale(sale){
  return (Number(sale.grossAmount)||0) - (Number(sale.feesAmount)||0);
}

function renderMarketplace(main){
  let search="", platformFilter="";
  function draw(){
    let list = state.marketplaceSales.slice().sort((a,b)=> (b.date||"").localeCompare(a.date||""));
    if(search) list = list.filter(s => (s.description||"").toLowerCase().includes(search.toLowerCase()));
    if(platformFilter) list = list.filter(s => s.platform===platformFilter);
    const totalNet = list.reduce((s,sale)=> s+netSale(sale), 0);

    main.innerHTML = `
      <div class="view-header">
        <div>
          <div class="view-title">Vendas Marketplace</div>
          <div class="view-sub">${state.marketplaceSales.length} registradas — líquido filtrado: ${fmtMoney(totalNet)}</div>
        </div>
        <button class="btn btn-primary" id="new-sale">+ Nova venda</button>
      </div>
      <div class="note-banner">
        <strong>Por quê essa aba existe:</strong> vendas na Etsy, eBay ou Amazon acontecem direto na plataforma — você não emite fatura pra elas.
        Registre aqui pra essa receita aparecer no Painel e no Relatório Fiscal junto com as faturas da Reverso Works.
      </div>
      <div class="toolbar">
        <input type="search" id="search-sale" placeholder="Buscar por descrição do produto…" value="${escapeHTML(search)}">
        <select id="filter-platform">
          <option value="">Todas plataformas</option>
          ${MARKETPLACE_PLATFORMS.map(p=>`<option value="${p}" ${p===platformFilter?"selected":""}>${p}</option>`).join("")}
        </select>
      </div>
      <div class="card" style="padding:0;">
        ${list.length===0 ? `<div class="empty-state"><div class="big">Nenhuma venda registrada</div>Registre a primeira venda da Reverso Studio.</div>` : `
        <table>
          <thead><tr><th>Data</th><th>Plataforma</th><th>Produto</th><th class="num">Bruto</th><th class="num">Taxas</th><th class="num">Líquido</th><th></th></tr></thead>
          <tbody>
            ${list.map(s=>`
              <tr>
                <td>${fmtDate(s.date)}</td>
                <td><span class="badge badge-platform">${escapeHTML(s.platform)}</span></td>
                <td>${escapeHTML(s.description)}</td>
                <td class="num">${fmtMoney(s.grossAmount)}</td>
                <td class="num">${fmtMoney(s.feesAmount)}</td>

/* =========================================================
   TAX REPORT
========================================================= */
function renderTax(main){
  const years = new Set([new Date().getFullYear()]);
  state.invoices.forEach(i=> i.date && years.add(Number(i.date.slice(0,4))));
  state.expenses.forEach(e=> e.date && years.add(Number(e.date.slice(0,4))));
  state.marketplaceSales.forEach(s=> s.date && years.add(Number(s.date.slice(0,4))));
  const yearList = Array.from(years).sort((a,b)=>b-a);

  let year = yearList[0];
  let quarter = "all";

  function draw(){
    const qRanges = {
      all: [`${year}-01-01`, `${year}-12-31`],
      1:[`${year}-01-01`,`${year}-03-31`], 2:[`${year}-04-01`,`${year}-06-30`],
      3:[`${year}-07-01`,`${year}-09-30`], 4:[`${year}-10-01`,`${year}-12-31`]
    };
    const [start,end] = qRanges[quarter];

    const invoiceIncome = allPaymentsFlat()
      .filter(p => p.date>=start && p.date<=end)
      .reduce((s,p)=> s+(Number(p.amount)||0), 0);

    const marketplaceIncome = state.marketplaceSales
      .filter(sale => sale.date>=start && sale.date<=end)
      .reduce((s,sale)=> s+netSale(sale), 0);

    const income = invoiceIncome + marketplaceIncome;

    const exps = state.expenses.filter(e=> e.date>=start && e.date<=end);
    const expenseTotal = exps.reduce((s,e)=> s+(Number(e.amount)||0),0);
    const byCategoryMap = {};
    exps.forEach(e=>{ byCategoryMap[e.category] = (byCategoryMap[e.category]||0) + (Number(e.amount)||0); });
    const byCategory = Object.entries(byCategoryMap).sort((a,b)=>b[1]-a[1]);
    const net = income - expenseTotal;
    const seTax = net>0 ? net*0.153 : 0;
    const periodLabel = quarter==="all" ? `Ano ${year}` : `${year} — T${quarter}`;

    main.innerHTML = `
      <div class="view-header">
        <div>
          <div class="view-title">Relatório Fiscal</div>
          <div class="view-sub">Organização simples pra Schedule C — não substitui contador.</div>
        </div>
        <button class="btn btn-ghost" id="print-report">Imprimir / PDF</button>
      </div>
      <div class="toolbar">
        <select id="f-year">${yearList.map(y=>`<option value="${y}" ${y===year?"selected":""}>${y}</option>`).join("")}</select>
        <select id="f-quarter">
          <option value="all" ${quarter==="all"?"selected":""}>Ano todo</option>
          <option value="1" ${quarter==="1"?"selected":""}>1º trimestre</option>
          <option value="2" ${quarter==="2"?"selected":""}>2º trimestre</option>
          <option value="3" ${quarter==="3"?"selected":""}>3º trimestre</option>
          <option value="4" ${quarter==="4"?"selected":""}>4º trimestre</option>
        </select>
      </div>

      <div class="stat-grid" style="grid-template-columns:repeat(3,1fr);">
        <div class="stat-card">
          <div class="stat-label">Receita bruta</div>
          <div class="stat-value" style="color:var(--good)">${fmtMoney(income)}</div>
          <div class="stat-hint">Faturas: ${fmtMoney(invoiceIncome)} · Marketplace: ${fmtMoney(marketplaceIncome)}</div>
        </div>
        <div class="stat-card"><div class="stat-label">Despesas totais</div><div class="stat-value amber">${fmtMoney(expenseTotal)}</div></div>
        <div class="stat-card"><div class="stat-label">Lucro líquido</div><div class="stat-value ${net<0?'danger':''}">${fmtMoney(net)}</div></div>
      </div>

      <div class="card">
        <strong>Despesas por categoria</strong>
        ${byCategory.length===0 ? `<div class="empty-state">Sem despesas no período.</div>` : `
        <table style="margin-top:10px;">
          <thead><tr><th>Categoria</th><th class="num">Total</th></tr></thead>
          <tbody>${byCategory.map(([cat,val])=>`<tr><td>${escapeHTML(cat)}</td><td class="num">${fmtMoney(val)}</td></tr>`).join("")}</tbody>
        </table>`}
      </div>

      <div class="note-banner">
        <strong>Lembretes (Schedule C + Schedule SE):</strong> self-employment tax de 15,3% sobre o lucro líquido
        (estimado aqui: ${fmtMoney(seTax)}) · estimated taxes trimestrais recomendados acima de ~$1.000/ano de lucro projetado ·
        vendas via marketplace já recolhem imposto automaticamente (AB 147), vendas diretas são responsabilidade própria ·
        receita de marketplace já está líquida de taxas da plataforma.
        Isto é organizacional — confirme os números com seu contador antes de declarar.
      </div>
    `;
    document.getElementById("f-year").onchange = e=>{ year=Number(e.target.value); draw(); };
    document.getElementById("f-quarter").onchange = e=>{ quarter=e.target.value; draw(); };
    document.getElementById("print-report").onclick = ()=> printTaxReport({periodLabel, income, invoiceIncome, marketplaceIncome, expenseTotal, net, byCategory});
  }
  draw();
}

function openCalculatorHandoff(type, businessLine, items){
  const skeleton = newDocSkeleton(type);
  skeleton.businessLine = businessLine;
  if(items && items.length) skeleton.items = items;
  if(type==="invoice" && !skeleton.payments) skeleton.payments = [];
  editingDoc = {type, data: skeleton, isNew: true};
  currentView = type==="estimate" ? "estimates" : "invoices";
  render();
  showToast("Itens da calculadora prontos — escolha o cliente e revise antes de salvar.");
}

              ${pricing.materiais.map(m=>`<option value="${escapeHTML(m.nome)}" ${m.nome===form.material?"selected":""}>${escapeHTML(m.nome)}</option>`).join("")}
              <option value="__manual__" ${form.material==="__manual__"?"selected":""}>Outro (preço manual)</option>
            </select>
          </div>
          ${form.material==="__manual__" ? `
          <div class="field" style="margin-bottom:12px;">
            <label>Preço manual ($/g)</label>
            <input type="number" step="0.001" id="c-manualprice" value="${form.manualPrice}">

          <div class="form-grid">

          </div>
        </div>

        <div class="card">
          <div class="section-title">Peça</div>
          <div class="calc-cost-line"><span>Material</span><span>${fmtMoney(result.custoMaterial)}</span></div>
          <div class="calc-cost-line"><span>Máquina</span><span>${fmtMoney(result.custoMaquina)}</span></div>
          <div class="calc-cost-line"><span>Mão de obra</span><span>${fmtMoney(result.custoMaoObra)}</span></div>
          <div class="calc-cost-line"><span>Custo da peça</span><span>${fmtMoney(result.custoPeca)}</span></div>
          <div class="calc-cost-line total"><span>Preço da peça</span><span>${fmtMoney(result.precoPeca)}</span></div>

          <div class="section-title" style="margin-top:22px;">NRE / engenharia</div>
          <div class="calc-cost-line"><span>${form.repeticao ? "NRE cheio (referência)" : "Horas × taxa"}</span><span>${fmtMoney(result.nreCheio)}</span></div>
          <div class="calc-cost-line"><span>${form.repeticao ? "Royalty cobrado" : "Preço do NRE"}</span><span>${fmtMoney(result.precoNRE)}</span></div>
          <div class="calc-cost-line"><span>Depósito (${(pricing.depositoNRE*100).toFixed(0)}%)</span><span>${fmtMoney(result.deposito)}</span></div>
          <div class="calc-cost-line"><span>Saldo na entrega</span><span>${fmtMoney(result.saldo)}</span></div>
          <div class="calc-cost-line total" style="margin-top:14px;"><span>Total do pedido</span><span>${fmtMoney(result.totalPedido)}</span></div>
          <div style="margin-top:10px;">
            <span class="pill ${result.abaixoDoMinimo ? "pill-warn" : "pill-ok"}">
              ${result.abaixoDoMinimo ? "Abaixo do pedido mínimo (" + fmtMoney(pricing.pedidoMinimo) + ")" : "Acima do pedido mínimo"}
            </span>
          </div>

          <button class="btn btn-amber btn-sm" id="add-to-list" style="margin-top:18px;">+ Adicionar à cotação</button>
        </div>
      </div>

      <div class="card" style="margin-top:16px;">
        <div class="section-title">Itens desta cotação<span class="hint">${list.length} peça(s) · total ${fmtMoney(listTotal)}</span></div>
        ${list.length===0 ? `<div class="calc-empty-hint">Adicione peças acima pra montar um orçamento com várias peças.</div>` :
          list.map((it,i)=>`
            <div class="calc-list-row">
              <div>
                <div class="li-desc">${escapeHTML(it.nome)}</div>
                <div class="li-meta">Peça ${fmtMoney(it.precoPeca)} · NRE ${fmtMoney(it.precoNRE)}${it.abaixoDoMinimo ? " · abaixo do mínimo" : ""}</div>
              </div>
              <div style="display:flex; align-items:center; gap:12px;">
                <div class="li-price">${fmtMoney(it.totalPedido)}</div>
                <button class="remove-line" data-remove-item="${i}">&times;</button>
              </div>
            </div>`).join("")
        }
        ${list.length>0 ? `
        <div class="modal-actions" style="margin-top:16px; justify-content:flex-start;">
          <button class="btn btn-primary" id="handoff-estimate">Criar orçamento com estas peças</button>
        </div>` : ""}
      </div>
    `;

    document.getElementById("c-nome").oninput = e=>{ form.nome = e.target.value; };
    document.getElementById("c-material").onchange = e=>{ form.material = e.target.value; draw(); };
    const mp = document.getElementById("c-manualprice");
    if(mp) mp.oninput = e=>{ form.manualPrice = e.target.value; draw(); };
    document.getElementById("c-peso").oninput = e=>{ form.peso = e.target.value; draw(); };
    document.getElementById("c-tempo").oninput = e=>{ form.tempo = e.target.value; draw(); };
    document.getElementById("c-pos").oninput = e=>{ form.pos = e.target.value; draw(); };
    document.getElementById("c-horasnre").oninput = e=>{ form.horasNRE = e.target.value; draw(); };
    document.getElementById("c-repeticao").onchange = e=>{ form.repeticao = e.target.checked; draw(); };

    document.getElementById("add-to-list").onclick = ()=>{
      if(!form.nome.trim()){ showToast("Dê um nome pra peça antes de adicionar."); return; }
      list.push(Object.assign({nome: form.nome.trim()}, result));
      form.nome=""; form.peso=""; form.tempo=""; form.pos=""; form.horasNRE=""; form.manualPrice=""; form.repeticao=false;
      draw();
      showToast("Peça adicionada.");
    };
    main.querySelectorAll("[data-remove-item]").forEach(btn=> btn.onclick = ()=>{
      list.splice(Number(btn.dataset.removeItem),1);
      draw();
    });
    const handoffBtn = document.getElementById("handoff-estimate");
    if(handoffBtn){
      handoffBtn.onclick = ()=>{
        const items = [];
        list.forEach(it=>{
          items.push({desc: it.nome + " — peça", qty:1, rate: it.precoPeca, taxable:true});
          if(it.precoNRE > 0){
            items.push({desc: it.nome + " — NRE (escaneamento/CAD)", qty:1, rate: it.precoNRE, taxable:false});
          }
        });
        openCalculatorHandoff("estimate", "Reverso Works", items);
      };
    }
  }
  draw();
}

/* =========================================================
   AUTH & LOGIN SCREEN
========================================================= */
let authMode = "login"; // "login" | "signup"

function renderLoginScreen(errorMsg){
  const el = document.getElementById("login-screen");
  el.innerHTML = `
    <div class="login-card">
      <div class="login-brand">REVERSO<small>Gestor</small></div>
      <div class="login-error ${errorMsg ? "show" : ""}" id="login-error">${escapeHTML(errorMsg||"")}</div>
      <div class="field"><label>Email</label><input type="email" id="login-email" autocomplete="username"></div>
      <div class="field"><label>Senha</label><input type="password" id="login-password" autocomplete="${authMode==='signup'?'new-password':'current-password'}"></div>
      <div class="login-actions">
        <button class="btn btn-primary" id="login-submit">${authMode==="signup" ? "Criar conta" : "Entrar"}</button>
      </div>
      <div class="login-toggle">
        ${authMode==="signup"
          ? `Já tem conta? <a id="to-login">Entrar</a>`
          : `Primeiro acesso? <a id="to-signup">Criar conta</a>`}
      </div>
    </div>
  `;
  document.getElementById("login-submit").onclick = handleAuthSubmit;
  const pwField = document.getElementById("login-password");
  pwField.addEventListener("keydown", e=>{ if(e.key==="Enter") handleAuthSubmit(); });
  const toSignup = document.getElementById("to-signup");
  if(toSignup) toSignup.onclick = ()=>{ authMode="signup"; renderLoginScreen(); };
  const toLogin = document.getElementById("to-login");
  if(toLogin) toLogin.onclick = ()=>{ authMode="login"; renderLoginScreen(); };
}

async function handleAuthSubmit(){
  const email = document.getElementById("login-email").value.trim();
  const password = document.getElementById("login-password").value;
  if(!email || !password){ renderLoginScreen("Preencha email e senha."); return; }
  try{
    if(authMode==="signup"){
      await auth.createUserWithEmailAndPassword(email, password);
    } else {
      await auth.signInWithEmailAndPassword(email, password);
    }
    // onAuthStateChanged cuida do resto
  }catch(e){
    renderLoginScreen(translateAuthError(e));
  }
}

function translateAuthError(e){
  const code = e && e.code || "";
  const map = {
    "auth/user-not-found": "Email não encontrado. Crie uma conta primeiro.",
    "auth/wrong-password": "Senha incorreta.",
    "auth/invalid-email": "Email inválido.",
    "auth/email-already-in-use": "Este email já tem conta — clique em \"Entrar\".",
    "auth/weak-password": "Senha muito curta (mínimo 6 caracteres).",
    "auth/too-many-requests": "Muitas tentativas. Aguarde um pouco e tente de novo."
  };
  return map[code] || "Não foi possível autenticar. Tente novamente.";
}

/* =========================================================
   BOOTSTRAP — versão em nuvem (Firebase Auth + Firestore)
========================================================= */
async function showApp(){
  document.getElementById("login-screen").style.display = "none";
  document.getElementById("app").style.display = "flex";
  document.getElementById("user-email").textContent = currentUser.email || "";
  document.getElementById("main").innerHTML = "<p style='padding:20px;'>Carregando seus dados…</p>";
  await loadAll();
  render();
}

function showLogin(){
  document.getElementById("app").style.display = "none";
  document.getElementById("login-screen").style.display = "flex";
  ready = false;
  renderLoginScreen();
}

auth.onAuthStateChanged(async (user)=>{
  currentUser = user;
  if(user){
    await showApp();
  } else {
    showLogin();
  }
});
