<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reverso — Gestor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
  :root{
    --blueprint:#2C6E9E;
    --blueprint-dark:#1f5277;
    --amber:#A85F1C;
    --ink:#1C232B;
    --paper:#EEF1F4;
    --paper-2:#FFFFFF;
    --line:#D8DEE4;
    --danger:#B3261E;
    --danger-bg:#FBEAE9;
    --good:#1E7A46;
    --good-bg:#E7F5EC;
    --warn:#8A5A00;
    --warn-bg:#FDF3DC;
    --radius:8px;
    --font-display:'Big Shoulders Display', Impact, sans-serif;
    --font-body:'IBM Plex Sans', -apple-system, sans-serif;
    --font-mono:'IBM Plex Mono', 'Courier New', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:var(--font-body);
    background:var(--paper);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  #app{display:flex; min-height:100vh;}

  /* ---------- Sidebar ---------- */
  #sidebar{
    width:220px; flex-shrink:0;
    background:var(--ink);
    color:#EDEFF2;
    display:flex; flex-direction:column;
    padding:20px 0;
  }
  .brand{
    font-family:var(--font-display);
    font-weight:800;
    font-size:22px;
    letter-spacing:0.5px;
    color:#fff;
    padding:0 20px 4px 20px;
    line-height:1.05;
  }
  .brand small{
    display:block;
    font-family:var(--font-body);
    font-weight:500;
    font-size:11px;
    letter-spacing:1.5px;
    color:var(--blueprint);
    text-transform:uppercase;
    margin-top:4px;
  }
  nav.mainnav{margin-top:24px; display:flex; flex-direction:column; gap:2px; overflow-y:auto;}
  nav.mainnav button{
    all:unset;
    cursor:pointer;
    padding:10px 20px;
    font-size:13.5px;
    font-weight:500;
    color:#C7CDD6;
    display:flex; align-items:center; gap:10px;
    border-left:3px solid transparent;
  }
  nav.mainnav button:hover{background:#262f3a; color:#fff;}
  nav.mainnav button.active{
    background:#26313d;
    color:#fff;
    border-left:3px solid var(--amber);
  }
  nav.mainnav .icon{width:14px; text-align:center; font-size:12px;}
  .sidebar-footer{
    margin-top:auto; padding:14px 20px 0 20px;
    font-size:10.5px; color:#6b7684; border-top:1px solid #2c3742; padding-top:14px;
  }

  /* ---------- Main ---------- */
  #main{flex:1; padding:28px 34px 60px 34px; min-width:0;}
  .view-header{
    display:flex; justify-content:space-between; align-items:flex-end;
    margin-bottom:22px; flex-wrap:wrap; gap:12px;
  }
  .view-title{
    font-family:var(--font-display);
    font-weight:700;
    font-size:30px;
    color:var(--ink);
    line-height:1;
  }
  .view-sub{font-size:12.5px; color:#6b7684; margin-top:4px;}

  .btn{
    all:unset; cursor:pointer;
    font-family:var(--font-body); font-weight:600; font-size:13px;
    padding:9px 16px; border-radius:6px;
    display:inline-flex; align-items:center; gap:6px;
  }
  .btn-primary{background:var(--blueprint); color:#fff;}
  .btn-primary:hover{background:var(--blueprint-dark);}
  .btn-amber{background:var(--amber); color:#fff;}
  .btn-amber:hover{background:#8f4f16;}
  .btn-ghost{background:transparent; color:var(--ink); border:1px solid var(--line);}
  .btn-ghost:hover{background:#fff;}
  .btn-danger{background:transparent; color:var(--danger); border:1px solid #ecc; }
  .btn-danger:hover{background:var(--danger-bg);}
  .btn-sm{padding:6px 10px; font-size:12px; border-radius:5px;}
  .btn:disabled{opacity:0.45; cursor:not-allowed;}

  .card{
    background:var(--paper-2);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:20px;
  }
  .card + .card{margin-top:16px;}

  .stat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:20px;}
  .stat-card{
    background:var(--paper-2); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px 18px;
  }
  .stat-label{font-size:11px; text-transform:uppercase; letter-spacing:0.6px; color:#8991A0; font-weight:600;}
  .stat-value{font-family:var(--font-mono); font-size:24px; font-weight:500; color:var(--ink); margin-top:6px;}
  .stat-value.amber{color:var(--amber);}
  .stat-value.blueprint{color:var(--blueprint);}
  .stat-value.danger{color:var(--danger);}
  .stat-hint{font-size:10.5px; color:#a0a8b3; margin-top:4px;}

  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  thead th{
    text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:0.5px;
    color:#8991A0; font-weight:600; padding:8px 10px; border-bottom:1px solid var(--line);
  }
  tbody td{padding:10px 10px; border-bottom:1px solid #EEF0F3; vertical-align:middle;}
  tbody tr:hover{background:#F7F9FA;}
  td.num, th.num{text-align:right; font-family:var(--font-mono);}
  td.center, th.center{text-align:center;}
  .row-actions{display:flex; gap:6px; justify-content:flex-end;}

  .badge{
    display:inline-block; padding:3px 9px; border-radius:20px; font-size:11px; font-weight:600;
  }
  .badge-draft{background:#EEF0F3; color:#5b6472;}
  .badge-sent{background:#E4EEF6; color:var(--blueprint);}
  .badge-paid, .badge-accepted{background:var(--good-bg); color:var(--good);}
  .badge-partial{background:var(--warn-bg); color:var(--warn);}
  .badge-overdue, .badge-expired{background:var(--danger-bg); color:var(--danger);}
  .badge-line-works{background:#E4EEF6; color:var(--blueprint);}
  .badge-line-studio{background:#FBEEE3; color:var(--amber);}
  .badge-platform{background:#EEF0F3; color:#5b6472;}

  .empty-state{
    text-align:center; padding:50px 20px; color:#8991A0;
  }
  .empty-state .big{font-family:var(--font-display); font-size:20px; color:#6b7684; margin-bottom:6px;}

  .form-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .form-grid.cols-3{grid-template-columns:1fr 1fr 1fr;}
  .field{display:flex; flex-direction:column; gap:5px;}
  .field.full{grid-column:1 / -1;}
  .field label{font-size:11.5px; font-weight:600; color:#5b6472; text-transform:uppercase; letter-spacing:0.4px;}
  .field input, .field select, .field textarea{
    font-family:var(--font-body); font-size:14px; padding:9px 10px;
    border:1px solid var(--line); border-radius:6px; background:#fff; color:var(--ink);
  }
  .field input:focus, .field select:focus, .field textarea:focus{
    outline:none; border-color:var(--blueprint); box-shadow:0 0 0 3px rgba(44,110,158,0.12);
  }
  .field textarea{resize:vertical; min-height:60px; font-family:var(--font-body);}
  .checkbox-field{display:flex; align-items:center; gap:8px; flex-direction:row;}
  .checkbox-field input{width:16px; height:16px;}

  .section-title{
    font-family:var(--font-display); font-weight:700; font-size:16px; color:var(--ink);
    margin:22px 0 12px 0; padding-bottom:6px; border-bottom:2px solid var(--ink);
    display:flex; justify-content:space-between; align-items:baseline;
  }
  .section-title:first-child{margin-top:0;}
  .section-title .hint{font-family:var(--font-body); font-weight:400; font-size:11.5px; color:#8991A0; text-transform:none;}

  .line-items-table th, .line-items-table td{padding:6px 8px;}
  .line-items-table input{width:100%; border:1px solid var(--line); border-radius:5px; padding:6px 8px; font-size:13px; font-family:var(--font-body);}
  .line-items-table input.num-input{text-align:right; font-family:var(--font-mono);}
  .line-items-table td.amount-cell{font-family:var(--font-mono); text-align:right; padding-right:14px; white-space:nowrap;}
  .line-items-table td.tax-cell{text-align:center;}
  .line-items-table td.tax-cell input{width:16px; height:16px;}
  .remove-line{background:none; border:none; color:#B3261E; cursor:pointer; font-size:16px; line-height:1;}

  .totals-box{margin-left:auto; width:300px; margin-top:10px;}
  .totals-row{display:flex; justify-content:space-between; padding:6px 0; font-size:13.5px;}
  .totals-row.grand{border-top:2px solid var(--ink); margin-top:4px; padding-top:10px; font-weight:700; font-size:17px; font-family:var(--font-mono);}
  .totals-row.balance{color:var(--amber); font-weight:700;}

  .toolbar{display:flex; gap:10px; align-items:center; margin-bottom:16px; flex-wrap:wrap;}
  .toolbar input[type=search], .toolbar select{
    padding:8px 10px; border:1px solid var(--line); border-radius:6px; font-size:13px; font-family:var(--font-body);
  }
  .spacer{flex:1;}

  .toast{
    position:fixed; bottom:22px; right:22px; background:var(--ink); color:#fff;
    padding:11px 18px; border-radius:7px; font-size:13.5px; font-weight:500;
    box-shadow:0 6px 18px rgba(0,0,0,0.18); z-index:999; opacity:0; transform:translateY(8px);
    transition:opacity .2s ease, transform .2s ease; pointer-events:none;
  }
  .toast.show{opacity:1; transform:translateY(0);}

  .modal-overlay{
    position:fixed; inset:0; background:rgba(28,35,43,0.45); z-index:500;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .modal-box{
    background:#fff; border-radius:10px; padding:24px; max-width:420px; width:100%;
    box-shadow:0 20px 50px rgba(0,0,0,0.25);
  }
  .modal-box h3{font-family:var(--font-display); font-size:19px; margin:0 0 10px 0;}
  .modal-box p{font-size:13.5px; color:#5b6472; line-height:1.5;}
  .modal-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:18px;}

  .note-banner{
    background:#FDF3DC; border:1px solid #F0DCA0; color:#6b5108;
    border-radius:6px; padding:10px 14px; font-size:12.5px; line-height:1.5; margin-bottom:16px;
  }
  .note-banner strong{color:#4a3800;}

  .payments-table{margin-top:10px;}
  .payments-add-row{display:flex; gap:8px; align-items:flex-end; margin-top:10px; flex-wrap:wrap;}
  .payments-add-row .field{flex:1; min-width:120px;}

  /* ---------- Client picker (doc editor: search + quick create) ---------- */
  .client-dropdown{position:absolute; top:100%; left:0; right:0; background:#fff; border:1px solid var(--line); border-radius:8px; box-shadow:0 10px 24px rgba(0,0,0,0.12); z-index:50; margin-top:4px; max-height:240px; overflow-y:auto;}
  .client-dropdown-item{padding:9px 12px; font-size:13px; cursor:pointer;}
  .client-dropdown-item:hover{background:#F2F3F5;}
  .client-dropdown-new{color:var(--blueprint); font-weight:600; border-top:1px solid var(--line);}
  .modal-box-wide{max-width:520px;}
  .line-items-table select.catalog-select{width:100%; font-size:12px; padding:6px 4px; border:1px solid var(--line); border-radius:5px; font-family:var(--font-body);}

  /* ---------- Client profile ---------- */
  .profile-name{font-family:var(--font-display); font-size:26px; font-weight:800; color:var(--ink); line-height:1.1;}
  .profile-createddate{font-size:11px; color:#a0a8b3; margin-top:2px;}
  .profile-contact-row{display:flex; gap:8px; font-size:13.5px; color:#5b6472; margin-top:8px;}
  .profile-badges{display:flex; gap:6px; flex-wrap:wrap; margin-top:10px;}
  .badge-category{background:#EEF3F7; color:var(--blueprint); font-size:10.5px;}
  .profile-layout{display:grid; grid-template-columns:1fr 300px; gap:16px; align-items:start;}
  @media (max-width:900px){ .profile-layout{grid-template-columns:1fr;} }
  .profile-sidebar .card{margin-bottom:16px;}
  .side-doc-item{display:flex; justify-content:space-between; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid #EEF0F3; font-size:12.5px; cursor:pointer;}
  .side-doc-item:last-child{border-bottom:none;}
  .side-doc-item:hover{color:var(--blueprint);}

  /* ---------- Category chip select (client editor) ---------- */
  .chip-select{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{border:1px solid var(--line); background:#fff; border-radius:20px; padding:6px 14px; font-size:12.5px; cursor:pointer; color:#5b6472; font-family:var(--font-body);}
  .chip-active{background:var(--blueprint); border-color:var(--blueprint); color:#fff;}

  /* ---------- Tracking add row (client profile) ---------- */
  .tracking-add-row{display:flex; gap:8px; flex-wrap:wrap; align-items:flex-end; margin-bottom:14px;}
  .tracking-add-row select, .tracking-add-row input{padding:8px 9px; border:1px solid var(--line); border-radius:6px; font-family:var(--font-body); font-size:13px;}
  .tracking-add-row input#t-number{flex:1; min-width:140px;}
  .link-strong{color:var(--ink); font-weight:700; cursor:pointer; text-decoration:none;}
  .link-strong:hover{color:var(--blueprint); text-decoration:underline;}

  /* ---------- Dashboard: two-column row (Funil / Manutenção) ---------- */
  .dash-two-col{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:16px;}
  @media (max-width:900px){ .dash-two-col{grid-template-columns:1fr;} }

  /* ---------- Notes box ---------- */
  .note-add-row{display:flex; gap:10px; align-items:flex-end; margin-bottom:14px; flex-wrap:wrap;}
  .note-add-row textarea{flex:1; min-width:200px; min-height:42px; font-family:var(--font-body); font-size:13.5px; padding:9px 10px; border:1px solid var(--line); border-radius:6px; resize:vertical;}
  .notes-list{display:flex; flex-direction:column; gap:0;}
  .note-item{display:flex; justify-content:space-between; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid #EEF0F3;}
  .note-item:last-child{border-bottom:none;}
  .note-body{min-width:0;}
  .note-text{font-size:13.5px; color:var(--ink);}
  .note-dates{display:flex; gap:10px; margin-top:4px; align-items:baseline;}
  .note-created{font-size:10.5px; color:#a0a8b3;}
  .note-due{font-size:13px; font-weight:700; color:var(--ink); font-family:var(--font-mono);}
  .note-due.amber{color:var(--warn);}
  .note-due.danger{color:var(--danger);}
  .note-actions{display:flex; gap:6px; flex-shrink:0;}

  /* ---------- Follow-up box ---------- */
  .followup-list{display:flex; flex-direction:column;}
  .followup-item{display:flex; justify-content:space-between; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid #EEF0F3; flex-wrap:wrap;}
  .followup-item:last-child{border-bottom:none;}
  .followup-info{display:flex; flex-direction:column; gap:3px;}
  .followup-meta{font-size:12px; color:#8991A0;}
  .followup-actions{display:flex; gap:6px; flex-wrap:wrap;}

  /* ---------- Maintenance ---------- */
  .maint-mini-row{display:flex; justify-content:space-between; align-items:center; padding:8px 0; font-size:13.5px; border-bottom:1px solid #EEF0F3;}
  .maint-mini-row:last-of-type{border-bottom:none;}
  .amber-text{color:var(--warn);}
  .danger-text{color:var(--danger);}
  .gauge{height:8px; background:#EEF0F3; border-radius:4px; margin-top:10px; overflow:hidden;}
  .gauge-fill{height:100%; background:var(--good); border-radius:4px; transition:width .2s ease;}
  .gauge-fill.amber{background:var(--warn);}
  .gauge-fill.danger{background:var(--danger);}

  /* ---------- Kanban (Funil de processos) ---------- */
  .kanban-board{display:flex; gap:14px; overflow-x:auto; padding-bottom:10px;}
  .kanban-col{background:#F2F3F5; border-radius:10px; padding:10px; min-width:230px; flex-shrink:0;}
  .kanban-col-header{font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.4px; color:#5b6472; display:flex; justify-content:space-between; align-items:center; padding:2px 4px 8px 4px;}
  .kanban-count{background:#fff; border-radius:20px; padding:1px 8px; font-family:var(--font-mono); font-size:11px;}
  .kanban-cards{display:flex; flex-direction:column; gap:8px;}
  .kanban-empty{text-align:center; color:#b0b7c0; font-size:12px; padding:14px 0;}
  .kanban-card{background:#fff; border:1px solid var(--line); border-radius:8px; padding:10px 11px;}
  .kanban-card-title{font-size:13px; font-weight:600; color:var(--ink); margin-bottom:4px;}
  .kanban-card-meta{font-size:11.5px; color:#8991A0; margin-bottom:3px;}
  .kanban-card-link{font-size:11px; color:var(--blueprint); margin-bottom:3px;}
  .kanban-card-date{font-size:11.5px; font-weight:600; font-family:var(--font-mono); margin:4px 0;}
  .kanban-card-date.amber{color:var(--warn);}
  .kanban-card-date.danger{color:var(--danger);}
  .kanban-card-actions{display:flex; gap:6px; margin-top:8px; align-items:center;}
  .kanban-stage-select{flex:1; font-size:11px; padding:5px 6px; border:1px solid var(--line); border-radius:5px; font-family:var(--font-body);}

  /* ---------- Pricing calculators (Studio / Works) ---------- */
  .calc-grid{display:grid; grid-template-columns:minmax(280px,380px) 1fr; gap:16px; align-items:start;}
  @media (max-width:900px){ .calc-grid{grid-template-columns:1fr;} }
  .calc-cost-line{display:flex; justify-content:space-between; padding:6px 0; font-size:13px; border-bottom:1px solid #F0F1F3;}
  .calc-cost-line span:first-child{color:#5b6472;}
  .calc-cost-line span:last-child{font-family:var(--font-mono);}
  .calc-cost-line.total{font-weight:700; border-bottom:none; border-top:2px solid var(--ink); padding-top:10px; margin-top:2px; font-size:15px;}
  .calc-cost-line.total span{font-family:var(--font-mono);}
  .channel-tiles{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:6px;}
  @media (max-width:520px){ .channel-tiles{grid-template-columns:1fr;} }
  .channel-tile{border:1.5px solid var(--line); border-radius:9px; padding:13px 14px; cursor:pointer; transition:border-color .15s ease, background .15s ease; background:#fff;}
  .channel-tile:hover{border-color:#b9c3cd;}
  .channel-tile.selected{border-color:var(--blueprint); background:#F2F7FB;}
  .channel-tile .ch-name{font-size:10.5px; text-transform:uppercase; letter-spacing:0.6px; color:#8991A0; font-weight:700; display:flex; justify-content:space-between; align-items:center;}
  .channel-tile .ch-price{font-family:var(--font-mono); font-size:20px; font-weight:600; color:var(--ink); margin-top:5px;}
  .channel-tile .ch-profit{font-size:11px; color:var(--good); margin-top:3px;}
  .channel-tile .ch-check{width:16px; height:16px; border-radius:50%; border:1.5px solid var(--line); flex-shrink:0;}
  .channel-tile.selected .ch-check{background:var(--blueprint); border-color:var(--blueprint);}
  .calc-list-row{display:flex; justify-content:space-between; align-items:center; padding:11px 0; border-bottom:1px solid #EEF0F3; gap:10px;}
  .calc-list-row:last-child{border-bottom:none;}
  .calc-list-row .li-desc{font-size:13.5px; font-weight:500;}
  .calc-list-row .li-meta{font-size:11px; color:#8991A0; margin-top:2px;}
  .calc-list-row .li-price{font-family:var(--font-mono); font-size:14px; font-weight:600; white-space:nowrap;}
  .pill{display:inline-block; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:700;}
  .pill-ok{background:var(--good-bg); color:var(--good);}
  .pill-warn{background:var(--danger-bg); color:var(--danger);}
  .calc-empty-hint{font-size:12.5px; color:#8991A0; padding:16px 0; text-align:center;}
  .material-row-grid{display:grid; grid-template-columns:2fr 1fr 1fr auto; gap:10px; align-items:end; margin-bottom:10px;}
  @media (max-width:640px){ .material-row-grid{grid-template-columns:1fr 1fr; }}

  #import-file-input{display:none;}

  /* ---------- Login screen ---------- */
  #login-screen{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--ink); padding:20px;
  }
  .login-card{
    background:#fff; border-radius:12px; padding:36px 34px; max-width:380px; width:100%;
    box-shadow:0 24px 60px rgba(0,0,0,0.35);
  }
  .login-brand{font-family:var(--font-display); font-weight:800; font-size:26px; color:var(--ink); margin-bottom:2px;}
  .login-brand small{display:block; font-size:11px; letter-spacing:1.5px; color:var(--blueprint); text-transform:uppercase; font-weight:600; margin-bottom:22px;}
  .login-card .field{margin-bottom:14px;}
  .login-error{background:var(--danger-bg); color:var(--danger); font-size:12.5px; padding:9px 12px; border-radius:6px; margin-bottom:14px; display:none;}
  .login-error.show{display:block;}
  .login-actions{display:flex; flex-direction:column; gap:8px; margin-top:8px;}
  .login-toggle{text-align:center; font-size:12.5px; color:#6b7684; margin-top:16px;}

/* =========================================================

const COLLECTION_NAMES = ["clients", "estimates", "invoices", "expenses", "marketplaceSales", "notes", "pipeline", "catalog"];

/* Pricing premises — same model as the Studio/Works Excel calculators, now editable in-app. */

};

const EXPENSE_CATEGORIES = [
  "Materiais / filamento",
  "Equipamento",

];

let state = {
  settings: null,
  clients: [],
  estimates: [],
  invoices: [],
  expenses: [],
  marketplaceSales: [],
  notes: [],
  pipeline: [],
  catalog: []
};

let ready = false;

function userDocRef(){
  return db.collection("users").doc(currentUser.uid);
}
function userColRef(name){
  return userDocRef().collection(name);
}

async function loadAll(){
  const settingsSnap = await userDocRef().get();
  const savedSettings = settingsSnap.exists ? settingsSnap.data() : {};
  state.settings = Object.assign({}, DEFAULT_SETTINGS, savedSettings);
  state.settings.pricing = Object.assign({}, DEFAULT_PRICING, savedSettings.pricing || {});
  state.settings.pricing.plataformas = Object.assign({}, DEFAULT_PRICING.plataformas, (savedSettings.pricing||{}).plataformas || {});
  if(!Array.isArray(state.settings.pricing.materiais) || state.settings.pricing.materiais.length===0){
    state.settings.pricing.materiais = JSON.parse(JSON.stringify(DEFAULT_PRICING.materiais));
  }
  for(const name of COLLECTION_NAMES){
    state[name] = await loadCollection(name);
  }
  state.clients = state.clients.map(normalizeClient);
  ready = true;
}

async function loadCollection(name){
  try{
    const snap = await userColRef(name).get();
    return snap.docs.map(d => d.data());
  }catch(e){
    showToast("Erro ao carregar " + name + ". Verifique sua conexão.");
    return [];
  }
}

/* Grava cada item atual e apaga do Firestore qualquer doc que não exista mais localmente (foi removido). */
async function persist(collectionKey){
  try{
    if(collectionKey === "settings"){
      await userDocRef().set(state.settings, {merge:false});
      return true;
    }
    const col = userColRef(collectionKey);
    const existingSnap = await col.get();
    const existingIds = new Set(existingSnap.docs.map(d=>d.id));
    const currentIds = new Set(state[collectionKey].map(x=>x.id));
    const batch = db.batch();
    state[collectionKey].forEach(item => batch.set(col.doc(String(item.id)), item));
    existingIds.forEach(id => { if(!currentIds.has(id)) batch.delete(col.doc(id)); });
    await batch.commit();
    return true;
  }catch(e){
    showToast("Erro ao salvar. Verifique sua conexão e tente novamente.");
    return false;
  }
}

async function persistAll(){
  await persist("settings");
  for(const name of COLLECTION_NAMES){ await persist(name); }
}


/* =========================================================
   HELPERS
========================================================= */
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

function fmtMoney(n){
  n = Number(n) || 0;
  return "$" + n.toLocaleString("en-US", {minimumFractionDigits:2, maximumFractionDigits:2});
}
function fmtDate(iso){
  if(!iso) return "—";
  const d = new Date(iso + "T00:00:00");
  if(isNaN(d)) return iso;
  return d.toLocaleDateString("pt-BR", {day:"2-digit", month:"2-digit", year:"numeric"});
}
function todayISO(){
  return new Date().toISOString().slice(0,10);
}
function addDays(iso, days){
  const d = new Date(iso + "T00:00:00");
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0,10);
}
function escapeHTML(str){
  return String(str == null ? "" : str).replace(/[&<>"']/g, m => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[m]));
}
function clientName(id){
  const c = state.clients.find(x => x.id === id);
  return c ? c.name : "(cliente removido)";
}
function clientById(id){
  return state.clients.find(x => x.id === id) || null;
}

/* =========================================================
   CLIENT DATA MODEL — tipo, categorias, endereço estruturado, tracking
========================================================= */
const CLIENT_CATEGORY_OPTIONS = [
  "Peça automotiva", "Estrutura mecânica", "Eletrodoméstico", "Móveis",
  "Aparelho vintage", "Náutica", "RC", "Aquarismo", "Produto autoral (Studio)"
];
const TRACKING_CARRIERS = ["UPS", "USPS", "FedEx", "DHL", "Outro"];

function newClientSkeleton(){
  return {
    id: uid(),
    name: "",
    type: "individual", // "individual" (pessoa física / cliente final) | "company" (empresa, não tributável)
    email: "",
    phone: "",
    categories: [],
    address: {line1:"", line2:"", city:"", state:"", zip:"", country:"Estados Unidos"},
    tracking: [],
    notes: "",
    createdDate: todayISO()
  };
}
/* Migra clientes salvos no formato antigo (endereço como texto único, sem tipo/categorias/tracking/data). */
function normalizeClient(c){
  const out = Object.assign({}, c);
  if(typeof out.address === "string" || !out.address){
    out.address = {line1: out.address || "", line2:"", city:"", state:"", zip:"", country:"Estados Unidos"};
  } else {
    out.address = Object.assign({line1:"", line2:"", city:"", state:"", zip:"", country:"Estados Unidos"}, out.address);
  }
  out.type = out.type === "company" ? "company" : "individual";
  out.categories = Array.isArray(out.categories) ? out.categories : [];
  out.tracking = Array.isArray(out.tracking) ? out.tracking : [];
  out.createdDate = out.createdDate || null;
  return out;
}
function newTrackingSkeleton(){
  return {id: uid(), direction:"envio", carrier:"UPS", number:"", date: todayISO(), notes:""};
}
/* Badge HTML usado no editor de orçamento/fatura pra deixar claro se o cliente é PF ou empresa (empresa = não tributável). */
function clientTypeBadgeHTML(client){
  if(!client) return '<span class="stat-hint">Cliente não encontrado</span>';
  return client.type === "company"
    ? `<span class="badge badge-line-studio">Empresa · não tributável</span>`
    : `<span class="badge badge-line-works">Pessoa física</span>`;
}
function trackingUrl(carrier, number){
  const n = encodeURIComponent(String(number||"").trim());
  if(!n) return null;
  switch(carrier){
    case "UPS": return "https://www.ups.com/track?loc=en_US&tracknum=" + n;
    case "USPS": return "https://tools.usps.com/go/TrackConfirmAction?tLabels=" + n;
    case "FedEx": return "https://www.fedex.com/fedextrack/?trknbr=" + n;
    case "DHL": return "https://www.dhl.com/us-en/home/tracking.html?tracking-id=" + n;
    default: return null;
  }
}
/* Endereço no estilo do formulário da UPS: linha 1, linha 2 (opcional), cidade/estado/CEP, país. */
function formatAddressLines(addr){
  if(!addr) return [];
  if(typeof addr === "string") return addr.split("\n").map(s=>s.trim()).filter(Boolean);
  const lines = [];
  if(addr.line1) lines.push(addr.line1);
  if(addr.line2) lines.push(addr.line2);
  const cityStateZip = [addr.city, addr.state].filter(Boolean).join(", ") + (addr.zip ? " " + addr.zip : "");
  if(cityStateZip.trim()) lines.push(cityStateZip.trim());
  if(addr.country && addr.country.trim() && addr.country !== "Estados Unidos") lines.push(addr.country);
  return lines;
}
function formatAddressHTML(addr){
  const lines = formatAddressLines(addr);
  return lines.length ? lines.map(escapeHTML).join("<br>") : "";
}

/* Máscara de telefone americano: aceita dígitos digitados em sequência e formata (000) 000-0000. */
function formatUSPhone(raw){
  const d = digitsOnly(raw).slice(0,10);
  if(d.length === 0) return "";
  if(d.length < 4) return "(" + d;
  if(d.length < 7) return "(" + d.slice(0,3) + ") " + d.slice(3);
  return "(" + d.slice(0,3) + ") " + d.slice(3,6) + "-" + d.slice(6);
}
function attachPhoneMask(input){
  if(!input) return;
  input.addEventListener("input", ()=>{
    const pos = input.selectionStart;
    const before = input.value.length;
    input.value = formatUSPhone(input.value);
    const after = input.value.length;
    const newPos = Math.max(0, (pos||0) + (after-before));
    try{ input.setSelectionRange(newPos, newPos); }catch(e){}
  });
}
/* Diferença em dias inteiros entre duas datas ISO (b - a). */
function daysBetween(isoA, isoB){
  const a = new Date((isoA||todayISO()) + "T00:00:00");
  const b = new Date((isoB||todayISO()) + "T00:00:00");
  return Math.round((b - a) / 86400000);
}
/* Só dígitos — usado para montar o link do WhatsApp a partir do telefone cadastrado. */
function digitsOnly(str){
  return String(str||"").replace(/\D/g, "");
}
function waLink(phone, text){
  const digits = digitsOnly(phone);
  if(!digits) return null;
  return "https://wa.me/" + digits + "?text=" + encodeURIComponent(text);
}
function mailtoLink(email, subject, body){
  if(!email) return null;
  return "mailto:" + encodeURIComponent(email) + "?subject=" + encodeURIComponent(subject) + "&body=" + encodeURIComponent(body);
}
async function copyToClipboard(text){
  try{
    await navigator.clipboard.writeText(text);
    showToast("Mensagem copiada.");
  }catch(e){
    showToast("Não foi possível copiar automaticamente. Selecione o texto manualmente.");
  }
}
function buildFollowUpMessage(client, estimate){
  const tpl = state.settings.followUpMessageTemplate || DEFAULT_SETTINGS.followUpMessageTemplate;
  const dias = daysBetween(estimate.sentDate || estimate.date, todayISO());
  return tpl
    .replace(/\{cliente\}/g, client ? client.name : "")
    .replace(/\{numero\}/g, estimate.number || "")
    .replace(/\{valor\}/g, fmtMoney(calcDocTotals(estimate).total))
    .replace(/\{dias\}/g, String(dias));
}
/* Orçamentos "sent" há >= followUpDays dias, sem fatura já gerada a partir deles,
   e sem contato registrado nos últimos 5 dias (evita ficar reaparecendo todo dia). */
function estimatesNeedingFollowUp(){
  const threshold = Number(state.settings.followUpDays) || 15;
  return state.estimates.filter(e => {
    if(e.status !== "sent") return false;
    const already = state.invoices.some(inv => inv.fromEstimateNumber === e.number);
    if(already) return false;
    const dias = daysBetween(e.sentDate || e.date, todayISO());
    if(dias < threshold) return false;
    if(e.lastFollowUpAt && daysBetween(e.lastFollowUpAt, todayISO()) < 5) return false;
    return true;
  }).sort((a,b)=> daysBetween(b.sentDate||b.date, todayISO()) - daysBetween(a.sentDate||a.date, todayISO()));
}

/* =========================================================
   NOTES (caixa de notas do Painel)
========================================================= */
function newNoteSkeleton(){

    id: uid(),
    text: "",
    createdDate: todayISO(),
    dueDate: null,
    done: false

/* =========================================================
   PIPELINE (FUNIL DE PROCESSOS)
========================================================= */
const PIPELINE_STAGES = [
  {id:"fila", label:"Fila"},

/* Soma as horas de máquina de cards concluídos/entregues desde a última limpeza registrada. */
function machineHoursSinceLastCleaning(){
  const since = state.settings.lastCleaningDate;
  return state.pipeline
    .filter(c => Number(c.horasMaquina) > 0)
    .filter(c => {
      const ref = c.completedAt || c.forecastDate || c.createdAt;
      if(!since) return true;
      return ref && ref >= since;
    })
    .reduce((s,c)=> s + (Number(c.horasMaquina)||0), 0);
}

/* =========================================================
   MANUTENÇÃO (LIMPEZA DA MÁQUINA)
========================================================= */
function maintenanceStatus(){
  const s = state.settings;
  const last = s.lastCleaningDate;
  const daysSince = last ? daysBetween(last, todayISO()) : null;
  const daysLeft = daysSince === null ? (Number(s.cleaningIntervalDays)||14) : (Number(s.cleaningIntervalDays)||14) - daysSince;
  const hoursSince = machineHoursSinceLastCleaning();
  const hoursLeft = (Number(s.cleaningIntervalHours)||150) - hoursSince;
  return {last, daysSince, daysLeft, hoursSince, hoursLeft};
}

/* Totals now support per-item taxability: only items with taxable!==false count toward the taxable base.
   Clientes do tipo "empresa" nunca são tributados, independente do checkbox de cada item. */
function calcDocTotals(doc){
  let subtotal = 0, taxableBase = 0;
  const client = clientById(doc.clientId);
  const clientIsCompany = client && client.type === "company";
  (doc.items || []).forEach(it => {
    const amt = (Number(it.qty)||0) * (Number(it.rate)||0);
    subtotal += amt;
    if(it.taxable !== false && !clientIsCompany) taxableBase += amt;
  });
  const taxAmount = doc.applyTax ? taxableBase * (Number(doc.taxRate)||0) : 0;
  const total = subtotal + taxAmount;
  return {subtotal, taxableBase, taxAmount, total};
}

/* Payments: real payments array is the source of truth going forward.
   For invoices saved by an earlier version of this tool (status "paid", no payments logged),
   synthesize a single payment so historic totals still show up correctly in reports. */
function effectivePayments(inv){
  if(inv.payments && inv.payments.length) return inv.payments;
  if(inv.status === "paid"){
    const t = calcDocTotals(inv);
    if(t.total > 0){
      return [{id:"legacy", date: inv.paidDate || inv.date, amount: t.total, note:"Pagamento único (registrado antes do controle de parcelas)"}];
    }
  }
  return [];
}
function sumPayments(inv){
  return effectivePayments(inv).reduce((s,p)=> s + (Number(p.amount)||0), 0);
}
function balanceDue(inv){
  const t = calcDocTotals(inv);
  return Math.max(0, t.total - sumPayments(inv));
}
function allPaymentsFlat(){
  const list = [];
  state.invoices.forEach(inv => effectivePayments(inv).forEach(p => list.push(Object.assign({}, p, {invoiceId:inv.id, invoiceNumber:inv.number}))));
  return list;
}

/* =========================================================
   PRICING CALCULATORS (Studio / Works)
   Same formulas as the Excel calculators, now driven by state.settings.pricing.
========================================================= */
function findMaterial(pricing, nome){
  return (pricing.materiais||[]).find(m => m.nome === nome) || null;
}

function materialCost(pricing, nome, manualPriceG, peso){
  const mat = findMaterial(pricing, nome);
  const precoG = mat ? Number(mat.precoG)||0 : Number(manualPriceG)||0;
  const refugo = mat ? Number(mat.refugo)||0 : Number(pricing.taxaRefugoGeral)||0;
  return Number(peso||0) * precoG * (1 + refugo);
}

/* Studio: one product priced across venda direta + Etsy + eBay + Amazon. */
function calcStudioItem(pricing, input){
  const peso = Number(input.peso)||0, tempo = Number(input.tempo)||0, pos = Number(input.pos)||0;
  const custoMaterial = materialCost(pricing, input.material, input.manualPrice, peso);
  const custoMaquina = tempo * (Number(pricing.taxaMaquina)||0);
  const custoMaoObra = (pos/60) * (Number(pricing.taxaMaoObra)||0);
  const custoTotal = custoMaterial + custoMaquina + custoMaoObra;

  const precoDireto = custoTotal * (Number(pricing.markupDireto)||0);
  const lucroDireto = precoDireto - custoTotal;

  function porPlataforma(p){
    const denom = 1 - (Number(p.variavel)||0) - (Number(pricing.margemAlvoMarketplace)||0);
    const preco = denom > 0 ? (custoTotal + (Number(p.fixo)||0)) / denom : 0;
    const taxa = preco*(Number(p.variavel)||0) + (Number(p.fixo)||0);
    const lucro = preco - custoTotal - taxa;
    return {preco, taxa, lucro};
  }

  return {
    custoMaterial, custoMaquina, custoMaoObra, custoTotal,
    direto: {preco: precoDireto, lucro: lucroDireto},
    etsy: porPlataforma(pricing.plataformas.etsy),
    ebay: porPlataforma(pricing.plataformas.ebay),
    amazon: porPlataforma(pricing.plataformas.amazon)
  };
}

/* Works: one part priced with peça + NRE (with deposit/balance and repetition royalty). */
function calcWorksItem(pricing, input){
  const peso = Number(input.peso)||0, tempo = Number(input.tempo)||0, pos = Number(input.pos)||0;
  const horasNRE = Number(input.horasNRE)||0;
  const repeticao = !!input.repeticao;

  const custoMaterial = materialCost(pricing, input.material, input.manualPrice, peso);
  const custoMaquina = tempo * (Number(pricing.taxaMaquina)||0);
  const custoMaoObra = (pos/60) * (Number(pricing.taxaMaoObra)||0);
  const custoPeca = custoMaterial + custoMaquina + custoMaoObra;

  const precoPeca = custoPeca * (Number(pricing.markupDireto)||0);
  const lucroPeca = precoPeca - custoPeca;

  const nreCheio = horasNRE * (Number(pricing.taxaNRE)||0);
  const precoNRE = repeticao ? nreCheio * (Number(pricing.royaltyRepeticao)||0) : nreCheio;
  const deposito = precoNRE * (Number(pricing.depositoNRE)||0);
  const saldo = precoNRE - deposito;

  const totalPedido = precoPeca + precoNRE;
  const abaixoDoMinimo = totalPedido < (Number(pricing.pedidoMinimo)||0);

  return {
    custoMaterial, custoMaquina, custoMaoObra, custoPeca,
    precoPeca, lucroPeca, nreCheio, precoNRE, deposito, saldo,
    totalPedido, abaixoDoMinimo
  };
}

/* =========================================================
   ESTIMATE STATUS (automático — sem seleção manual)
   ---------------------------------------------------------
   O orçamento não tem mais um campo de status editável: ele nasce
   "sent" ao ser salvo pela primeira vez (data.sentDate registrada),
   vira "accepted" quando é convertido em fatura, e é exibido como
   "Expirado" (sem alterar o dado salvo) quando a validade já passou.
========================================================= */
function effectiveEstimateStatus(e){
  if(e.status === "accepted") return "accepted";
  if(e.status === "sent" && e.validUntil && e.validUntil < todayISO()) return "expired";
  return e.status || "sent";
}

function exportBackup(){
  const payload = {
    app: "reverso-gestor",
    version: 2,
    exportedAt: new Date().toISOString(),
    settings: state.settings,
    clients: state.clients,
    estimates: state.estimates,
    invoices: state.invoices,
    expenses: state.expenses,
    marketplaceSales: state.marketplaceSales
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "reverso-backup-" + todayISO() + ".json";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=> URL.revokeObjectURL(url), 1000);
  showToast("Backup exportado.");
}

function triggerImport(){
  document.getElementById("import-file-input").click();
}

async function handleImportFile(file){
  if(!file) return;
  let payload;
  try{
    const text = await file.text();
    payload = JSON.parse(text);
  }catch(e){
    showToast("Não consegui ler esse arquivo. Verifique se é um backup válido (.json).");
    return;
  }
  if(!payload || typeof payload !== "object" || !("clients" in payload || "invoices" in payload)){
    showToast("Arquivo não parece ser um backup do Reverso Gestor.");
    return;
  }
  confirmModal(
    "Importar backup?",
    "Isso substitui todos os dados atuais (clientes, orçamentos, faturas, despesas, vendas de marketplace e configurações) pelos do arquivo. Não pode ser desfeito.",
    async ()=>{
      state.settings = Object.assign({}, DEFAULT_SETTINGS, payload.settings || {});
      state.clients = payload.clients || [];
      state.estimates = payload.estimates || [];
      state.invoices = payload.invoices || [];
      state.expenses = payload.expenses || [];
      state.marketplaceSales = payload.marketplaceSales || [];
      await persistAll();
      showToast("Backup importado com sucesso.");
      render();
    }
  );
}

function urgencyClass(dueDate){
  if(!dueDate) return "";
  const d = daysBetween(todayISO(), dueDate);
  if(d < 0) return "danger";
  if(d <= 2) return "amber";
  return "";
}

              <td><span class="badge badge-${effectiveEstimateStatus(e)}">${statusLabel('estimate', effectiveEstimateStatus(e))}</span></td>
              <td class="row-actions"><button class="btn btn-sm btn-ghost" data-open-estimate="${e.id}">Abrir</button></td>
            </tr>`).join("")}
        </tbody>
      </table>`}
    </div>

    <div class="dash-two-col">
      <div class="card">
        <div class="section-title" style="margin-top:0;">Próximas entregas — Funil<span class="hint">próximos 3 dias ou atrasadas</span></div>
        ${upcomingCards.length===0 ? `<div class="empty-state" style="padding:20px;"><div class="big">Nada previsto</div>Sem entregas próximas no funil.</div>` : `
        <div class="notes-list">
          ${upcomingCards.map(c => `
            <div class="note-item">
              <div class="note-body">
                <div class="note-text">${escapeHTML(c.title||"(sem título)")} <span class="stat-hint">— ${escapeHTML(clientName(c.clientId))}</span></div>
                <div class="note-dates">
                  <span class="note-created">${escapeHTML(stageLabel(c.stage))}</span>
                  <span class="note-due ${urgencyClass(c.forecastDate)}">${daysBetween(todayIso,c.forecastDate)<0?"atrasado — ":"previsto — "}${fmtDate(c.forecastDate)}</span>
                </div>
              </div>
              <div class="note-actions"><button class="btn btn-sm btn-ghost" data-open-card="${c.id}">Abrir</button></div>
            </div>`).join("")}
        </div>`}
      </div>
      <div class="card">
        <div class="section-title" style="margin-top:0;">Limpeza da máquina</div>
        <div class="maint-mini">
          <div class="maint-mini-row">
            <span>Dias até a limpeza</span>
            <strong class="${cleaningInfo.daysLeft<=0 ? 'danger-text' : (cleaningInfo.daysLeft<=3?'amber-text':'')}">${cleaningInfo.daysLeft<=0 ? "atrasada" : cleaningInfo.daysLeft + " dia(s)"}</strong>
          </div>
          <div class="maint-mini-row">
            <span>Horas de máquina até a limpeza</span>
            <strong class="${cleaningInfo.hoursLeft<=0 ? 'danger-text' : (cleaningInfo.hoursLeft<=20?'amber-text':'')}">${cleaningInfo.hoursLeft<=0 ? "atrasada" : cleaningInfo.hoursLeft.toFixed(1) + " h"}</strong>
          </div>
          <button class="btn btn-sm btn-ghost" id="goto-maintenance" style="margin-top:10px;">Ver detalhes</button>
        </div>
      </div>
    </div>
  `;

  main.querySelectorAll("[data-open-invoice]").forEach(b => b.addEventListener("click", ()=>{
    openDocEditor("invoice", state.invoices.find(x=>x.id===b.dataset.openInvoice));
  }));
  main.querySelectorAll("[data-open-estimate]").forEach(b => b.addEventListener("click", ()=>{
    openDocEditor("estimate", state.estimates.find(x=>x.id===b.dataset.openEstimate));
  }));
  main.querySelectorAll("[data-open-card]").forEach(b => b.addEventListener("click", ()=>{
    const card = state.pipeline.find(x=>x.id===b.dataset.openCard);
    if(card){ editingPipelineCard = {data: JSON.parse(JSON.stringify(card)), isNew:false}; render(); }
  }));
  const gotoBtn = document.getElementById("goto-maintenance");
  if(gotoBtn) gotoBtn.onclick = ()=>{ currentView = "maintenance"; render(); };

  document.getElementById("note-add").onclick = async ()=>{
    const text = document.getElementById("note-text").value.trim();
    if(!text){ showToast("Escreva algo na nota."); return; }
    const due = document.getElementById("note-duedate").value || null;
    const note = newNoteSkeleton();
    note.text = text;
    note.dueDate = due;
    state.notes.push(note);
    await persist("notes");
    showToast("Nota adicionada.");
    render();
  };
  main.querySelectorAll("[data-note-done]").forEach(b=> b.onclick = async ()=>{
    const n = state.notes.find(x=>x.id===b.dataset.noteDone);
    if(n){ n.done = true; await persist("notes"); showToast("Nota concluída."); render(); }
  });
  main.querySelectorAll("[data-note-del]").forEach(b=> b.onclick = async ()=>{
    state.notes = state.notes.filter(x=>x.id!==b.dataset.noteDel);
    await persist("notes");
    showToast("Nota excluída.");
    render();
  });

  main.querySelectorAll("[data-copy-msg]").forEach(b=> b.onclick = ()=>{
    const e = state.estimates.find(x=>x.id===b.dataset.copyMsg);
    const c = e ? clientById(e.clientId) : null;
    copyToClipboard(buildFollowUpMessage(c, e));
  });
  main.querySelectorAll("[data-mark-contacted]").forEach(b=> b.onclick = async ()=>{
    const e = state.estimates.find(x=>x.id===b.dataset.markContacted);
    if(e){ e.lastFollowUpAt = todayISO(); await persist("estimates"); showToast("Marcado como contatado."); render(); }
  });
}

function statusLabel(type, status){
  const map = {
    draft:"Rascunho", sent: type==="estimate" ? "Enviado":"Enviada",
    partial:"Parcialmente paga",
    paid:"Paga", overdue:"Atrasada", accepted:"Aceito", expired:"Expirado"
  };
  return map[status] || status;
}

/* =========================================================
   PIPELINE VIEW (FUNIL DE PROCESSOS)
========================================================= */
function renderPipeline(main){
  let lineFilter = "";
  let search = "";

  function draw(){
    let cards = state.pipeline.slice();
    if(lineFilter) cards = cards.filter(c => c.businessLine === lineFilter);
    if(search) cards = cards.filter(c => (c.title||"").toLowerCase().includes(search.toLowerCase()) || clientName(c.clientId).toLowerCase().includes(search.toLowerCase()));

    main.innerHTML = `
      <div class="view-header">
        <div>
          <div class="view-title">Funil de processos</div>
          <div class="view-sub">${state.pipeline.length} processo(s) — conectado a orçamentos e faturas pelas datas de entrega</div>
        </div>
        <button class="btn btn-primary" id="new-card">+ Novo processo</button>
      </div>
      <div class="toolbar">
        <input type="search" id="search-card" placeholder="Buscar por título ou cliente…" value="${escapeHTML(search)}">
        <select id="filter-line">
          <option value="">Todas as linhas</option>
          <option value="Reverso Works" ${lineFilter==="Reverso Works"?"selected":""}>Reverso Works</option>
          <option value="Reverso Studio" ${lineFilter==="Reverso Studio"?"selected":""}>Reverso Studio</option>
        </select>
      </div>
      <div class="kanban-board">
        ${PIPELINE_STAGES.map(stage => {
          const stageCards = cards.filter(c => c.stage === stage.id)
            .sort((a,b)=> (a.forecastDate||"9999").localeCompare(b.forecastDate||"9999"));
          return `
          <div class="kanban-col">
            <div class="kanban-col-header">${stage.label} <span class="kanban-count">${stageCards.length}</span></div>
            <div class="kanban-cards">
              ${stageCards.length===0 ? `<div class="kanban-empty">—</div>` : stageCards.map(c => `
                <div class="kanban-card">
                  <div class="kanban-card-title">${escapeHTML(c.title||"(sem título)")}</div>
                  <div class="kanban-card-meta">${escapeHTML(clientName(c.clientId))}</div>
                  <div class="kanban-card-meta"><span class="badge badge-line-${(c.businessLine||"").toLowerCase().includes("studio")?"studio":"works"}">${escapeHTML(c.businessLine||"—")}</span></div>
                  ${c.estimateId ? `<div class="kanban-card-link">Orç. ${escapeHTML((state.estimates.find(e=>e.id===c.estimateId)||{}).number || "")}</div>` : ""}
                  ${c.invoiceId ? `<div class="kanban-card-link">Fat. ${escapeHTML((state.invoices.find(i=>i.id===c.invoiceId)||{}).number || "")}</div>` : ""}
                  ${c.forecastDate ? `<div class="kanban-card-date ${urgencyClass(c.forecastDate)}">${daysBetween(todayISO(),c.forecastDate)<0 ? "atrasado — " : "previsto — "}${fmtDate(c.forecastDate)}</div>` : ""}
                  <div class="kanban-card-actions">
                    <select class="kanban-stage-select" data-move="${c.id}">
                      ${PIPELINE_STAGES.map(s2=>`<option value="${s2.id}" ${s2.id===c.stage?"selected":""}>${s2.label}</option>`).join("")}
                    </select>
                    <button class="btn btn-sm btn-ghost" data-edit-card="${c.id}">Abrir</button>
                  </div>
                </div>`).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>
    `;
    document.getElementById("new-card").onclick = ()=>{ editingPipelineCard = {data: newPipelineSkeleton(), isNew:true}; render(); };
    document.getElementById("search-card").oninput = e=>{ search=e.target.value; draw(); };
    document.getElementById("filter-line").onchange = e=>{ lineFilter=e.target.value; draw(); };
    main.querySelectorAll("[data-edit-card]").forEach(b=> b.onclick = ()=>{
      const c = state.pipeline.find(x=>x.id===b.dataset.editCard);
      editingPipelineCard = {data: JSON.parse(JSON.stringify(c)), isNew:false};
      render();
    });
    main.querySelectorAll("[data-move]").forEach(sel=> sel.onchange = async ()=>{
      const c = state.pipeline.find(x=>x.id===sel.dataset.move);
      if(!c) return;
      c.stage = sel.value;
      if(sel.value === "entregue" && !c.completedAt) c.completedAt = todayISO();
      await persist("pipeline");
      showToast("Etapa atualizada.");
      draw();
    });
  }
  draw();
}

/* =========================================================
   MAINTENANCE VIEW (LIMPEZA DA MÁQUINA)
========================================================= */
function renderMaintenance(main){
  const info = maintenanceStatus();
  const s = state.settings;
  const contributingCards = state.pipeline
    .filter(c => Number(c.horasMaquina) > 0)
    .filter(c => {
      const ref = c.completedAt || c.forecastDate || c.createdAt;
      if(!s.lastCleaningDate) return true;
      return ref && ref >= s.lastCleaningDate;
    })
    .sort((a,b)=> (b.completedAt||b.forecastDate||b.createdAt||"").localeCompare(a.completedAt||a.forecastDate||a.createdAt||""));

  const dayPct = Math.max(0, Math.min(100, 100 - (info.daysLeft / (Number(s.cleaningIntervalDays)||14) * 100)));
  const hourPct = Math.max(0, Math.min(100, 100 - (info.hoursLeft / (Number(s.cleaningIntervalHours)||150) * 100)));
  const overdueStatus = info.daysLeft<=0 || info.hoursLeft<=0;

  main.innerHTML = `
    <div class="view-header">
      <div>
        <div class="view-title">Manutenção da máquina</div>
        <div class="view-sub">Limpeza da X2D — ventilação/segurança já é pré-requisito no roadmap; a limpeza recorrente evita falhas de impressão</div>
      </div>
      <button class="btn btn-primary" id="log-cleaning">Registrar limpeza hoje</button>
    </div>

    ${overdueStatus ? `<div class="card" style="border-color:#eecccb; background:var(--danger-bg); margin-bottom:16px;"><strong style="color:var(--danger);">Limpeza atrasada</strong> — registre a limpeza assim que possível.</div>` : ""}

    <div class="stat-grid" style="grid-template-columns:1fr 1fr;">
      <div class="stat-card">
        <div class="stat-label">Dias desde a última limpeza</div>
        <div class="stat-value">${info.daysSince===null ? "—" : info.daysSince}</div>
        <div class="stat-hint">Intervalo alvo: ${s.cleaningIntervalDays} dias</div>
        <div class="gauge"><div class="gauge-fill ${info.daysLeft<=0?'danger':(info.daysLeft<=3?'amber':'')}" style="width:${dayPct}%;"></div></div>
        <div class="stat-hint">${info.daysLeft<=0 ? "Atrasada" : info.daysLeft + " dia(s) restante(s)"}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Horas de máquina desde a última limpeza</div>
        <div class="stat-value">${info.hoursSince.toFixed(1)} h</div>
        <div class="stat-hint">Intervalo alvo: ${s.cleaningIntervalHours} h (referência do roadmap: ~150h)</div>
        <div class="gauge"><div class="gauge-fill ${info.hoursLeft<=0?'danger':(info.hoursLeft<=20?'amber':'')}" style="width:${hourPct}%;"></div></div>
        <div class="stat-hint">${info.hoursLeft<=0 ? "Atrasada" : info.hoursLeft.toFixed(1) + " h restante(s)"}</div>
      </div>
    </div>

    <div class="card">
      <div class="section-title" style="margin-top:0;">Configuração</div>
      <div class="form-grid cols-3">
        <div class="field">
          <label>Última limpeza registrada</label>
          <input type="date" id="m-lastdate" value="${s.lastCleaningDate||""}">
        </div>
        <div class="field">
          <label>Intervalo (dias)</label>
          <input type="number" id="m-intervaldays" value="${s.cleaningIntervalDays}">
        </div>
        <div class="field">
          <label>Intervalo (horas de máquina)</label>
          <input type="number" id="m-intervalhours" value="${s.cleaningIntervalHours}">
        </div>
      </div>
      <button class="btn btn-sm btn-primary" id="save-maint-settings" style="margin-top:14px;">Salvar configuração</button>
    </div>

    <div class="card">
      <div class="section-title" style="margin-top:0;">Horas contabilizadas desde a última limpeza<span class="hint">vem dos processos do funil com horas de máquina lançadas</span></div>
      ${contributingCards.length===0 ? `<div class="empty-state" style="padding:24px 20px;"><div class="big">Nenhuma hora lançada ainda</div>Lance "Horas de máquina" nos cards do funil pra alimentar este contador automaticamente.</div>` : `
      <table style="margin-top:6px;">
        <thead><tr><th>Processo</th><th>Cliente</th><th class="num">Horas</th><th>Data</th></tr></thead>
        <tbody>
          ${contributingCards.map(c => `
            <tr>
              <td>${escapeHTML(c.title||"—")}</td>
              <td>${escapeHTML(clientName(c.clientId))}</td>
              <td class="num">${(Number(c.horasMaquina)||0).toFixed(1)} h</td>
              <td>${fmtDate(c.completedAt||c.forecastDate||c.createdAt)}</td>
            </tr>`).join("")}
        </tbody>
      </table>`}
    </div>
  `;

  document.getElementById("log-cleaning").onclick = async ()=>{
    s.lastCleaningDate = todayISO();
    await persist("settings");
    showToast("Limpeza registrada hoje. Contadores reiniciados.");
    render();
  };
  document.getElementById("save-maint-settings").onclick = async ()=>{
    s.lastCleaningDate = document.getElementById("m-lastdate").value || null;
    s.cleaningIntervalDays = Number(document.getElementById("m-intervaldays").value) || 14;
    s.cleaningIntervalHours = Number(document.getElementById("m-intervalhours").value) || 150;
    await persist("settings");
    showToast("Configuração de manutenção salva.");
    render();
  };
}

function collectionFor(type){ return type==="estimate" ? "estimates" : "invoices"; }
function prefixFor(type){ return type==="estimate" ? "EST" : "INV"; }

function renderDocList(main, type){
  const col = collectionFor(type);
  let search = "";
  let statusFilter = "";

  function draw(){
    let list = state[col].slice().sort((a,b)=> (b.date||"").localeCompare(a.date||""));
    if(search) list = list.filter(d => clientName(d.clientId).toLowerCase().includes(search.toLowerCase()) || (d.number||"").toLowerCase().includes(search.toLowerCase()));
    if(statusFilter) list = list.filter(d => (type==="estimate" ? effectiveEstimateStatus(d) : d.status)===statusFilter);

    const statusOptions = type==="estimate"
      ? [["","Todos status"],["sent","Enviado"],["accepted","Aceito"],["expired","Expirado"]]
      : [["","Todos status"],["draft","Rascunho"],["sent","Enviada"],["partial","Parcialmente paga"],["paid","Paga"],["overdue","Atrasada"]];

    main.innerHTML = `
      <div class="view-header">
        <div>
          <div class="view-title">${type==="estimate" ? "Orçamentos" : "Faturas"}</div>
          <div class="view-sub">${state[col].length} no total</div>

          <thead><tr>
            <th>Número</th><th>Cliente</th><th>Linha</th><th>Data</th>
            <th class="num">Total</th>${type==="invoice" ? '<th class="num">Saldo</th>' : ''}<th>Status</th><th></th>
          </tr></thead>
          <tbody>
            ${list.map(d => {

              return `<tr>
                <td>${escapeHTML(d.number)}</td>
                <td>${escapeHTML(clientName(d.clientId))}</td>
                <td><span class="badge badge-line-${(d.businessLine||"").toLowerCase().includes("studio")?"studio":"works"}">${escapeHTML(d.businessLine||"—")}</span></td>

                <td class="row-actions">
                  <button class="btn btn-sm btn-ghost" data-open="${d.id}">Abrir</button>
                  <button class="btn btn-sm btn-ghost" data-pipeline="${d.id}">${state.pipeline.some(c => (type==="estimate"?c.estimateId:c.invoiceId)===d.id) ? "Ver no funil" : "+ Funil"}</button>
                  <button class="btn btn-sm btn-danger" data-del="${d.id}">Excluir</button>
                </td>
              </tr>`;
            }).join("")}
          </tbody>
        </table>`}
      </div>
    `;
    document.getElementById("new-doc").onclick = ()=> openDocEditor(type, null);
    document.getElementById("search-doc").oninput = e=>{ search=e.target.value; draw(); };
    document.getElementById("filter-status").onchange = e=>{ statusFilter=e.target.value; draw(); };
    main.querySelectorAll("[data-open]").forEach(b=> b.onclick = ()=> openDocEditor(type, state[col].find(x=>x.id===b.dataset.open)));
    main.querySelectorAll("[data-pipeline]").forEach(b=> b.onclick = ()=>{
      const doc = state[col].find(x=>x.id===b.dataset.pipeline);
      const existing = state.pipeline.find(c => (type==="estimate"?c.estimateId:c.invoiceId)===doc.id);
      if(existing){ editingPipelineCard = {data: JSON.parse(JSON.stringify(existing)), isNew:false}; render(); return; }
      const card = newPipelineSkeleton();
      card.clientId = doc.clientId;
      card.businessLine = doc.businessLine;
      card.title = (doc.items && doc.items[0] && doc.items[0].desc) ? doc.items[0].desc : (doc.number + " — " + clientName(doc.clientId));
      if(type==="estimate"){ card.estimateId = doc.id; card.forecastDate = doc.validUntil; }
      else { card.invoiceId = doc.id; card.forecastDate = doc.dueDate; }
      editingPipelineCard = {data: card, isNew:true};
      render();
    });
    main.querySelectorAll("[data-del]").forEach(b=> b.onclick = ()=>{

        showToast("Excluído.");
        draw();
      });
    });
  }
  draw();
}

function newDocSkeleton(type){
  const settings = state.settings;
  const number = prefixFor(type) + "-" + String(type==="estimate" ? settings.nextEstimateNumber : settings.nextInvoiceNumber).padStart(4,"0");
  const date = todayISO();
  return {
    id: uid(),
    number,
    clientId: state.clients[0] ? state.clients[0].id : null,
    businessLine: settings.defaultLine,
    date,
    validUntil: type==="estimate" ? addDays(date, 15) : null,
    dueDate: type==="invoice" ? addDays(date, 15) : null,
    status: "draft",
    items: [{desc:"", qty:1, rate:0, taxable:true}],
    applyTax: false,
    taxRate: settings.salesTaxRate,
    notes: type==="estimate" ? settings.estimateNotes : settings.invoiceNotes,
    payments: type==="invoice" ? [] : undefined,
    paidDate: null,
    fromEstimateNumber: null,
    poNumber: "",
    requiresShipping: false,
    shippingAddress: {line1:"", line2:"", city:"", state:"", zip:"", country:"Estados Unidos"}
  };
}

function openDocEditor(type, doc){
  const data = doc ? JSON.parse(JSON.stringify(doc)) : newDocSkeleton(type);
  if(type==="invoice" && !data.payments) data.payments = effectivePayments(data);
  if(!data.items) data.items = [{desc:"", qty:1, rate:0, taxable:true}];
  data.items.forEach(it => { if(it.taxable === undefined) it.taxable = true; });
  // Migração: documentos antigos tinham "shipTo" como texto livre.
  if(data.requiresShipping === undefined){
    data.requiresShipping = !!(data.shipTo && data.shipTo.trim());
  }
  if(!data.shippingAddress || typeof data.shippingAddress !== "object"){
    data.shippingAddress = data.shipTo
      ? {line1: data.shipTo, line2:"", city:"", state:"", zip:"", country:"Estados Unidos"}
      : {line1:"", line2:"", city:"", state:"", zip:"", country:"Estados Unidos"};
  }
  editingDoc = {type, data, isNew: !doc};
  render();
}

        <div class="field">
          <label>${isEstimate ? "Válido até" : "Vencimento"}</label>
          <input type="date" id="f-duedate" value="${(isEstimate?data.validUntil:data.dueDate)||""}">
        </div>
        <div class="field">
          <label>Número</label>
          <input id="f-number" value="${escapeHTML(data.number)}">
        </div>
        <div class="field">
          <label>P.O. / Referência (opcional)</label>
          <input id="f-po" value="${escapeHTML(data.poNumber||"")}" placeholder="Ex.: número de ordem do cliente">
        </div>
        ${!isEstimate ? `
        <div class="field">
          <label>Status</label>
          <select id="f-status">
            ${[["draft","Rascunho"],["sent","Enviada"],["partial","Parcialmente paga"],["paid","Paga"],["overdue","Atrasada"]]
              .map(([v,l])=>`<option value="${v}" ${data.status===v?"selected":""}>${l}</option>`).join("")}
          </select>
        </div>` : ""}
      </div>

      <div class="section-title">Envio<span class="hint">marque se esta peça precisa ser enviada ao cliente</span></div>
      <div class="checkbox-field" style="margin-bottom:10px;">
        <input type="checkbox" id="f-requireshipping" ${data.requiresShipping?"checked":""}>
        <label style="font-size:13px; font-weight:500; text-transform:none;">Este pedido será enviado ao cliente</label>
      </div>
      <div id="shipping-fields" style="display:${data.requiresShipping?"block":"none"};">
        <div class="form-grid">
          <div class="field full"><label>Endereço — linha 1</label><input id="ship-line1" value="${escapeHTML(data.shippingAddress.line1)}"></div>
          <div class="field full"><label>Endereço — linha 2 (opcional)</label><input id="ship-line2" value="${escapeHTML(data.shippingAddress.line2)}"></div>
          <div class="field"><label>Cidade</label><input id="ship-city" value="${escapeHTML(data.shippingAddress.city)}"></div>
          <div class="field"><label>Estado</label><input id="ship-state" maxlength="2" value="${escapeHTML(data.shippingAddress.state)}"></div>
          <div class="field"><label>CEP / ZIP</label><input id="ship-zip" value="${escapeHTML(data.shippingAddress.zip)}"></div>
          <div class="field"><label>País</label><input id="ship-country" value="${escapeHTML(data.shippingAddress.country)}"></div>
        </div>
        <button type="button" class="btn btn-sm btn-ghost" id="copy-client-address" style="margin-top:6px;">Usar endereço do cliente</button>
      </div>

      <div class="section-title">Itens<span class="hint">selecione do catálogo ou digite manualmente — "Tributável" define se o imposto de vendas incide sobre a linha</span></div>
      <table class="line-items-table">
        <thead><tr>
          <th style="width:20%">Catálogo</th>
          <th style="width:26%">Descrição</th>
          <th class="num" style="width:9%">Qtd.</th>
          <th class="num" style="width:13%">Preço unit.</th>
          <th class="center" style="width:9%">Tributável</th>
          <th class="num" style="width:13%">Total</th>
          <th></th>
        </tr></thead>
        <tbody id="items-body"></tbody>
      </table>
      <button class="btn btn-sm btn-ghost" id="add-item" style="margin-top:8px;">+ Adicionar item</button>

      <div class="totals-box">
        <div class="checkbox-field" style="margin-bottom:8px; justify-content:flex-end;">
          <input type="checkbox" id="f-applytax" ${data.applyTax?"checked":""}>
          <label style="font-size:12.5px; font-weight:500; text-transform:none;">Aplicar imposto sobre vendas</label>
          <input type="number" step="0.001" id="f-taxrate" value="${((data.taxRate||0)*100).toFixed(2)}" style="width:70px; margin-left:6px;">%
        </div>
        <div class="totals-row"><span>Subtotal</span><span id="t-subtotal">${fmtMoney(totals.subtotal)}</span></div>
        <div class="totals-row"><span>Base tributável</span><span id="t-taxable-base">${fmtMoney(totals.taxableBase)}</span></div>
        <div class="totals-row"><span>Imposto</span><span id="t-tax">${fmtMoney(totals.taxAmount)}</span></div>
        <div class="totals-row grand"><span>Total</span><span id="t-total">${fmtMoney(totals.total)}</span></div>
        ${!isEstimate ? `
        <div class="totals-row"><span>Já pago</span><span id="t-paid">${fmtMoney(paidSoFar)}</span></div>
        <div class="totals-row balance"><span>Saldo devedor</span><span id="t-balance">${fmtMoney(balance)}</span></div>` : ""}
      </div>

      <div class="section-title">Notas / condições</div>
      <div class="field full"><textarea id="f-notes" style="min-height:80px;">${escapeHTML(data.notes)}</textarea></div>

      ${!isEstimate ? `
      <div class="section-title">Pagamentos</div>
      <table class="payments-table" id="payments-table"></table>
      <div class="payments-add-row">
        <div class="field"><label>Data</label><input type="date" id="p-date" value="${todayISO()}"></div>
        <div class="field"><label>Valor</label><input type="number" step="0.01" id="p-amount" placeholder="0.00"></div>
        <div class="field" style="flex:2;"><label>Nota (opcional)</label><input id="p-note" placeholder="Ex.: depósito de 50%, PIX, cheque…"></div>
        <button class="btn btn-sm btn-amber" id="add-payment" type="button">Registrar pagamento</button>
        <button class="btn btn-sm btn-ghost" id="pay-balance" type="button">Registrar saldo total hoje</button>
      </div>` : `
      <div class="section-title">Converter</div>
      <p style="font-size:13px; color:#5b6472;">Depois de salvo, você pode transformar este orçamento numa fatura sem redigitar os itens.</p>
      <button class="btn btn-sm btn-primary" id="convert-invoice" type="button" ${isNew ? "disabled":""}>Converter em fatura</button>
      `}
    </div>
  `;

  renderItemsBody();
  if(!isEstimate) renderPaymentsTable();
  renderClientDropdownLogic();

  function catalogOptionsHTML(selectedId){
    return `<option value="" ${!selectedId?"selected":""}>— manual —</option>` +
      state.catalog.map(c=>`<option value="${c.id}" ${c.id===selectedId?"selected":""}>${escapeHTML(c.name)} (${c.type==="item"?"item":"serviço"})</option>`).join("") +
      `<option value="__new__">+ Novo item/serviço…</option>`;
  }

  function renderItemsBody(){
    const tbody = document.getElementById("items-body");
    tbody.innerHTML = data.items.map((it,idx)=>`
      <tr data-idx="${idx}">
        <td><select class="catalog-select">${catalogOptionsHTML(it.catalogId)}</select></td>
        <td><input class="desc-input" value="${escapeHTML(it.desc)}" placeholder="Descrição do item/serviço"></td>
        <td><input class="num-input qty-input" type="number" step="any" value="${it.qty}"></td>
        <td><input class="num-input rate-input" type="number" step="any" value="${it.rate}"></td>
        <td class="tax-cell"><input type="checkbox" class="taxable-input" ${it.taxable!==false ? "checked":""}></td>
        <td class="amount-cell">${fmtMoney((Number(it.qty)||0)*(Number(it.rate)||0))}</td>
        <td><button class="remove-line" data-remove="${idx}" title="Remover">&times;</button></td>
      </tr>`).join("");

    tbody.querySelectorAll(".catalog-select").forEach((el,i)=> el.onchange = e=>{
      const val = e.target.value;
      if(val === "__new__"){
        const typedDesc = data.items[i].desc;
        openCatalogQuickCreateModal(typedDesc, (entry)=>{
          data.items[i].catalogId = entry.id;
          data.items[i].desc = entry.name;
          data.items[i].rate = entry.price;
          data.items[i].taxable = entry.type === "item";
          renderItemsBody();
          updateTotals();
        });
        e.target.value = data.items[i].catalogId || "";
        return;
      }
      if(!val){ data.items[i].catalogId = null; return; }
      const entry = state.catalog.find(c=>c.id===val);
      if(entry){
        data.items[i].catalogId = entry.id;
        data.items[i].desc = entry.name;
        data.items[i].rate = entry.price;
        data.items[i].taxable = entry.type === "item";
        renderItemsBody();
        updateTotals();
      }
    });
    tbody.querySelectorAll(".desc-input").forEach((el,i)=> el.oninput = e=>{ data.items[i].desc = e.target.value; });
    tbody.querySelectorAll(".qty-input").forEach((el,i)=> el.oninput = e=>{ data.items[i].qty = e.target.value; updateTotals(); });
    tbody.querySelectorAll(".rate-input").forEach((el,i)=> el.oninput = e=>{ data.items[i].rate = e.target.value; updateTotals(); });
    tbody.querySelectorAll(".taxable-input").forEach((el,i)=> el.onchange = e=>{ data.items[i].taxable = e.target.checked; updateTotals(); });
    tbody.querySelectorAll("[data-remove]").forEach(btn=> btn.onclick = ()=>{
      if(data.items.length<=1) return;
      data.items.splice(Number(btn.dataset.remove),1);
      renderItemsBody();
      updateTotals();
    });
  }

  function updateTotals(){
    data.applyTax = document.getElementById("f-applytax").checked;
    data.taxRate = Number(document.getElementById("f-taxrate").value)/100;
    const t = calcDocTotals(data);
    document.getElementById("t-subtotal").textContent = fmtMoney(t.subtotal);
    document.getElementById("t-taxable-base").textContent = fmtMoney(t.taxableBase);
    document.getElementById("t-tax").textContent = fmtMoney(t.taxAmount);
    document.getElementById("t-total").textContent = fmtMoney(t.total);
    document.querySelectorAll("#items-body tr").forEach((tr,i)=>{
      tr.querySelector(".amount-cell").textContent = fmtMoney((Number(data.items[i].qty)||0)*(Number(data.items[i].rate)||0));
    });
    if(!isEstimate) updatePaymentTotals(t.total);
  }

  function updatePaymentTotals(total){
    const paid = sumPaymentsLocal();
    const bal = Math.max(0, total - paid);
    document.getElementById("t-paid").textContent = fmtMoney(paid);
    document.getElementById("t-balance").textContent = fmtMoney(bal);
  }

  function sumPaymentsLocal(){
    return (data.payments||[]).reduce((s,p)=> s+(Number(p.amount)||0), 0);
  }

  function renderPaymentsTable(){
    const tbl = document.getElementById("payments-table");
    const rows = data.payments || [];
    tbl.innerHTML = rows.length===0 ? `<tbody><tr><td style="color:#8991A0; padding:8px 0;">Nenhum pagamento registrado ainda.</td></tr></tbody>` : `
      <thead><tr><th>Data</th><th>Nota</th><th class="num">Valor</th><th></th></tr></thead>
      <tbody>
        ${rows.map((p,i)=>`
          <tr>
            <td>${fmtDate(p.date)}</td>
            <td>${escapeHTML(p.note||"—")}</td>
            <td class="num">${fmtMoney(p.amount)}</td>
            <td class="row-actions">${p.id==="legacy" ? "" : `<button class="remove-line" data-rm-payment="${i}">&times;</button>`}</td>
          </tr>`).join("")}
      </tbody>`;
    tbl.querySelectorAll("[data-rm-payment]").forEach(btn=> btn.onclick = ()=>{
      data.payments.splice(Number(btn.dataset.rmPayment),1);
      renderPaymentsTable();
      syncStatusFromPayments();
      updateTotals();
    });
  }

  function syncStatusFromPayments(){
    const t = calcDocTotals(data);
    const paid = sumPaymentsLocal();
    const statusSel = document.getElementById("f-status");
    if(!statusSel || paid <= 0) return; // leave whatever the user had set (draft/sent/overdue)
    if(paid >= t.total - 0.005){
      statusSel.value = "paid";
    } else {
      statusSel.value = "partial";
    }
  }

  /* ---- Cliente: busca com autocomplete + criação rápida via popup ---- */
  function renderClientDropdownLogic(){
    const input = document.getElementById("f-client-search");
    const dropdown = document.getElementById("client-dropdown");

    function selectClient(client){
      data.clientId = client.id;
      input.value = client.name;
      dropdown.style.display = "none";
      document.getElementById("client-type-badge").innerHTML = clientTypeBadgeHTML(client);
      const shipBtn = document.getElementById("copy-client-address");
      if(shipBtn) shipBtn.dataset.clientId = client.id;
      updateTotals();
    }

    function openDropdown(query){
      const q = query.trim().toLowerCase();
      const matches = q ? state.clients.filter(c=>c.name.toLowerCase().includes(q)) : state.clients.slice(0,8);
      let html = matches.slice(0,8).map(c=>`<div class="client-dropdown-item" data-id="${c.id}">${escapeHTML(c.name)}${c.type==="company"?' <span class="stat-hint">· empresa</span>':''}</div>`).join("");
      html += `<div class="client-dropdown-item client-dropdown-new" data-new="1">+ Criar cliente${q?` "${escapeHTML(query.trim())}"`:""}</div>`;
      dropdown.innerHTML = html;
      dropdown.style.display = "block";
      dropdown.querySelectorAll("[data-id]").forEach(el=> el.onclick = ()=> selectClient(state.clients.find(c=>c.id===el.dataset.id)));
      const newBtn = dropdown.querySelector("[data-new]");
      if(newBtn) newBtn.onclick = ()=>{
        dropdown.style.display = "none";
        openClientQuickCreateModal(query.trim(), (client)=> selectClient(client));
      };
    }

    input.addEventListener("focus", ()=> openDropdown(input.value));
    input.addEventListener("input", ()=> openDropdown(input.value));
    document.addEventListener("click", (e)=>{
      if(!dropdown.contains(e.target) && e.target!==input) dropdown.style.display = "none";
    });
  }

  /* ---- Envio ---- */
  const shipCheckbox = document.getElementById("f-requireshipping");
  const shipFieldsBox = document.getElementById("shipping-fields");
  shipCheckbox.onchange = ()=>{ shipFieldsBox.style.display = shipCheckbox.checked ? "block" : "none"; };
  const copyAddrBtn = document.getElementById("copy-client-address");
  if(copyAddrBtn) copyAddrBtn.onclick = ()=>{
    const client = clientById(data.clientId);
    if(!client){ showToast("Selecione um cliente primeiro."); return; }
    const addr = normalizeClient(client).address;
    document.getElementById("ship-line1").value = addr.line1;
    document.getElementById("ship-line2").value = addr.line2;
    document.getElementById("ship-city").value = addr.city;
    document.getElementById("ship-state").value = addr.state;
    document.getElementById("ship-zip").value = addr.zip;
    document.getElementById("ship-country").value = addr.country;
  };

  document.getElementById("add-item").onclick = ()=>{
    data.items.push({desc:"", qty:1, rate:0, taxable:true, catalogId:null});
    renderItemsBody();
    updateTotals();
  };
  document.getElementById("f-applytax").onchange = updateTotals;
  document.getElementById("f-taxrate").oninput = updateTotals;
  document.getElementById("back").onclick = ()=>{ editingDoc = null; render(); };
  document.getElementById("print-doc").onclick = ()=>{ commitFormToData(); printDoc(type, data); };

  function commitFormToData(){
    data.businessLine = document.getElementById("f-line").value;
    if(!isEstimate){
      data.status = document.getElementById("f-status").value;
    }
    data.date = document.getElementById("f-date").value;
    const due = document.getElementById("f-duedate").value;
    if(isEstimate) data.validUntil = due; else data.dueDate = due;
    data.number = document.getElementById("f-number").value.trim() || data.number;
    data.poNumber = document.getElementById("f-po").value.trim();
    data.requiresShipping = document.getElementById("f-requireshipping").checked;
    data.shippingAddress = {
      line1: document.getElementById("ship-line1").value.trim(),
      line2: document.getElementById("ship-line2").value.trim(),
      city: document.getElementById("ship-city").value.trim(),
      state: document.getElementById("ship-state").value.trim(),
      zip: document.getElementById("ship-zip").value.trim(),
      country: document.getElementById("ship-country").value.trim() || "Estados Unidos"
    };
    data.notes = document.getElementById("f-notes").value;
    data.applyTax = document.getElementById("f-applytax").checked;
    data.taxRate = Number(document.getElementById("f-taxrate").value)/100;
  }

  if(!isEstimate){
    document.getElementById("add-payment").onclick = ()=>{
      const amount = Number(document.getElementById("p-amount").value);
      const date = document.getElementById("p-date").value || todayISO();
      if(!amount || amount<=0){ showToast("Informe um valor de pagamento maior que zero."); return; }
      if(!data.payments) data.payments = [];
      data.payments.push({id: uid(), date, amount, note: document.getElementById("p-note").value.trim()});
      document.getElementById("p-amount").value = "";
      document.getElementById("p-note").value = "";
      renderPaymentsTable();
      syncStatusFromPayments();
      updateTotals();
      showToast("Pagamento registrado.");
    };
    document.getElementById("pay-balance").onclick = ()=>{
      const t = calcDocTotals(data);
      const bal = Math.max(0, t.total - sumPaymentsLocal());
      if(bal<=0){ showToast("Não há saldo pendente."); return; }
      if(!data.payments) data.payments = [];
      data.payments.push({id: uid(), date: todayISO(), amount: bal, note:"Saldo final"});
      renderPaymentsTable();
      syncStatusFromPayments();
      updateTotals();
      showToast("Saldo registrado como pago.");
    };
  } else {
    async function doConvertToInvoice(){
      const invSkeleton = newDocSkeleton("invoice");
      invSkeleton.clientId = data.clientId;
      invSkeleton.businessLine = data.businessLine;
      invSkeleton.items = JSON.parse(JSON.stringify(data.items));
      invSkeleton.applyTax = data.applyTax;
      invSkeleton.taxRate = data.taxRate;
      invSkeleton.fromEstimateNumber = data.number;
      invSkeleton.requiresShipping = data.requiresShipping;
      invSkeleton.shippingAddress = JSON.parse(JSON.stringify(data.shippingAddress));
      state.settings.nextInvoiceNumber++;
      await persist("settings");
      // Marca o orçamento de origem como aceito (não é mais editável manualmente).
      data.status = "accepted";
      const idxEst = state.estimates.findIndex(x=>x.id===data.id);
      if(idxEst>=0){ state.estimates[idxEst] = data; await persist("estimates"); }
      openDocEditor("invoice", invSkeleton);
      showToast("Orçamento convertido em fatura — revise e salve.");
    }
    const convBtn = document.getElementById("convert-invoice");
    if(convBtn && !isNew) convBtn.onclick = doConvertToInvoice;
    const convBtnTop = document.getElementById("convert-invoice-top");
    if(convBtnTop && !isNew) convBtnTop.onclick = doConvertToInvoice;
  }

  document.getElementById("save-doc").onclick = async ()=>{
    commitFormToData();
    if(!data.clientId){ showToast("Selecione um cliente (digite o nome e escolha na lista)."); return; }
    data.items = data.items.filter(it => (it.desc && it.desc.trim()) || Number(it.rate)>0);
    if(data.items.length===0) data.items = [{desc:"", qty:1, rate:0, taxable:true, catalogId:null}];

    if(isEstimate && (!data.status || data.status === "draft")){
      data.status = "sent";
      data.sentDate = data.sentDate || todayISO();
    }

    const idx = state[col].findIndex(x=>x.id===data.id);
    if(idx>=0) state[col][idx] = data; else state[col].push(data);

    if(isNew){
      if(isEstimate) state.settings.nextEstimateNumber++; else state.settings.nextInvoiceNumber++;
      await persist("settings");
    }
    await persist(col);
    editingDoc.isNew = false;
    showToast("Salvo com sucesso.");
    editingDoc = null;
    render();
  };
}
