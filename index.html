<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Reverso Works — Gestor</title>
<meta name="description" content="Gestão integrada de clientes, pedidos, produção, engenharia e financeiro da Reverso Works.">
<link rel="icon" type="image/png" href="assets/reverso-works-logo-192.png">
<link rel="apple-touch-icon" sizes="192x192" href="assets/reverso-works-logo-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#060607">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Reverso">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" href="assets/reverso-works-logo-512.png" as="image" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Sora:wght@600;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>

  /* ============================================================
     Reverso Gestor — Apple (España) Obsidian Design System
     Tokens per assets/design-tokens.css. Dark showroom canvas,
     one chromatic CTA (apple-blue), category color reserved for
     Works/Studio tags. No box-shadow anywhere — depth is surface
     contrast only. Radii limited to {10,28,32,36,980}px.
     ============================================================ */
  :root{
    /* ---- Brand palette (Apple Obsidian tokens) ---- */
    --color-obsidian:#1d1d1f;
    --color-frost-white:#f5f5f7;
    --color-pure-black:#000000;
    --color-paper-white:#ffffff;
    --color-carbon:#111111;
    --color-platinum:#86868b;
    --color-graphite:#333336;
    --color-silver-mist:#cccccc;
    --color-smoke:#424245;
    --color-apple-blue:#0071e3;
    --color-link-blue:#0066cc;
    --color-halo-blue:#2997ff;
    --color-signal-orange:#f56900;
    --color-iris-violet:#8668ff;
    --color-reef-teal:#00a1b3;

    /* ---- Functional status colors (necessary for a finance app;
       kept flat/text-forward, never used as brand accents) ---- */
    --status-good:#30d158;
    --status-good-bg:rgba(48,209,88,0.14);
    --status-danger:#ff453a;
    --status-danger-bg:rgba(255,69,58,0.14);
    --status-warn:#f56900;
    --status-warn-bg:rgba(245,105,0,0.14);

    /* ---- Typography ---- */
    --font-display:'Inter', ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --font-body:'Inter', ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --font-script:'Caveat', cursive;

    /* ---- Radii — closed set, nothing else is valid ---- */
    --radius-links:10px;
    --radius-cards:28px;
    --radius-heading-block:32px;
    --radius-buttons:36px;
    --radius-pill:980px;

    /* ---- Glass dock (ThreeUI "Animated Top Dock / glass", ported) ----
       Translucent rail tokens. Kept achromatic so the only chromatic
       accent in the navigation stays the Apple Blue indicator. ---- */
    --glass-hairline:rgba(255,255,255,0.12);
    --glass-hairline-top:rgba(255,255,255,0.22);
    --glass-blur:blur(30px) saturate(180%);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:var(--font-body);
    background:var(--color-pure-black);
    color:var(--color-frost-white);
    -webkit-font-smoothing:antialiased;
    font-variant-numeric:tabular-nums;
  }
  #app{display:flex; min-height:100vh;}

  /* ---------- Sidebar (Carbon, elevated over pure black) ---------- */
  #sidebar{
    width:220px; flex-shrink:0;
    position:relative; z-index:1;
    background:linear-gradient(160deg, rgba(30,30,34,0.66), rgba(10,10,12,0.88));
    backdrop-filter:var(--glass-blur);
    -webkit-backdrop-filter:var(--glass-blur);
    color:var(--color-frost-white);
    display:flex; flex-direction:column;
    padding:20px 0;
    border-right:1px solid var(--glass-hairline);
  }

  /* ---------- Refraction field ----------
     The glass rail needs something behind it to refract; on a pure black
     canvas a backdrop-filter has nothing to sample. This is the cheap
     CSS stand-in for the original component's WebGL bead field: three
     soft brand-coloured blobs drifting behind the rail. No canvas, no
     rAF, no dependency. ---- */
  #dock-field{
    position:fixed; inset:0 auto 0 0; width:260px;
    z-index:-1; pointer-events:none; overflow:hidden;
  }
  #dock-field i{position:absolute; display:block; border-radius:50%; filter:blur(58px);}
  #dock-field i:nth-child(1){width:230px; height:230px; left:-70px; top:6%;  background:var(--color-apple-blue);    opacity:.46; animation:dock-drift-a 22s ease-in-out infinite;}
  #dock-field i:nth-child(2){width:200px; height:200px; left:10px;  top:44%; background:var(--color-halo-blue);     opacity:.30; animation:dock-drift-b 27s ease-in-out infinite;}
  #dock-field i:nth-child(3){width:150px; height:150px; left:-40px; top:78%; background:var(--color-signal-orange); opacity:.24; animation:dock-drift-c 31s ease-in-out infinite;}
  @keyframes dock-drift-a{0%,100%{transform:translate3d(0,0,0);} 50%{transform:translate3d(34px,52px,0);}}
  @keyframes dock-drift-b{0%,100%{transform:translate3d(0,0,0);} 50%{transform:translate3d(-26px,-46px,0);}}
  @keyframes dock-drift-c{0%,100%{transform:translate3d(0,0,0);} 50%{transform:translate3d(30px,-38px,0);}}
  @media (prefers-reduced-motion: reduce){ #dock-field i{animation:none;} }
  .brand{
    font-family:var(--font-display);
    font-weight:700;
    font-size:19px;
    letter-spacing:-0.28px;
    color:var(--color-frost-white);
    padding:0 20px 4px 20px;
    line-height:1.21;
  }
  .brand small{
    display:block;
    font-family:var(--font-body);
    font-weight:600;
    font-size:10px;
    letter-spacing:-0.37px;
    color:var(--color-signal-orange);
    text-transform:uppercase;
    margin-top:4px;
  }
  nav.mainnav{position:relative; margin-top:24px; display:flex; flex-direction:column; gap:2px; overflow-y:auto;}
  nav.mainnav button{
    all:unset;
    cursor:pointer;
    box-sizing:border-box;
    position:relative; z-index:1;
    margin:0 8px;
    padding:9px 14px;
    border-radius:var(--radius-links);
    font-size:14px;
    font-weight:400;
    letter-spacing:-0.22px;
    color:var(--color-platinum);
    display:flex; align-items:center; gap:10px;
    border:1px solid transparent;
    /* the rail grows downward from each item's own top edge */
    transform-origin:0 50%;
    transition:color .18s ease, background .2s ease, border-color .2s ease;
  }
  nav.mainnav button:hover{color:var(--color-frost-white);}
  nav.mainnav button[data-dock-near="true"]{
    color:var(--color-frost-white);
    background:linear-gradient(180deg, rgba(255,255,255,0.13), rgba(255,255,255,0.035));
    border-color:var(--glass-hairline);
  }
  nav.mainnav button.active{
    color:var(--color-frost-white);
    font-weight:600;
    background:transparent;
    border-color:transparent;
  }
  nav.mainnav button.active .icon svg{stroke:var(--color-halo-blue);}

  /* The active-item highlight is a single element that slides between
     items and tracks the magnified height of whichever item is active. */
  .nav-indicator{
    position:absolute; left:0; top:0; z-index:0; pointer-events:none;
    box-sizing:border-box;
    border-radius:var(--radius-links);
    background:linear-gradient(180deg, rgba(255,255,255,0.17), rgba(255,255,255,0.05));
    border:1px solid var(--glass-hairline-top);
    border-left:3px solid var(--color-apple-blue);
    opacity:0;
    transition:transform .22s cubic-bezier(.32,.72,0,1),
               width .22s cubic-bezier(.32,.72,0,1),
               height .22s cubic-bezier(.32,.72,0,1),
               opacity .2s ease;
  }
  @media (prefers-reduced-motion: reduce){ .nav-indicator{transition:opacity .2s ease;} }
  nav.mainnav .icon{width:17px; height:17px; flex-shrink:0; display:flex; align-items:center; justify-content:center;}
  nav.mainnav .icon svg{width:100%; height:100%; stroke:currentColor; fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round;}
  .sidebar-footer{
    margin-top:auto; padding:14px 20px 0 20px;
    font-size:10px; color:var(--color-platinum); border-top:1px solid var(--color-smoke); padding-top:14px;
  }

  /* ---------- Main canvas ---------- */
  #main{flex:1; padding:28px 34px 60px 34px; min-width:0; background:var(--color-pure-black);}
  .view-header{
    display:flex; justify-content:space-between; align-items:flex-end;
    margin-bottom:22px; flex-wrap:wrap; gap:12px;
  }
  .view-title{
    font-family:var(--font-display);
    font-weight:700;
    font-size:32px;
    letter-spacing:-0.32px;
    color:var(--color-frost-white);
    line-height:1.14;
  }
  .view-sub{font-size:14px; color:var(--color-platinum); margin-top:4px; letter-spacing:-0.22px;}

  /* ---------- Buttons — apple-blue is the only filled chromatic button ---------- */
  .btn{
    all:unset; cursor:pointer;
    font-family:var(--font-body); font-weight:600; font-size:14px; letter-spacing:-0.22px;
    padding:10px 20px; border-radius:var(--radius-buttons);
    display:inline-flex; align-items:center; gap:6px;
    transition:filter .15s ease, background .15s ease;
  }
  .btn-primary{background:var(--color-apple-blue); color:var(--color-paper-white);}
  .btn-primary:hover{filter:brightness(1.12);}
  .btn-amber{background:transparent; color:var(--color-signal-orange); border:1px solid var(--color-smoke);}
  .btn-amber:hover{background:var(--color-graphite);}
  .btn-ghost{background:transparent; color:var(--color-frost-white); border:1px solid var(--color-smoke);}
  .btn-ghost:hover{background:var(--color-graphite);}
  .btn-danger{background:transparent; color:var(--status-danger); border:1px solid var(--color-smoke);}
  .btn-danger:hover{background:var(--status-danger-bg);}
  .btn-sm{padding:6px 14px; font-size:12px; border-radius:var(--radius-buttons);}
  .btn:disabled{opacity:0.4; cursor:not-allowed;}

  /* ---------- Cards — depth via surface contrast only, never shadow ---------- */
  .card{
    background:var(--color-obsidian);
    border:1px solid var(--color-smoke);
    border-radius:var(--radius-cards);
    padding:20px;
  }
  .card + .card{margin-top:16px;}
  .card-danger{border-color:rgba(255,69,58,0.35); background:var(--status-danger-bg);}
  .num-provisional{
    font-family:var(--font-body); font-size:10px; font-weight:600; text-transform:uppercase;
    letter-spacing:-0.37px; color:var(--color-signal-orange); vertical-align:middle;
    border:1px solid var(--color-signal-orange); border-radius:var(--radius-pill);
    padding:3px 9px; margin-left:8px;
  }
  .calc-warning{
    font-size:12px; color:var(--status-warn); background:var(--status-warn-bg);
    border:1px solid rgba(245,105,0,0.35); border-radius:var(--radius-links);
    padding:10px 12px; margin-top:12px;
  }

  .stat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:20px;}
  .stat-grid.cols-2{grid-template-columns:repeat(2,1fr);}
  .stat-grid.cols-3{grid-template-columns:repeat(3,1fr);}
  /* stat-card e card são pares sobre a mesma tela preta: mesma superfície
     (obsidian) e mesmo inset. Antes o stat-card era carbon (#111), ou seja,
     MAIS escuro que o card, invertendo a hierarquia de elevação. */
  .stat-card{
    background:var(--color-obsidian); border:1px solid var(--color-smoke); border-radius:var(--radius-cards);
    padding:20px;
  }
  /* Degrau real entre label (11px) e hint (10px) — antes empatavam. */
  .stat-label{font-size:11px; text-transform:uppercase; letter-spacing:-0.37px; color:var(--color-platinum); font-weight:600;}
  .stat-value{font-family:var(--font-display); font-size:24px; font-weight:700; letter-spacing:-0.24px; color:var(--color-frost-white); margin-top:6px;}
  .stat-value.amber{color:var(--color-signal-orange);}
  .stat-value.blueprint{color:var(--color-halo-blue);}
  .stat-value.danger{color:var(--status-danger);}
  .stat-hint{font-size:10px; color:var(--color-platinum); margin-top:4px;}

  table{width:100%; border-collapse:collapse; font-size:14px;}
  thead th{
    text-align:left; font-size:10px; text-transform:uppercase; letter-spacing:-0.37px;
    color:var(--color-platinum); font-weight:600; padding:8px 10px; border-bottom:1px solid var(--color-smoke);
  }
  tbody td{padding:10px 10px; border-bottom:1px solid var(--color-graphite); vertical-align:middle; color:var(--color-frost-white);}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:var(--color-carbon);}
  td.num, th.num{text-align:right; font-variant-numeric:tabular-nums;}
  td.center, th.center{text-align:center;}
  .row-actions{display:flex; gap:6px; justify-content:flex-end;}

  /* ---------- Badges / pills — category color lives here (Works=blue, Studio=orange) ---------- */
  .badge{
    display:inline-block; padding:3px 10px; border-radius:var(--radius-pill); font-size:11px; font-weight:600;
  }
  .badge-draft{background:var(--color-graphite); color:var(--color-platinum);}
  .badge-sent{background:rgba(0,113,227,0.16); color:var(--color-halo-blue);}
  .badge-paid, .badge-accepted{background:var(--status-good-bg); color:var(--status-good);}
  .badge-partial{background:var(--status-warn-bg); color:var(--color-signal-orange);}
  .badge-overdue, .badge-expired{background:var(--status-danger-bg); color:var(--status-danger);}
  .badge-line-works{background:rgba(0,113,227,0.16); color:var(--color-halo-blue);}
  .badge-line-studio{background:rgba(245,105,0,0.16); color:var(--color-signal-orange);}
  .badge-platform{background:var(--color-graphite); color:var(--color-platinum);}

  .empty-state{
    text-align:center; padding:50px 20px; color:var(--color-platinum);
  }
  .empty-state .big{font-family:var(--font-display); font-weight:700; font-size:19px; color:var(--color-frost-white); margin-bottom:6px;}

  .form-grid{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:14px;}
  .form-grid.cols-3{grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr);}
  .field{display:flex; flex-direction:column; gap:5px; min-width:0;}
  .field.full{grid-column:1 / -1;}
  .field label{font-size:10px; font-weight:600; color:var(--color-platinum); text-transform:uppercase; letter-spacing:-0.37px;}
  .field input, .field select, .field textarea{
    -webkit-appearance:none; -moz-appearance:none; appearance:none;
    box-sizing:border-box; width:100%; min-width:0; margin:0;
    font-family:var(--font-body); font-size:16px; padding:11px 12px;
    border:1px solid var(--color-smoke); border-radius:var(--radius-links); background:var(--color-carbon); color:var(--color-frost-white);
  }
  .field select{background-image:linear-gradient(45deg, transparent 50%, var(--color-platinum) 50%), linear-gradient(135deg, var(--color-platinum) 50%, transparent 50%); background-position:calc(100% - 18px) center, calc(100% - 13px) center; background-size:5px 5px, 5px 5px; background-repeat:no-repeat; padding-right:32px; cursor:pointer;}
  .field input:focus, .field select:focus, .field textarea:focus{
    outline:none; border-color:var(--color-apple-blue); box-shadow:0 0 0 3px rgba(0,113,227,0.22);
  }
  .field textarea{resize:vertical; min-height:60px; font-family:var(--font-body);}
  /* Number inputs: free-entry values, never a stepper/spinner look */
  input[type=number]{-moz-appearance:textfield; font-variant-numeric:tabular-nums;}
  input[type=number]::-webkit-outer-spin-button, input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none; margin:0;}
  .checkbox-field{display:flex; align-items:center; gap:8px; flex-direction:row;}
  .checkbox-field input{width:18px; height:18px; accent-color:var(--color-apple-blue); flex-shrink:0;}
  /* Vertical stack — fields sit one over the other, always, regardless of viewport */
  .field-stack{display:flex; flex-direction:column; gap:14px;}

  .section-title{
    font-family:var(--font-display); font-weight:700; font-size:19px; letter-spacing:-0.28px; color:var(--color-frost-white);
    margin:22px 0 12px 0; padding-bottom:6px; border-bottom:1px solid var(--color-smoke);
    display:flex; justify-content:space-between; align-items:baseline;
  }
  .section-title:first-child{margin-top:0;}
  .section-title .hint{font-family:var(--font-body); font-weight:400; font-size:11px; color:var(--color-platinum); text-transform:none;}

  .line-items-table th, .line-items-table td{padding:6px 8px;}
  .line-items-table input{width:100%; border:1px solid var(--color-smoke); border-radius:var(--radius-links); padding:6px 8px; font-size:13px; font-family:var(--font-body); background:var(--color-carbon); color:var(--color-frost-white);}
  .line-items-table input.num-input{text-align:right; font-variant-numeric:tabular-nums;}
  .line-items-table td.amount-cell{font-variant-numeric:tabular-nums; text-align:right; padding-right:14px; white-space:nowrap;}
  .line-items-table td.tax-cell{text-align:center;}
  .line-items-table td.tax-cell input{width:16px; height:16px; accent-color:var(--color-apple-blue);}
  .remove-line{background:none; border:none; color:var(--status-danger); cursor:pointer; font-size:16px; line-height:1;}

  .totals-box{margin-left:auto; width:300px; margin-top:10px;}
  .totals-row{display:flex; justify-content:space-between; padding:6px 0; font-size:14px; color:var(--color-platinum);}
  .totals-row.grand{border-top:1px solid var(--color-smoke); margin-top:4px; padding-top:10px; font-weight:700; font-size:19px; color:var(--color-frost-white); font-variant-numeric:tabular-nums;}
  .totals-row.balance{color:var(--color-signal-orange); font-weight:700;}

  .toolbar{display:flex; gap:10px; align-items:center; margin-bottom:16px; flex-wrap:wrap;}
  .toolbar input[type=search], .toolbar select{
    padding:8px 10px; border:1px solid var(--color-smoke); border-radius:var(--radius-links); font-size:13px; font-family:var(--font-body); background:var(--color-carbon); color:var(--color-frost-white);
  }
  .spacer{flex:1;}

  .toast{
    position:fixed; bottom:22px; right:22px; background:var(--color-carbon); color:var(--color-frost-white);
    border:1px solid var(--color-smoke);
    padding:11px 20px; border-radius:var(--radius-buttons); font-size:14px; font-weight:600;
    z-index:999; opacity:0; transform:translateY(8px);
    transition:opacity .2s ease, transform .2s ease; pointer-events:none;
  }
  .toast.show{opacity:1; transform:translateY(0);}

  .modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.65); z-index:500;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .modal-box{
    background:var(--color-obsidian); border:1px solid var(--color-smoke); border-radius:var(--radius-cards); padding:28px; max-width:420px; width:100%;
  }
  .modal-box h3{font-family:var(--font-display); font-weight:700; font-size:19px; letter-spacing:-0.28px; color:var(--color-frost-white); margin:0 0 10px 0;}
  .modal-box p{font-size:14px; color:var(--color-platinum); line-height:1.43;}
  .modal-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:18px;}

  .note-banner{
    background:var(--status-warn-bg); border:1px solid var(--color-smoke); color:var(--color-signal-orange);
    border-radius:var(--radius-links); padding:10px 14px; font-size:12px; line-height:1.43; margin-bottom:16px;
  }
  .note-banner strong{color:var(--color-frost-white);}

  .payments-table{margin-top:10px;}
  .payments-add-row{display:flex; gap:8px; align-items:flex-end; margin-top:10px; flex-wrap:wrap;}
  .payments-add-row .field{flex:1; min-width:120px;}

  /* ---------- Client picker (doc editor: search + quick create) ---------- */
  .client-dropdown{position:absolute; top:100%; left:0; right:0; background:var(--color-carbon); border:1px solid var(--color-smoke); border-radius:var(--radius-cards); z-index:50; margin-top:4px; max-height:240px; overflow-y:auto;}
  .client-dropdown-item{padding:9px 12px; font-size:13px; cursor:pointer; color:var(--color-frost-white);}
  .client-dropdown-item:hover{background:var(--color-graphite);}
  .client-dropdown-new{color:var(--color-halo-blue); font-weight:600; border-top:1px solid var(--color-smoke);}
  .modal-box-wide{max-width:520px;}
  .line-items-table select.catalog-select{width:100%; font-size:12px; padding:6px 4px; border:1px solid var(--color-smoke); border-radius:var(--radius-links); font-family:var(--font-body); background:var(--color-carbon); color:var(--color-frost-white);}

  /* ---------- Client profile ---------- */
  .profile-name{font-family:var(--font-display); font-size:24px; font-weight:700; letter-spacing:-0.24px; color:var(--color-frost-white); line-height:1.17;}
  .profile-createddate{font-size:10px; color:var(--color-platinum); margin-top:2px;}
  .profile-contact-row{display:flex; gap:8px; font-size:14px; color:var(--color-platinum); margin-top:8px;}
  .profile-badges{display:flex; gap:6px; flex-wrap:wrap; margin-top:10px;}
  .badge-category{background:rgba(134,104,255,0.16); color:var(--color-iris-violet); font-size:10px;}
  .profile-layout{display:grid; grid-template-columns:1fr 300px; gap:16px; align-items:start;}
  @media (max-width:900px){ .profile-layout{grid-template-columns:1fr;} }
  /* .card + .card já aplica margin-top:16px — o margin-bottom somava 32px. */
  .profile-sidebar .card{margin-bottom:0;}
  .side-doc-item{display:flex; justify-content:space-between; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid var(--color-graphite); font-size:12px; cursor:pointer; color:var(--color-frost-white);}
  .side-doc-item:last-child{border-bottom:none;}
  .side-doc-item:hover{color:var(--color-halo-blue);}

  /* ---------- Category chip select (client editor) ---------- */
  .chip-select{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{border:1px solid var(--color-smoke); background:var(--color-carbon); border-radius:var(--radius-pill); padding:6px 14px; font-size:12px; cursor:pointer; color:var(--color-platinum); font-family:var(--font-body);}
  .chip-active{background:var(--color-apple-blue); border-color:var(--color-apple-blue); color:var(--color-paper-white);}

  /* ---------- Tracking add row (client profile) ---------- */
  .tracking-add-row{display:flex; gap:8px; flex-wrap:wrap; align-items:flex-end; margin-bottom:14px;}
  .tracking-add-row select, .tracking-add-row input{padding:8px 9px; border:1px solid var(--color-smoke); border-radius:var(--radius-links); font-family:var(--font-body); font-size:13px; background:var(--color-carbon); color:var(--color-frost-white);}
  .tracking-add-row input#t-number{flex:1; min-width:140px;}
  .link-strong{color:var(--color-frost-white); font-weight:700; cursor:pointer; text-decoration:none;}
  .link-strong:hover{color:var(--color-halo-blue); text-decoration:underline;}

  /* ---------- Dashboard: two-column row (Funil / Manutenção) ---------- */
  .dash-two-col{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:16px; align-items:stretch;}
  .dash-two-col > .card{display:flex; flex-direction:column; height:100%;}
  @media (max-width:900px){ .dash-two-col{grid-template-columns:1fr;} }
  /* Any row of equal-width cards should also match height, so boxes never look lopsided */
  .equal-row{display:grid; gap:16px; align-items:stretch;}
  .equal-row > .card{height:100%;}

  /* ---------- Notes box ---------- */
  .note-add-row{display:flex; gap:10px; align-items:flex-end; margin-bottom:14px; flex-wrap:wrap;}
  .note-add-row textarea{flex:1; min-width:200px; min-height:42px; font-family:var(--font-body); font-size:14px; padding:9px 10px; border:1px solid var(--color-smoke); border-radius:var(--radius-links); resize:vertical; background:var(--color-carbon); color:var(--color-frost-white);}
  .notes-list{display:flex; flex-direction:column; gap:0;}
  .note-item{display:flex; justify-content:space-between; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid var(--color-graphite);}
  .note-item:last-child{border-bottom:none;}
  .note-body{min-width:0;}
  .note-text{font-size:14px; color:var(--color-frost-white);}
  .note-dates{display:flex; gap:10px; margin-top:4px; align-items:baseline;}
  .note-created{font-size:10px; color:var(--color-platinum);}
  .note-due{font-size:13px; font-weight:700; color:var(--color-frost-white); font-variant-numeric:tabular-nums;}
  .note-due.amber{color:var(--color-signal-orange);}
  .note-due.danger{color:var(--status-danger);}
  .note-actions{display:flex; gap:6px; flex-shrink:0;}

  /* ---------- Follow-up box ---------- */
  .followup-list{display:flex; flex-direction:column;}
  .followup-item{display:flex; justify-content:space-between; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--color-graphite); flex-wrap:wrap;}
  .followup-item:last-child{border-bottom:none;}
  .followup-info{display:flex; flex-direction:column; gap:3px;}
  .followup-meta{font-size:12px; color:var(--color-platinum);}
  .followup-actions{display:flex; gap:6px; flex-wrap:wrap;}

  /* ---------- Maintenance ---------- */
  .maint-mini-row{display:flex; justify-content:space-between; align-items:center; padding:8px 0; font-size:14px; border-bottom:1px solid var(--color-graphite); color:var(--color-frost-white);}
  .maint-mini-row:last-of-type{border-bottom:none;}
  .amber-text{color:var(--color-signal-orange);}
  .danger-text{color:var(--status-danger);}
  .gauge{height:8px; background:var(--color-graphite); border-radius:var(--radius-links); margin-top:10px; overflow:hidden;}
  .gauge-fill{height:100%; background:var(--status-good); border-radius:var(--radius-links); transition:width .2s ease;}
  .gauge-fill.amber{background:var(--color-signal-orange);}
  .gauge-fill.danger{background:var(--status-danger);}

  /* ---------- Kanban (Funil de processos) ---------- */
  .kanban-board{
    display:flex; gap:14px; overflow-x:auto; padding-bottom:14px;
    scrollbar-width:thin; scrollbar-color:var(--color-smoke) transparent;
    -webkit-overflow-scrolling:touch;
  }
  .kanban-board::-webkit-scrollbar{height:10px;}
  .kanban-board::-webkit-scrollbar-track{background:var(--color-carbon); border-radius:var(--radius-pill);}
  .kanban-board::-webkit-scrollbar-thumb{background:var(--color-smoke); border-radius:var(--radius-pill);}
  .kanban-board::-webkit-scrollbar-thumb:hover{background:var(--color-silver-mist);}
  /* A coluna é a trilha recuada (carbon); os cards dentro dela sobem para
     obsidian, mantendo o mesmo modelo de elevação do resto do app. */
  .kanban-col{background:var(--color-carbon); border:1px solid var(--color-smoke); border-radius:var(--radius-cards); padding:10px; min-width:212px; flex-shrink:0;}
  .kanban-col-header{font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:-0.37px; color:var(--color-platinum); display:flex; justify-content:space-between; align-items:center; padding:2px 4px 8px 4px;}
  .kanban-count{background:var(--color-graphite); color:var(--color-frost-white); border-radius:var(--radius-pill); padding:1px 8px; font-variant-numeric:tabular-nums; font-size:11px;}
  .kanban-cards{display:flex; flex-direction:column; gap:8px;}
  .kanban-empty{text-align:center; color:var(--color-platinum); font-size:12px; padding:14px 0;}
  .kanban-card{background:var(--color-obsidian); border:1px solid var(--color-smoke); border-radius:var(--radius-links); padding:10px 11px;}
  .kanban-card-title{font-size:13px; font-weight:600; color:var(--color-frost-white); margin-bottom:4px;}
  .kanban-card-meta{font-size:11px; color:var(--color-platinum); margin-bottom:3px;}
  .kanban-card-link{font-size:11px; color:var(--color-halo-blue); margin-bottom:3px;}
  .kanban-card-date{font-size:11px; font-weight:600; font-variant-numeric:tabular-nums; margin:4px 0; color:var(--color-frost-white);}
  .kanban-card-date.amber{color:var(--color-signal-orange);}
  .kanban-card-date.danger{color:var(--status-danger);}
  .kanban-card-actions{display:flex; gap:6px; margin-top:8px; align-items:center;}
  .kanban-stage-select{flex:1; font-size:11px; padding:5px 6px; border:1px solid var(--color-smoke); border-radius:var(--radius-links); font-family:var(--font-body); background:var(--color-carbon); color:var(--color-frost-white);}

  /* ---------- Pricing calculators (Studio / Works) ---------- */
  .calc-grid{display:grid; grid-template-columns:minmax(280px,380px) 1fr; gap:16px; align-items:start;}
  @media (max-width:900px){ .calc-grid{grid-template-columns:1fr;} }
  .calc-cost-line{display:flex; justify-content:space-between; padding:6px 0; font-size:13px; border-bottom:1px solid var(--color-graphite); color:var(--color-platinum);}
  .calc-cost-line span:first-child{color:var(--color-platinum);}
  .calc-cost-line span:last-child{font-variant-numeric:tabular-nums; color:var(--color-frost-white);}
  .calc-cost-line.total{font-weight:700; border-bottom:none; border-top:1px solid var(--color-smoke); padding-top:10px; margin-top:2px; font-size:16px; color:var(--color-frost-white);}
  .calc-cost-line.total span{font-variant-numeric:tabular-nums;}
  .channel-tiles{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:6px;}
  @media (max-width:520px){ .channel-tiles{grid-template-columns:1fr;} }
  .channel-tile{border:1px solid var(--color-smoke); border-radius:var(--radius-links); padding:13px 14px; cursor:pointer; transition:border-color .15s ease, background .15s ease; background:var(--color-carbon);}
  .channel-tile:hover{border-color:var(--color-silver-mist);}
  .channel-tile.selected{border-color:var(--color-apple-blue); background:rgba(0,113,227,0.10);}
  .channel-tile .ch-name{font-size:10px; text-transform:uppercase; letter-spacing:-0.37px; color:var(--color-platinum); font-weight:600; display:flex; justify-content:space-between; align-items:center;}
  .channel-tile .ch-price{font-variant-numeric:tabular-nums; font-size:20px; font-weight:700; color:var(--color-frost-white); margin-top:5px;}
  .channel-tile .ch-profit{font-size:11px; color:var(--status-good); margin-top:3px;}
  .channel-tile .ch-check{width:16px; height:16px; border-radius:50%; border:1px solid var(--color-smoke); flex-shrink:0;}
  .channel-tile.selected .ch-check{background:var(--color-apple-blue); border-color:var(--color-apple-blue);}
  .calc-list-row{display:flex; justify-content:space-between; align-items:center; padding:11px 0; border-bottom:1px solid var(--color-graphite); gap:10px;}
  .calc-list-row:last-child{border-bottom:none;}
  .calc-list-row .li-desc{font-size:14px; font-weight:600; color:var(--color-frost-white);}
  .calc-list-row .li-meta{font-size:11px; color:var(--color-platinum); margin-top:2px;}
  .calc-list-row .li-price{font-variant-numeric:tabular-nums; font-size:14px; font-weight:600; white-space:nowrap; color:var(--color-frost-white);}
  .pill{display:inline-block; padding:3px 10px; border-radius:var(--radius-pill); font-size:11px; font-weight:700;}
  .pill-ok{background:var(--status-good-bg); color:var(--status-good);}
  .pill-warn{background:var(--status-danger-bg); color:var(--status-danger);}
  .calc-empty-hint{font-size:12px; color:var(--color-platinum); padding:16px 0; text-align:center;}
  .material-row-grid{display:grid; grid-template-columns:2fr 1fr 1fr auto; gap:10px; align-items:end; margin-bottom:10px;}
  @media (max-width:640px){ .material-row-grid{grid-template-columns:1fr 1fr; }}

  /* ---------- Tab bar (Configurações, editor de documento) ---------- */
  .tabbar{
    display:flex; gap:4px; background:var(--color-carbon); border:1px solid var(--color-smoke);
    border-radius:var(--radius-pill); padding:4px; margin-bottom:20px; overflow-x:auto;
  }
  .tabbar button{
    all:unset; cursor:pointer; box-sizing:border-box;
    flex:1; text-align:center; white-space:nowrap;
    padding:9px 16px; border-radius:var(--radius-pill);
    font-family:var(--font-body); font-size:13px; font-weight:600; letter-spacing:-0.22px;
    color:var(--color-platinum);
  }
  .tabbar button:hover{color:var(--color-frost-white);}
  .tabbar button.active{background:var(--color-apple-blue); color:var(--color-paper-white);}
  .tabbar + .card, .tabbar + div > .card:first-child{margin-top:0;}

  /* ---------- Document editor tabs (Detalhes / Itens / Material / Notas) ---------- */
  .doc-panel{display:none;}
  .doc-panel.active{display:block;}

  #import-file-input{display:none;}

  /* ---------- Login screen (dark hero, single CTA) ---------- */
  #login-screen{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--color-pure-black); padding:20px;
  }
  .login-card{
    background:var(--color-obsidian); border:1px solid var(--color-smoke); border-radius:var(--radius-cards); padding:36px 34px; max-width:380px; width:100%;
  }
  .login-brand{font-family:var(--font-display); font-weight:700; font-size:24px; letter-spacing:-0.24px; color:var(--color-frost-white); margin-bottom:2px;}
  .login-brand small{display:block; font-size:10px; letter-spacing:-0.37px; color:var(--color-signal-orange); text-transform:uppercase; font-weight:600; margin-bottom:22px;}
  .login-card .field{margin-bottom:14px;}
  .login-error{background:var(--status-danger-bg); color:var(--status-danger); font-size:12px; padding:9px 12px; border-radius:var(--radius-links); margin-bottom:14px; display:none;}
  .login-error.show{display:block;}
  .login-actions{display:flex; flex-direction:column; gap:8px; margin-top:8px;}
  .login-toggle{text-align:center; font-size:12px; color:var(--color-platinum); margin-top:16px;}
  .login-toggle a{color:var(--color-halo-blue); cursor:pointer; font-weight:600;}
  .login-loading{text-align:center; padding:60px 20px; color:var(--color-platinum); font-family:var(--font-body);}

  /* ============================================================
     Print documents (Estimate / Invoice) — this is a physical,
     client-facing deliverable, not an app screen, so it stays in
     the "Light detail band" register of the system: Paper White
     canvas, Obsidian ink, Signal Orange as the sole eyebrow/tag
     color. Caveat is kept only for the handwritten signature and
     "Obrigado!" flourish — a deliberate, narrow exception, not a
     second UI typeface.
     ============================================================ */
  #print-area{display:none;}
  @media print{
    body{background:#fff;}
    body *{visibility:hidden;}
    #print-area, #print-area *{visibility:visible;}
    #print-area{display:block; position:absolute; top:0; left:0; width:100%; padding:0; margin:0;}
    @page{margin:16mm;}
  }
  .doc-page{font-family:var(--font-body); color:var(--color-obsidian); max-width:760px; margin:0 auto; background:var(--color-paper-white);}
  .doc-header{display:flex; justify-content:space-between; align-items:flex-start; padding-bottom:18px; border-bottom:1px solid var(--color-obsidian); margin-bottom:22px;}
  .doc-brand{font-family:var(--font-display); font-weight:700; font-size:24px; color:var(--color-obsidian);}
  .doc-brand .line-tag{display:block; font-family:var(--font-body); font-weight:600; font-size:11px; letter-spacing:-0.19px; text-transform:uppercase; color:var(--color-signal-orange); margin-top:2px;}
  .doc-meta{text-align:right; font-size:13px; color:var(--color-platinum); line-height:1.43;}
  .doc-title{font-family:var(--font-display); font-size:14px; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:var(--color-link-blue);}
  .doc-parties{display:flex; justify-content:space-between; margin-bottom:22px; gap:30px;}
  .doc-parties .block{flex:1; font-size:13px; line-height:1.6;}
  .doc-parties .block-label{font-size:10px; text-transform:uppercase; letter-spacing:-0.37px; color:var(--color-platinum); font-weight:600; margin-bottom:4px;}
  .doc-table{width:100%; border-collapse:collapse; margin-bottom:14px;}
  .doc-table th{text-align:left; font-size:10px; text-transform:uppercase; letter-spacing:-0.37px; color:var(--color-platinum); border-bottom:1px solid var(--color-obsidian); padding:6px 8px;}
  .doc-table td{padding:9px 8px; border-bottom:1px solid var(--color-silver-mist); font-size:13px;}
  .doc-table td.num, .doc-table th.num{text-align:right; font-variant-numeric:tabular-nums;}
  .doc-totals{width:300px; margin-left:auto; margin-top:6px;}
  .doc-totals .row{display:flex; justify-content:space-between; font-size:13px; padding:5px 0;}
  .doc-totals .row.grand{border-top:1px solid var(--color-obsidian); margin-top:6px; padding-top:10px; font-weight:700; font-size:19px; font-variant-numeric:tabular-nums;}
  .doc-totals .row.balance{color:var(--color-signal-orange); font-weight:700; border-top:1px dashed var(--color-silver-mist); margin-top:6px; padding-top:8px;}
  .doc-notes{margin-top:26px; font-size:12px; color:var(--color-platinum); border-top:1px solid var(--color-silver-mist); padding-top:14px; line-height:1.6; white-space:pre-wrap;}
  .doc-footer{margin-top:30px; text-align:center; font-size:11px; color:var(--color-platinum);}
  .doc-status-stamp{
    display:inline-block; margin-top:8px; padding:4px 12px; border-radius:var(--radius-links); font-size:11px; font-weight:700; letter-spacing:-0.19px; text-transform:uppercase;
  }
  .doc-sign{margin-top:40px; display:flex; gap:40px;}
  .doc-sign .line{flex:1; border-top:1px solid var(--color-platinum); padding-top:6px; font-size:11px; color:var(--color-platinum);}

  /* ---- Print v2 layout ---- */
  .doc-header-v2{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:4px; gap:20px;}
  .doc-brand-block{display:flex; flex-direction:column; align-items:flex-start;}
  .doc-logo-img{height:96px; width:auto; margin-bottom:8px;}
  .doc-brandname{font-family:var(--font-display); font-weight:700; font-size:22px; color:var(--color-obsidian); line-height:1.17;}
  .doc-type-block{text-align:right; flex-shrink:0;}
  .doc-title-tag{font-family:var(--font-display); font-weight:700; font-size:14px; letter-spacing:1.5px; color:var(--color-obsidian);}
  .doc-company-block{font-size:12px; color:var(--color-platinum); line-height:1.6; margin-top:6px;}
  .doc-company-block .cname{font-weight:700; color:var(--color-obsidian); font-size:13px;}
  .doc-meta-row{display:flex; justify-content:space-between; gap:24px; margin:22px 0 20px 0; padding-top:16px; border-top:1px solid var(--color-silver-mist);}
  .doc-meta-col{flex:1;}
  .doc-meta-col .label{font-size:10px; letter-spacing:-0.37px; text-transform:uppercase; color:var(--color-signal-orange); font-weight:600; margin-bottom:6px;}
  .doc-meta-col .content{font-size:13px; line-height:1.6; color:var(--color-obsidian);}
  .doc-meta-table{min-width:190px; border-collapse:collapse;}
  .doc-meta-table tr td{padding:3px 0; font-size:12px;}
  .doc-meta-table tr td.k{font-weight:700; color:var(--color-obsidian); padding-right:16px; text-transform:uppercase; font-size:10px; letter-spacing:-0.37px; white-space:nowrap;}
  .doc-meta-table tr td.v{text-align:right; font-variant-numeric:tabular-nums; color:var(--color-platinum);}
  .doc-items-v2{width:100%; border-collapse:collapse; margin:6px 0 14px 0;}
  .doc-items-v2 thead th{border-top:2px solid var(--color-signal-orange); border-bottom:1px solid var(--color-silver-mist); text-align:left; padding:10px 8px; font-size:10px; text-transform:uppercase; letter-spacing:-0.37px; color:var(--color-obsidian); font-weight:700;}
  .doc-items-v2 thead th.num{text-align:right;}
  .doc-items-v2 td{padding:9px 8px; font-size:13px; border-bottom:1px solid var(--color-silver-mist);}
  .doc-items-v2 td.num{text-align:right; font-variant-numeric:tabular-nums;}
  .doc-sig-script{font-family:var(--font-script); font-size:30px; color:var(--color-obsidian); line-height:1;}
  .doc-thankyou{font-family:var(--font-script); font-weight:700; font-size:50px; color:var(--color-link-blue); margin:34px 0 8px 0; line-height:1;}
  .doc-terms{display:flex; gap:16px; margin-top:6px;}
  .doc-terms .bar{width:3px; background:var(--color-signal-orange); border-radius:2px; flex-shrink:0;}
  .doc-terms .content{font-size:12px; color:var(--color-platinum); line-height:1.8;}
  .doc-terms .heading{color:var(--color-signal-orange); font-weight:700; font-size:12px; text-transform:uppercase; letter-spacing:-0.19px; margin-bottom:6px;}

  /* ============================================================
     Mobile — tuned for iPhone Safari (iPhone 17 Pro Max class
     devices, ~430pt CSS viewport). Runs standalone via
     "Add to Home Screen" (see apple-mobile-web-app meta tags),
     so we also respect the notch/Dynamic Island and home
     indicator via env(safe-area-inset-*).
     ============================================================ */
  @media (max-width: 880px){
    .form-grid, .form-grid.cols-3{grid-template-columns:1fr;}
    .stat-grid{grid-template-columns:1fr 1fr;}
    #sidebar{width:64px;}
    #dock-field{width:120px;}
    .brand, nav.mainnav button span.label, .sidebar-footer{display:none;}
    nav.mainnav button{justify-content:center; margin:0 6px; padding:9px;}
  }

  @media (max-width: 600px){
    #app{flex-direction:column;}
    /* ---- Sidebar becomes a fixed bottom icon tab bar, like a native iOS app ---- */
    #sidebar{
      width:100%; height:auto; flex-direction:row;
      position:fixed; left:0; right:0; bottom:0; z-index:80;
      padding:6px 4px calc(6px + env(safe-area-inset-bottom)) 4px;
      border-right:none; border-top:1px solid var(--glass-hairline);
    }
    .brand{display:none;}
    nav.mainnav{
      margin-top:0; flex-direction:row; gap:0; overflow-x:auto; overflow-y:visible;
      width:100%; -webkit-overflow-scrolling:touch;
    }
    nav.mainnav button{
      flex:1 0 auto; min-width:58px; flex-direction:column; gap:3px;
      margin:0; padding:7px 6px; border:1px solid transparent;
      border-radius:var(--radius-links);
    }
    nav.mainnav button span.label{
      display:block; font-size:9px; font-weight:600; letter-spacing:-0.19px;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:64px;
    }
    nav.mainnav button .icon{width:22px; height:22px; font-size:0;}
    nav.mainnav button.active{border:1px solid transparent; background:transparent;}
    nav.mainnav button.active .icon svg{stroke:var(--color-halo-blue);}
    /* No proximity field on a coarse pointer — the rail keeps the glass
       panel and the sliding indicator, which both work under touch. */
    .nav-indicator{border-left:1px solid var(--glass-hairline-top);}
    #dock-field{inset:auto 0 0 0; width:100%; height:150px;}
    #dock-field i:nth-child(1){left:-40px; top:-70px;}
    #dock-field i:nth-child(2){left:38%;   top:-50px;}
    #dock-field i:nth-child(3){left:auto; right:-30px; top:-30px;}
    .sidebar-footer{display:none;}

    #main{
      padding:calc(16px + env(safe-area-inset-top)) 16px calc(84px + env(safe-area-inset-bottom)) 16px;
    }
    .view-title{font-size:26px;}
    .view-header{align-items:flex-start;}
    .view-header .btn{padding:9px 14px; font-size:13px;}

    .stat-grid{grid-template-columns:1fr 1fr; gap:10px;}
    .stat-card{padding:14px;}

<script>
/* Domain rules shared by the application and regression tests. No I/O. */
(function(root){
  'use strict';
  const collections=['clients','estimates','invoices','expenses','marketplaceSales','notes','pipeline','catalog','engineeringProjects','mileageLogs','taxPayments','tax1099','inventory','orders','parts','partRevisions','stockMovements'];
  const clone=x=>JSON.parse(JSON.stringify(x));
  function approval(state,estimate,makeId,today){
    if(!estimate.clientId) throw Error('Selecione um cliente antes de aprovar.');
    const existing=state.orders.find(o=>o.id===estimate.orderId||o.estimateId===estimate.id);
    if(existing && existing.clientId!==estimate.clientId) throw Error('O cliente deve ser o mesmo do pedido vinculado.');
    const order=existing?clone(existing):{id:makeId(),number:'PED-'+estimate.number,title:estimate.items.find(i=>i.desc)?.desc||estimate.number,clientId:estimate.clientId,businessLine:estimate.businessLine,estimateId:estimate.id,revisionIds:estimate.revisionId?[estimate.revisionId]:[],deliveryDate:null,notes:'',createdAt:today};
    order.revisionIds=[...new Set([...(order.revisionIds||[]),...(estimate.revisionId?[estimate.revisionId]:[])])];
    order.estimateId=estimate.id;order.approvedAt=order.approvedAt||today;
    const revision=state.partRevisions.find(r=>r.id===estimate.revisionId);
    const hasProduction=state.pipeline.some(p=>p.orderId===order.id);
    const legacyProduction=state.pipeline.find(p=>!p.orderId&&p.estimateId===estimate.id);
    const production=hasProduction?null:legacyProduction?{...clone(legacyProduction),orderId:order.id}:{id:makeId(),orderId:order.id,clientId:order.clientId,businessLine:order.businessLine,title:order.title,estimateId:estimate.id,invoiceId:null,revisionId:revision?.id||null,partId:revision?.partId||null,revisionSnapshot:revision?clone(revision):null,engineeringProjectId:revision?.engineeringProjectId||null,material:revision?.material||'',stage:'fila',forecastDate:order.deliveryDate||null,horasMaquina:0,notes:'',createdAt:today,printedAt:null,completedAt:null,history:[{stage:'fila',at:today}]};
    return {order,production,estimate:{...clone(estimate),orderId:order.id,status:'accepted',acceptedAt:estimate.acceptedAt||today}};
  }
  function stageChange(card,stage,today){
    const stages=['fila','escaneamento_cad','imprimindo','pos_processamento','qualidade','pronto','entregue'];
    if(!stages.includes(stage)) throw Error('Etapa inválida.');
    const next=clone(card); next.stage=stage;next.updatedAt=today;
    if(stage!==card.stage) next.history=[...(card.history||[]),{stage,at:today}];
    if(stages.indexOf(stage)>=3&&!next.printedAt)next.printedAt=today;
    if(stage==='entregue'&&!next.completedAt)next.completedAt=today;
    if(stage!=='entregue')next.completedAt=null;
    return next;
  }
  function backup(state){return {app:'reverso-gestor',version:3,exportedAt:new Date().toISOString(),settings:clone(state.settings),...Object.fromEntries(collections.map(k=>[k,clone(state[k]||[])]))};}
  function restore(state,payload){
    if(!payload||payload.app!=='reverso-gestor'||!Array.isArray(payload.clients)) throw Error('Backup Reverso inválido.');
    const next=clone(state);
    for(const key of collections){
      if(!(key in payload))continue; // Older backups cannot erase omitted modules.
      if(!Array.isArray(payload[key]))throw Error('Coleção inválida: '+key);
      const ids=new Set();
      for(const row of payload[key]){if(!row||typeof row.id!=='string'||!row.id||ids.has(row.id))throw Error('Identificador ausente ou duplicado em '+key);ids.add(row.id);}
      next[key]=clone(payload[key]);
    }
    if(payload.settings){if(typeof payload.settings!=='object'||Array.isArray(payload.settings))throw Error('Configurações inválidas.');next.settings={...next.settings,...clone(payload.settings)};}
    return next;
  }
  function stockConsumption(item,card,grams,makeId,today){
    if(!Number.isFinite(grams)||grams<=0)throw Error('Informe o consumo em gramas.');
    if(grams>Number(item.qty)*1000+0.000001)throw Error('Saldo insuficiente neste lote.');
    return {item:{...clone(item),qty:Math.round((Number(item.qty)-grams/1000)*1e6)/1e6},movement:{id:makeId(),inventoryId:item.id,productionId:card.id,orderId:card.orderId||null,grams,cost:grams/1000*Number(item.costKg||0),date:today}};
  }
  const api={collections,clone,approval,stageChange,backup,restore,stockConsumption};
  if(typeof module!=='undefined'&&module.exports)module.exports=api;else root.ReversoModel=api;
})(typeof window==='undefined'?{}:window);

</script>

/* =========================================================
   TIME-FRACTION HELPER (h.mm — "hora e minutos", NÃO decimal puro)
   ---------------------------------------------------------
   Usado nos serviços cobrados por hora (Escaneamento 3D, Impressão,
   Pós-Processamento, Controle de Qualidade): 1.45 = 1h45min, não
   1h27min. A parte inteira é hora cheia; os dois primeiros dígitos
   decimais são minutos (0–59) direto.
========================================================= */
function hmmToDecimalHours(raw){
  const v = Number(raw);
  if(!isFinite(v) || v < 0) return 0;
  const hours = Math.floor(v);
  let minutesPart = Math.round((v - hours) * 100);
  if(minutesPart >= 60) minutesPart = 59; // trava — não existe "1.75" (1h75min)
  return hours + (minutesPart/60);
}
function hmmLabel(raw){
  const v = Number(raw)||0;
  const hours = Math.floor(v);
  let minutesPart = Math.round((v - hours) * 100);
  if(minutesPart >= 60) minutesPart = 59;
  if(hours===0 && minutesPart===0) return "0min";
  return (hours>0 ? hours+"h" : "") + (minutesPart>0 ? (hours>0?String(minutesPart).padStart(2,"0"):minutesPart)+"min" : "");
}

async function loadAll(){

  state.settings.pricing = Object.assign({}, DEFAULT_PRICING, savedSettings.pricing || {});

  }
  /* Carga paralela: eram 8 round-trips sequenciais. */
  const loaded = await Promise.all(COLLECTION_NAMES.map(n => loadCollection(n)));
  COLLECTION_NAMES.forEach((n, i) => { state[n] = loaded[i]; });
  state.clients = state.clients.map(normalizeClient);

  ready = true;
}

/* Espelho dos ids que sabemos existir no servidor. Alimentado na carga e
   mantido a cada gravação, para que persist() não precise reler a coleção. */
const _persistedIds = {};

async function loadCollection(name){
  try{
    const snap = await userColRef(name).get();
    _persistedIds[name] = new Set(snap.docs.map(d => d.id));
    return snap.docs.map(d => d.data());
  }catch(e){
    _persistedIds[name] = new Set();
    showToast("Erro ao carregar " + name + ". Verifique sua conexão.");
    throw e;
  }
}

/* Gravação incremental.
   A versão anterior relia e reescrevia a coleção inteira a cada salvamento:
   com 300 faturas, salvar uma linha custava 300 leituras + 300 escritas, e
   acima de 500 itens o batch estourava o limite do Firestore exibindo
   "verifique sua conexão". Agora a leitura some e, passando o id tocado,
   só esse documento é escrito. Sem id, grava tudo (import/restauração). */
async function persist(collectionKey, touchedIds){
  if(demoMode) return true;
  try{
    if(collectionKey === "settings"){
      // merge:true — duas abas abertas não apagam mais as alterações uma da outra
      await userDocRef().set(state.settings, {merge:true});
      return true;
    }
    const col = userColRef(collectionKey);
    const known = _persistedIds[collectionKey] || (_persistedIds[collectionKey] = new Set());
    const currentIds = new Set(state[collectionKey].map(x => String(x.id)));

    let toWrite = state[collectionKey];
    if(touchedIds !== undefined && touchedIds !== null){
      const wanted = new Set([].concat(touchedIds).map(String));
      toWrite = state[collectionKey].filter(x => wanted.has(String(x.id)));
    }
    const toDelete = [];
    known.forEach(id => { if(!currentIds.has(id)) toDelete.push(id); });

    const ops = toWrite.map(item => ({t:"set", item}))
                 .concat(toDelete.map(id => ({t:"del", id})));
    for(let i = 0; i < ops.length; i += 450){   // Firestore: máx. 500 operações por batch
      const batch = db.batch();
      ops.slice(i, i + 450).forEach(op => {
        if(op.t === "set") batch.set(col.doc(String(op.item.id)), Model.clone(op.item));
        else batch.delete(col.doc(op.id));
      });
      await batch.commit();
    }
    toWrite.forEach(x => known.add(String(x.id)));
    toDelete.forEach(id => known.delete(id));
    return true;
  }catch(e){
    showToast("Erro ao salvar (" + ((e && e.code) || "desconhecido") + "). Tente novamente.");
    return false;
  }
}

async function persistAll(){
  await persist("settings");
  for(const name of COLLECTION_NAMES){ await persist(name); }
}

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

function fmtMoney(n){
  n = Number(n) || 0;
  return "$" + n.toLocaleString("en-US", {minimumFractionDigits:2, maximumFractionDigits:2});
}
function fmtDate(iso){
  if(!iso) return "—";
  const d = new Date(iso + "T00:00:00");
  if(isNaN(d)) return iso;
  return d.toLocaleDateString("pt-BR", {day:"2-digit", month:"2-digit", year:"numeric"});
}
/* Datas sempre no fuso local. toISOString() é UTC: em Fremont (UTC-7/-8)
   das 17h à meia-noite ele devolve o dia seguinte, o que virava o mês
   inteiro do Painel no dia 30/31 e antecipava vencimentos. */
function localISO(d){
  return new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10);
}
function todayISO(){
  return localISO(new Date());
}
function addDays(iso, days){
  const d = new Date(iso + "T00:00:00");
  d.setDate(d.getDate() + days);
  return localISO(d);
}
function escapeHTML(str){
  return String(str == null ? "" : str).replace(/[&<>"']/g, m => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[m]));
}

}

function normalizeClient(c){

/* Endereço no estilo do formulário da UPS: linha 1, linha 2 (opcional), cidade/estado/CEP, país. */
function formatAddressLines(addr){
  if(!addr) return [];
  if(typeof addr === "string") return addr.split("\n").map(s=>s.trim()).filter(Boolean);
  const lines = [];
  if(addr.line1) lines.push(addr.line1);
  if(addr.line2) lines.push(addr.line2);
  const cityStateZip = [addr.city, addr.state].filter(Boolean).join(", ") + (addr.zip ? " " + addr.zip : "");
  if(cityStateZip.trim()) lines.push(cityStateZip.trim());
  if(addr.country && addr.country.trim() && addr.country !== "Estados Unidos") lines.push(addr.country);
  return lines;
}
function formatAddressHTML(addr){
  const lines = formatAddressLines(addr);
  return lines.length ? lines.map(escapeHTML).join("<br>") : "";
}

/* Máscara de telefone americano: aceita dígitos digitados em sequência e formata (000) 000-0000. */
function formatUSPhone(raw){
  const d = digitsOnly(raw).slice(0,10);
  if(d.length === 0) return "";
  if(d.length < 4) return "(" + d;
  if(d.length < 7) return "(" + d.slice(0,3) + ") " + d.slice(3);
  return "(" + d.slice(0,3) + ") " + d.slice(3,6) + "-" + d.slice(6);
}
function attachPhoneMask(input){
  if(!input) return;
  input.addEventListener("input", ()=>{
    const pos = input.selectionStart;
    const before = input.value.length;
    input.value = formatUSPhone(input.value);
    const after = input.value.length;
    const newPos = Math.max(0, (pos||0) + (after-before));
    try{ input.setSelectionRange(newPos, newPos); }catch(e){}
  });
}
/* Diferença em dias inteiros entre duas datas ISO (b - a). */
function daysBetween(isoA, isoB){
  const a = new Date((isoA||todayISO()) + "T00:00:00");
  const b = new Date((isoB||todayISO()) + "T00:00:00");
  return Math.round((b - a) / 86400000);
}
/* Só dígitos — usado para montar o link do WhatsApp a partir do telefone cadastrado. */
function digitsOnly(str){
  return String(str||"").replace(/\D/g, "");
}
function waLink(phone, text){
  let digits = digitsOnly(phone);
  if(!digits) return null;
  /* Número US de 10 dígitos precisa do country code, senão o link do
     WhatsApp abre em branco. */
  if(digits.length === 10) digits = "1" + digits;
  return "https://wa.me/" + digits + "?text=" + encodeURIComponent(text);
}
function mailtoLink(email, subject, body){
  if(!email) return null;
  return "mailto:" + encodeURIComponent(email) + "?subject=" + encodeURIComponent(subject) + "&body=" + encodeURIComponent(body);
}
async function copyToClipboard(text){
  try{
    await navigator.clipboard.writeText(text);
    showToast("Mensagem copiada.");
  }catch(e){
    showToast("Não foi possível copiar automaticamente. Selecione o texto manualmente.");
  }
}
function buildFollowUpMessage(client, estimate){
  const tpl = state.settings.followUpMessageTemplate || DEFAULT_SETTINGS.followUpMessageTemplate;
  const dias = daysBetween(estimate.sentDate || estimate.date, todayISO());
  return tpl
    .replace(/\{cliente\}/g, client ? client.name : "")
    .replace(/\{numero\}/g, estimate.number || "")
    .replace(/\{valor\}/g, fmtMoney(calcDocTotals(estimate).total))
    .replace(/\{dias\}/g, String(dias));
}
/* Orçamentos "sent" há >= followUpDays dias, sem fatura já gerada a partir deles,
   e sem contato registrado nos últimos 5 dias (evita ficar reaparecendo todo dia). */
function estimatesNeedingFollowUp(){
  const threshold = Number(state.settings.followUpDays) || 15;
  return state.estimates.filter(e => {
    if(e.status !== "sent") return false;
    const already = state.invoices.some(inv => inv.fromEstimateNumber === e.number);
    if(already) return false;
    const dias = daysBetween(e.sentDate || e.date, todayISO());
    if(dias < threshold) return false;
    if(e.lastFollowUpAt && daysBetween(e.lastFollowUpAt, todayISO()) < 5) return false;
    return true;
  }).sort((a,b)=> daysBetween(b.sentDate||b.date, todayISO()) - daysBetween(a.sentDate||a.date, todayISO()));
}

/* Estágios em que a impressão JÁ ocorreu — as horas de máquina só contam
   a partir daqui. Antes qualquer card com horas previstas debitava o
   intervalo de limpeza (inclusive um card ainda na fila), e a referência
   temporal caía em forecastDate, uma data FUTURA, que passava no teste
   "ref >= since" no dia em que era criada. O contador superestimava e
   disparava o alerta de limpeza cedo demais. */
const PRINTED_STAGES = ["pos_processamento", "qualidade", "pronto", "entregue"];
function hasPrinted(stage){ return PRINTED_STAGES.indexOf(stage) >= 0; }

function machineHoursSinceLastCleaning(){
  const since = state.settings.lastCleaningDate;
  return state.pipeline
    .filter(c => hasPrinted(c.stage) && Number(c.horasMaquina) > 0)
    .filter(c => {
      const ref = c.printedAt || c.completedAt || c.createdAt;   // nunca forecastDate
      if(!since) return true;
      return ref && ref >= since;
    })
    .reduce((s,c)=> s + (Number(c.horasMaquina)||0), 0);
}

/* =========================================================
   MANUTENÇÃO (LIMPEZA DA MÁQUINA)
========================================================= */
function maintenanceStatus(){
  const s = state.settings;
  const last = s.lastCleaningDate;
  const daysSince = last ? daysBetween(last, todayISO()) : null;
  const daysLeft = daysSince === null ? (Number(s.cleaningIntervalDays)||14) : (Number(s.cleaningIntervalDays)||14) - daysSince;
  const hoursSince = machineHoursSinceLastCleaning();
  const hoursLeft = (Number(s.cleaningIntervalHours)||150) - hoursSince;
  return {last, daysSince, daysLeft, hoursSince, hoursLeft};
}

/* Totals now support per-item taxability: only items with taxable!==false count toward the taxable base.
   Clientes do tipo "empresa" nunca são tributados, independente do checkbox de cada item. */
/* Quantidade efetiva de uma linha: serviços cobrados por hora usam o
   formato h.mm (ver hmmToDecimalHours) — as demais linhas usam o
   número digitado direto. */
function lineQtyHours(it){
  const cat = it.catalogId ? state.catalog.find(c=>c.id===it.catalogId) : null;
  if(cat && (cat.pricingMode==="hours" || cat.pricingMode==="hours_material")){
    return hmmToDecimalHours(it.qty);
  }
  return Number(it.qty)||0;
}
function lineAmount(it){
  return lineQtyHours(it) * (Number(it.rate)||0);
}
function calcDocTotals(doc){
  let subtotal = 0, taxableBase = 0;
  const client = clientById(doc.clientId);
  const clientIsCompany = client && client.type === "company";
  (doc.items || []).forEach(it => {
    const amt = lineAmount(it);
    subtotal += amt;
    if(it.taxable !== false && !clientIsCompany) taxableBase += amt;
  });
  const taxAmount = doc.applyTax ? taxableBase * (Number(doc.taxRate)||0) : 0;
  const total = subtotal + taxAmount;
  return {subtotal, taxableBase, taxAmount, total};
}

/* Payments: real payments array is the source of truth going forward.
   For invoices saved by an earlier version of this tool (status "paid", no payments logged),
   synthesize a single payment so historic totals still show up correctly in reports. */
function effectivePayments(inv){
  if(inv.payments && inv.payments.length) return inv.payments;
  if(inv.status === "paid"){
    const t = calcDocTotals(inv);
    if(t.total > 0){
      /* Fallback de data: sem ele o pagamento sintético saía com date
         undefined e era descartado por todos os filtros de período. */
      return [{id:"legacy", date: inv.paidDate || inv.date || inv.createdAt || todayISO(),
               amount: t.total, note:"Pagamento único (registrado antes do controle de parcelas)"}];
    }
  }
  return [];
}
function sumPayments(inv){
  return effectivePayments(inv).reduce((s,p)=> s + (Number(p.amount)||0), 0);
}
function balanceDue(inv){
  const t = calcDocTotals(inv);
  return Math.max(0, t.total - sumPayments(inv));
}
/* Excedente pago — antes ficava invisível dentro do Math.max acima. */
function overpayment(inv){
  const t = calcDocTotals(inv);
  return Math.max(0, sumPayments(inv) - t.total);
}
/* Imposto sobre vendas cobrado do cliente é passivo (CDTFA), não receita.
   Rateia cada pagamento entre base e imposto na proporção do documento. */
function paymentSplit(p, inv){
  const t = calcDocTotals(inv);
  const share = t.total > 0 ? (Number(p.amount)||0) / t.total : 0;
  return {receita: t.subtotal * share, imposto: t.taxAmount * share};
}
/* Receita e imposto de um conjunto de pagamentos já filtrado por período. */
function splitPayments(payments){
  let receita = 0, imposto = 0;
  payments.forEach(p => {
    const inv = state.invoices.find(i => i.id === p.invoiceId);
    if(!inv){ receita += Number(p.amount)||0; return; }
    const sp = paymentSplit(p, inv);
    receita += sp.receita;
    imposto += sp.imposto;
  });
  return {receita, imposto};
}
function allPaymentsFlat(){
  const list = [];
  state.invoices.forEach(inv => effectivePayments(inv).forEach(p => list.push(Object.assign({}, p, {invoiceId:inv.id, invoiceNumber:inv.number}))));
  return list;
}

   PRICING CALCULATORS (Studio / Works)
   Same formulas as the Excel calculators, now driven by state.settings.pricing.
========================================================= */
/* Famílias de refugo para os filamentos do catálogo Bambu. Antes o
   catálogo (Configurações → Materiais) e pricing.materiais eram duas
   fontes de verdade desconectadas: mudar o preço do PETG no catálogo não
   afetava a calculadora. Agora a calculadora resolve os dois. */
const MATERIAL_FAMILY = {
  "pla-basic":"PLA/PETG", "pla-matte":"PLA/PETG", "petg-hf":"PLA/PETG",
  "abs":"ASA/ABS", "asa":"ASA/ABS", "pc":"ASA/ABS",
  "tpu-95a-hf":"TPU",
  "pa6-cf":"Nylon/Compósito", "pla-cf":"Nylon/Compósito", "petg-cf":"Nylon/Compósito"
};

function findMaterial(pricing, nome){
  const own = (pricing.materiais||[]).find(m => m.nome === nome);
  if(own) return own;
  const cat = MATERIALS_CATALOG.find(m => m.id === nome || m.name === nome);
  if(cat){
    const fam = (pricing.materiais||[]).find(m => m.nome === MATERIAL_FAMILY[cat.id]);
    return {
      nome: cat.name,
      precoG: materialPriceG(cat),
      refugo: fam ? Number(fam.refugo)||0 : Number(pricing.taxaRefugoGeral)||0
    };
  }
  return null;
}

function materialCost(pricing, nome, manualPriceG, peso){
  const mat = findMaterial(pricing, nome);
  const precoG = mat ? Number(mat.precoG)||0 : Number(manualPriceG)||0;
  const refugo = mat ? Number(mat.refugo)||0 : Number(pricing.taxaRefugoGeral)||0;
  return Number(peso||0) * precoG * (1 + refugo);
}

/* Studio: one product priced across venda direta + Etsy + eBay + Amazon. */
function calcStudioItem(pricing, input){
  /* h.mm, igual aos itens de orçamento/fatura. Antes a calculadora lia
     decimal puro e o mesmo "1.45" valia 1h27min aqui e 1h45min lá. */
  const peso = Number(input.peso)||0, tempo = hmmToDecimalHours(input.tempo), pos = Number(input.pos)||0;
  const custoMaterial = materialCost(pricing, input.material, input.manualPrice, peso);
  const custoMaquina = tempo * (Number(pricing.taxaMaquina)||0);
  const custoMaoObra = (pos/60) * (Number(pricing.taxaMaoObra)||0);
  const custoTotal = custoMaterial + custoMaquina + custoMaoObra;

  const precoDireto = custoTotal * (Number(pricing.markupDireto)||0);
  const lucroDireto = precoDireto - custoTotal;

  function porPlataforma(p){
    const denom = 1 - (Number(p.variavel)||0) - (Number(pricing.margemAlvoMarketplace)||0);
    /* denom <= 0 significa margem-alvo + taxa da plataforma >= 100%: o preço
       é matematicamente impossível. Antes virava 0 em silêncio. */
    if(denom <= 0) return {preco:0, taxa:0, lucro:0, impossivel:true};
    const preco = (custoTotal + (Number(p.fixo)||0)) / denom;
    const taxa = preco*(Number(p.variavel)||0) + (Number(p.fixo)||0);
    const lucro = preco - custoTotal - taxa;
    return {preco, taxa, lucro, impossivel:false};
  }

  return {
    custoMaterial, custoMaquina, custoMaoObra, custoTotal,
    direto: {preco: precoDireto, lucro: lucroDireto},
    etsy: porPlataforma(pricing.plataformas.etsy),
    ebay: porPlataforma(pricing.plataformas.ebay),
    amazon: porPlataforma(pricing.plataformas.amazon)
  };
}

/* Works: one part priced with peça + NRE (with deposit/balance and repetition royalty). */
function calcWorksItem(pricing, input){
  const peso = Number(input.peso)||0, tempo = hmmToDecimalHours(input.tempo), pos = Number(input.pos)||0;
  const horasNRE = Number(input.horasNRE)||0;
  const repeticao = !!input.repeticao;

  const custoMaterial = materialCost(pricing, input.material, input.manualPrice, peso);
  const custoMaquina = tempo * (Number(pricing.taxaMaquina)||0);
  const custoMaoObra = (pos/60) * (Number(pricing.taxaMaoObra)||0);
  const custoPeca = custoMaterial + custoMaquina + custoMaoObra;

  const precoPeca = custoPeca * (Number(pricing.markupDireto)||0);
  const lucroPeca = precoPeca - custoPeca;

  const nreCheio = horasNRE * (Number(pricing.taxaNRE)||0);
  const precoNRE = repeticao ? nreCheio * (Number(pricing.royaltyRepeticao)||0) : nreCheio;
  const deposito = precoNRE * (Number(pricing.depositoNRE)||0);
  const saldo = precoNRE - deposito;

  const totalPedido = precoPeca + precoNRE;
  const abaixoDoMinimo = totalPedido < (Number(pricing.pedidoMinimo)||0);

  return {
    custoMaterial, custoMaquina, custoMaoObra, custoPeca,
    precoPeca, lucroPeca, nreCheio, precoNRE, deposito, saldo,
    totalPedido, abaixoDoMinimo
  };
}

/* =========================================================
   ESTIMATE STATUS (automático — sem seleção manual)
   ---------------------------------------------------------
   O orçamento não tem mais um campo de status editável: ele nasce
   "sent" ao ser salvo pela primeira vez (data.sentDate registrada),
   vira "accepted" quando é convertido em fatura, e é exibido como
   "Expirado" (sem alterar o dado salvo) quando a validade já passou.
========================================================= */
function effectiveEstimateStatus(e){
  if(e.status === "accepted") return "accepted";
  if(e.status === "sent" && e.validUntil && e.validUntil < todayISO()) return "expired";
  return e.status || "sent";
}

const ENGINEERING_MATERIALS = {

function engineeringAnalyze(input){
  const candidates=[];
  const n=(v)=>Number.isFinite(Number(v))?Number(v):0;
  const temp=n(input.temp), peakTemp=n(input.peakTemp), force=n(input.force), area=n(input.area);
  const L=n(input.length), b=n(input.width), h=n(input.thickness), cycles=n(input.cycles);
  const orientation=input.orientation||"XY", load=input.loadType||"none";
  const humidity=input.humidity||"normal", uv=input.uv||"none", chem=input.chemistry||"none";
  const rigidNeed=input.rigidity||"normal", flexibleNeed=input.flexible||"no";
  const walls=Math.max(0,n(input.walls)), infill=Math.max(0,n(input.infill));
  const nozzleHardened=input.nozzleHardened!=="no", chamber=input.chamber||"unknown", drying=input.drying||"unknown";
  const dimensional=input.dimensional||"normal", targetFS=Math.max(1,n(input.targetFS)||2), loadDuration=input.loadDuration||"short";
  const layer=n(input.layerHeight), nozzle=n(input.nozzleDiameter), exposureYears=n(input.exposureYears);

  Object.entries(ENGINEERING_MATERIALS).forEach(([id,d])=>{
    let score=100, hard=false; const reasons=[], positives=[], actions=[], metrics={};
    const strengthXY=d.fsxy, strengthZ=d.fsxy ? d.fsxy*0.60 : null;
    const strength=orientation==="Z" ? strengthZ : strengthXY;
    const impactValue=orientation==="Z" ? d.impactz : d.impactxy;
    const rank={low:0,medium:1,high:2,"very-high":3};

    // Mechanical capability is deliberately treated as screening, not allowable stress.
    if(flexibleNeed==="yes" && !d.flexible){hard=true;reasons.push("a aplicação exige flexibilidade, mas o material é rígido.");}
    if(flexibleNeed==="no" && d.flexible){score-=35;reasons.push("é flexível e não é a melhor escolha para uma peça estrutural rígida.");}
    if(rigidNeed==="high"){
      if(d.E>=7000){score+=2;positives.push("módulo muito elevado, favorável à rigidez.");}
      else if(d.E<3000){score-=12;reasons.push("módulo relativamente baixo para a rigidez exigida.");}
    } else if(rigidNeed==="very-high"){
      if(d.E>=7000){score+=4;positives.push("módulo muito elevado, adequado a elevada rigidez.");}
      else {score-=18;reasons.push("não oferece módulo de rigidez compatível com a exigência muito alta.");}
    }

    // Thermal: continuous temperature is the primary screening variable; peak is an additional warning.
    if(temp>0){
      if(d.hdt===null){hard=true;score=0;reasons.push("não há HDT comparável no banco para validar esta temperatura.");}
      else{
        const margin=d.hdt-temp; metrics.thermalMargin=margin;
        if(margin<0){hard=true;score=0;reasons.push(`HDT de ${d.hdt} °C abaixo da temperatura contínua de serviço de ${temp} °C.`);}
        else if(margin<15){score-=30;reasons.push(`margem até o HDT de apenas ${margin} °C; baixa margem térmica para uma peça funcional.`);}
        else if(margin<30){score-=12;reasons.push(`margem térmica moderada de ${margin} °C até o HDT.`);}
        else {score+=4;positives.push(`margem térmica de ${margin} °C até o HDT.`);}
      }
      if(d.maxTemp && temp>d.maxTemp){hard=true;score=0;reasons.push(`temperatura contínua excede a referência conservadora de ${d.maxTemp} °C usada pelo sistema.`);}
    }
    if(peakTemp>0 && d.hdt!==null && peakTemp>d.hdt){score-=12;reasons.push(`pico térmico de ${peakTemp} °C ultrapassa o HDT de referência (${d.hdt} °C); duração do pico deve ser validada.`);}

    // Moisture / conditioning
    if(humidity!=="normal"){
      if(d.water>=2){score-=20;reasons.push(`absorção de água elevada (${d.water.toFixed(2)}%); propriedades e processo são sensíveis à umidade.`);actions.push("secar e armazenar hermeticamente; registrar condição do filamento");}
      else if(d.water>=1){score-=8;reasons.push(`absorção de água relevante (${d.water.toFixed(2)}%).`);actions.push("controlar secagem e armazenamento");}
      else {score+=4;positives.push(`baixa absorção de água (${d.water.toFixed(2)}%).`);}
    }
    if((d.drying==="Obrigatória"||d.drying==="Recomendada") && drying!=="yes"){
      if(drying==="no"){score-=20;reasons.push("o filamento exige/recomenda secagem e foi informado como não seco.");}
      else {score-=8;reasons.push("a condição de secagem não foi confirmada para este material.");}
    }

    // UV / chemistry are screening flags, never certificates.
    if(uv!=="none"){
      if(uv==="high" && d.uv==="high"){score+=8;positives.push("boa adequação relativa para UV/intempéries.");}
      else if(rank[d.uv||"low"]<rank[uv]){score-=12;reasons.push("resistência UV relativa inferior à exigência informada.");}
    }
    if(chem!=="none"){
      const need=chem==="severe"?"very-high":chem==="high"?"high":"medium";
      if(rank[d.chemistry||"low"]<rank[need]){score-=12;reasons.push("perfil químico relativo inferior à exigência; validar o fluido/agente específico.");}
      else {score+=4;positives.push("perfil químico relativo favorável à condição informada.");}
    }

    // Orientation / interlayer risk
    if(orientation==="Z"){
      if(d.impactz<5){score-=20;reasons.push(`impacto Z baixo (${d.impactz} kJ/m²), indicando maior sensibilidade da interface entre camadas.`);}
      else if(d.impactz<10){score-=8;reasons.push(`impacto Z moderado (${d.impactz} kJ/m²); orientação exige validação.`);}
      if(d.cf){score-=5;reasons.push("reforço com fibra torna a orientação e a arquitetura dos cordões especialmente relevantes.");}
    } else if(d.cf && dimensional==="high"){
      score+=7;positives.push("fibra de reforço favorece rigidez e estabilidade dimensional.");
    }

    if(input.loadPath==="interlayer" && d.impactz<10){score-=18;reasons.push("a direção de carregamento atravessa interfaces e a tenacidade Z é limitada.");}

    // Impact
    if(input.impact==="high"){
      if(impactValue>=50){score+=10;positives.push(`alta absorção de impacto no eixo considerado (${impactValue} kJ/m²).`);}
      else if(impactValue<10){score-=20;reasons.push(`tenacidade de impacto baixa no eixo considerado (${impactValue} kJ/m²).`);}
      else if(impactValue<20){score-=8;reasons.push(`tenacidade de impacto apenas moderada (${impactValue} kJ/m²).`);}
    }

    // Mechanical calculations
    let stress=null, deflection=null, fs=null, I=null;
    if(force>0 && load==="axial" && area>0 && strength){
      stress=force/area; fs=strength/stress; metrics.stress=stress; metrics.fs=fs;
      if(fs<1){hard=true;score=0;reasons.push(`FS de triagem ${fs.toFixed(2)} < 1,0.`);}
      else if(fs<targetFS){score-=22;reasons.push(`FS de triagem ${fs.toFixed(2)} abaixo da meta de ${targetFS.toFixed(2)}.`);}
      else if(fs>=targetFS*1.5){score+=7;positives.push(`FS de triagem ${fs.toFixed(2)} supera a meta de projeto.`);}
      else positives.push(`FS de triagem ${fs.toFixed(2)} atende à meta de triagem.`);
    } else if(load==="axial" && force>0){reasons.push("dados insuficientes para calcular tensão axial; informe área resistente.");score-=5;}

    if(force>0 && load==="cantilever" && L>0 && b>0 && h>0 && d.E && strength){
      I=b*Math.pow(h,3)/12; stress=(force*L*(h/2))/I; deflection=(force*Math.pow(L,3))/(3*d.E*I); fs=strength/stress;
      metrics={...metrics,I,stress,fs,deflection};
      if(fs<1){hard=true;score=0;reasons.push(`tensão de flexão produz FS ${fs.toFixed(2)} < 1,0.`);}
      else if(fs<targetFS){score-=22;reasons.push(`FS de flexão ${fs.toFixed(2)} abaixo da meta de ${targetFS.toFixed(2)}.`);}
      else if(fs>=targetFS*1.5){score+=7;positives.push(`FS de flexão ${fs.toFixed(2)} supera a meta.`);}
      else positives.push(`FS de flexão ${fs.toFixed(2)} atende à meta.`);
      if(deflection>h*0.25){score-=10;reasons.push(`deflexão estimada ${deflection.toFixed(3)} mm é alta em relação à espessura ${h} mm.`);}
    } else if(load==="cantilever" && force>0){reasons.push("dados insuficientes para calcular flexão; informe L, b e h.");score-=5;}

    // Cyclic load / creep risk
    if(cycles>=100000){score-=10;reasons.push("vida cíclica alta: fadiga precisa de dados/ensaio específicos para a peça FFF.");}
    else if(cycles>=10000){score-=5;reasons.push("carga cíclica relevante: validar fadiga da peça real.");}
    if((loadDuration==="sustained"||loadDuration==="long") && temp>=60 && force>0){score-=10;reasons.push("carga sustentada em temperatura elevada aumenta o risco de creep.");actions.push("avaliar creep e reduzir tensão sustentada se possível");}
    if(temp>=100 && cycles>=10000){score-=5;reasons.push("temperatura e ciclos simultaneamente elevados aumentam a criticidade de creep/fadiga.");}

    // Process
    if(d.cf && !nozzleHardened){hard=true;score=0;reasons.push("reforço abrasivo exige bico resistente à abrasão.");}
    if(d.chamber.includes("Fechada") && chamber==="open"){score-=15;reasons.push("material se beneficia de câmara fechada e o processo informado é aberto.");actions.push("usar enclosure e controlar gradientes térmicos");}
    if(d.chamber.includes("Alta temperatura") && chamber!=="high-temp"){hard=true;score=0;reasons.push("material exige processo de alta temperatura e a capacidade da câmara não foi confirmada.");actions.push("confirmar capacidade real de bico, mesa e câmara");}
    if(walls>0 && walls<3 && force>0){score-=5;reasons.push("menos de 3 paredes: a seção estrutural deve ser revista antes de confiar no cálculo.");}
    if(infill>0 && infill<30 && force>0){score-=3;reasons.push("infill baixo pode limitar a resistência global; paredes e geometria continuam dominantes.");}
    if(layer>0 && layer>0.32 && force>0){score-=3;reasons.push("camada relativamente alta para uma peça carregada; validar adesão e acabamento da seção crítica.");}
    if(nozzle>0 && d.cf && nozzle<0.4){score-=4;reasons.push("bico pequeno pode aumentar restrições de fluxo com compósitos; confirmar recomendação do fabricante.");}

    if(dimensional==="high" && d.cf){score+=5;positives.push("boa relação entre rigidez e estabilidade dimensional.");}
    if(exposureYears>=5){score-=2;reasons.push("vida de serviço longa: envelhecimento ambiental deve ser validado na peça real.");}

    score=Math.max(0,Math.min(100,score));
    let status=hard?"bad":score>=78?"good":score>=60?"alt":score>=42?"warn":"bad";
    if(status==="bad"&&!hard&&reasons.length===0) reasons.push("pontuação global insuficiente para os critérios informados.");
    candidates.push({id,d,score,status,reasons,positives,actions,stress,deflection,fs,strength,impactValue,metrics});
  });

  candidates.sort((a,b)=>b.score-a.score);
  const feasible=candidates.filter(x=>x.status!=="bad");
  const best=feasible[0]||candidates[0];
  const missing=[];
  if(!input.temp) missing.push("temperatura contínua de serviço");
  if(!input.peakTemp) missing.push("temperatura de pico");
  if(input.loadType!=="none"&&!input.force) missing.push("força máxima");
  if(input.loadType==="axial"&&!input.area) missing.push("área resistente");
  if(input.loadType==="cantilever"&&(!input.length||!input.width||!input.thickness)) missing.push("geometria da seção em flexão");
  if(!input.cycles) missing.push("número de ciclos");
  if(input.environment==="exterior"&&input.uv==="none") missing.push("exposição UV");
  if(input.humidity!=="normal"&&input.drying==="unknown") missing.push("condição de secagem");
  const confidence=Math.max(20,Math.min(97,97-missing.length*8-(input.loadType==="none"?12:0)-(input.chemistry!=="none"?0:2)-(input.loadDuration==="sustained"?2:0)));
  return {candidates,best,missing,confidence};
}

        <div class="note-banner" style="margin-bottom:0">Compósitos exigem bico endurecido e orientação validada.</div>
