  `;

  const readInput=()=>({
    name:engVal("eng-name"),function:engVal("eng-function"),environment:engVal("eng-environment"),humidity:engVal("eng-humidity"),temp:engNum("eng-temp"),peakTemp:engNum("eng-peaktemp"),uv:engVal("eng-uv"),chemistry:engVal("eng-chemistry"),flexible:engVal("eng-flexible"),rigidity:engVal("eng-rigidity"),dimensional:engVal("eng-dimensional"),exposureYears:engNum("eng-years"),loadType:engVal("eng-load"),force:engNum("eng-force"),area:engNum("eng-area"),length:engNum("eng-length"),width:engNum("eng-width"),thickness:engNum("eng-thickness"),targetFS:engNum("eng-fs"),orientation:engVal("eng-orientation"),loadPath:engVal("eng-loadpath"),cycles:engNum("eng-cycles"),loadDuration:engVal("eng-duration"),impact:engVal("eng-impact"),walls:engNum("eng-walls"),infill:engNum("eng-infill"),layerHeight:engNum("eng-layer"),nozzleDiameter:engNum("eng-nozzle-d"),nozzleHardened:engVal("eng-nozzle"),chamber:engVal("eng-chamber"),drying:engVal("eng-drying")
  });

  let lastAnalysis=null;
  const recalc=()=>{
    const input=readInput(), result=engineeringAnalyze(input), b=result.best; lastAnalysis={input,result};
    const alternatives=result.candidates.filter(x=>x.id!==b.id&&x.status!=="bad").slice(0,4);
    const rejected=result.candidates.filter(x=>x.status==="bad").slice(0,6);
    const thermal=b.d.hdt!==null&&input.temp?b.d.hdt-input.temp:null;
    const reason=(b.reasons.length?b.reasons.slice(0,2):b.positives.slice(0,2)).join(" ")||"Melhor equilíbrio entre os critérios informados.";
    const process=[`Secagem: ${b.d.drying}${b.d.dryTemp?` (${b.d.dryTemp} °C, ${b.d.dryHours})`:""}`,`Bico: ${b.d.nozzle}`,`Câmara: ${b.d.chamber}`];

        <div style="font-size:12px;color:var(--color-platinum)">adequação técnica preliminar · confiança ${result.confidence}%</div>

    `;
    return lastAnalysis;
  };
  main.querySelectorAll("input,select").forEach(el=>{el.addEventListener("input",recalc);el.addEventListener("change",recalc);});

  document.getElementById("eng-save").onclick=async()=>{
    const a=recalc(), b=a.result.best, now=new Date().toISOString();
    const p={id:uid(),...a.input,recommendationId:b.id,recommendationName:b.d.name,score:b.score,confidence:a.result.confidence,ranking:a.result.candidates.slice(0,12).map(x=>({id:x.id,name:x.d.name,score:x.score,status:x.status,reasons:x.reasons.slice(0,5)})),calculated:{stress:b.stress,fs:b.fs,deflection:b.deflection,metrics:b.metrics},createdAt:now,updatedAt:now};
    p.revisionId=document.getElementById('eng-revision')?.value||null;
    p.orderId=engineeringContext?.orderId||null;
    const records=[['engineeringProjects',p]];
    const rev=state.partRevisions.find(r=>r.id===p.revisionId);

  document.getElementById("eng-report").onclick=()=>{
    const a=recalc(); openEngineeringReport(a.input,a.result);

}

/* Converte os campos já existentes para o padrão de label flutuante sem
   mudar IDs, valores ou listeners usados pelos módulos. */
function enhanceNativeControls(scope){
  (scope||document).querySelectorAll('.field').forEach(field=>{
    if(field.querySelector('.input-group')) return;
    const label=field.querySelector(':scope > label');
    const control=field.querySelector(':scope > input,:scope > select,:scope > textarea');
    if(!label||!control||control.type==='checkbox'||control.type==='radio') return;
    const group=document.createElement('div'); group.className='input-group';
    control.before(group); group.append(control,label);
    const refresh=()=>group.classList.toggle('is-floating',!!String(control.value||'').trim());
    control.addEventListener('input',refresh); control.addEventListener('change',refresh); refresh();
  });
}

/* ------------------------------------------------------------------
   Glass dock — proximity magnification + sliding indicator.
   Ported from ThreeUI "Animated Top Dock", glass variant (MIT,
   (c) Meng To — github.com/MengTo/threeui). The original is React +
   TypeScript + a three.js bead field; this is the same spring model
   rewritten as vanilla JS and retuned for the Apple Obsidian palette.
   The WebGL layer is replaced by the CSS #dock-field blobs.
   ------------------------------------------------------------------ */
let navBuilt = false;
let dockRefresh = null;

function initNavDock(root){
  const indicator = root.querySelector(".nav-indicator");
  if(!indicator) return;

  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)");
  const fine    = window.matchMedia("(hover:hover) and (pointer:fine)");
  const OPT = { proximity:112, spring:0.19, damping:0.7, heightGrowth:14, drop:4 };
  const clamp = (v,a,b)=> Math.max(a, Math.min(b, v));

  const items = Array.from(root.querySelectorAll("[data-dock-item]"))
    .map(el => ({ el, base:0, value:0, velocity:0, target:0 }));

  let enabled = false, dirty = false, frame = 0;

  function place(){
    const active = root.querySelector("button.active");
    if(!active){ indicator.style.opacity = "0"; return; }
    indicator.style.opacity   = "1";
    indicator.style.width     = active.offsetWidth + "px";
    indicator.style.height    = active.offsetHeight + "px";
    indicator.style.transform = "translate(" + active.offsetLeft + "px," + active.offsetTop + "px)";
  }

  /* Base heights have to be read with every inline style released,
     otherwise a measurement locks in the box the last spring wrote. */
  function measure(){
    enabled = !reduced.matches && fine.matches && window.innerWidth > 600 && root.clientWidth > 0;
    for(const s of items){
      s.el.style.height = ""; s.el.style.transform = "";
      s.el.dataset.dockNear = "false";
      s.value = 0; s.velocity = 0; s.target = 0;
    }
    for(const s of items){ s.base = s.el.getBoundingClientRect().height; }
    dirty = false;
    place();
  }

  function apply(){
    for(const s of items){
      const v = clamp(s.value, 0, 1.08);
      s.el.style.height    = (s.base + OPT.heightGrowth * v).toFixed(2) + "px";
      s.el.style.transform = "translateX(" + (v * OPT.drop).toFixed(2) + "px)";
    }
    place();
  }

  /* Smoothstep of the distance down the rail, so influence falls off
     softly instead of forming a hard edge at the proximity radius. */
  function setTargets(clientY){
    if(!enabled) return;
    const rects = items.map(s => s.el.getBoundingClientRect());
    items.forEach((s,i)=>{
      const centre = rects[i].top + rects[i].height * 0.5;
      const p = clamp(1 - Math.abs(clientY - centre) / Math.max(1, OPT.proximity), 0, 1);
      s.target = p * p * (3 - 2 * p);
      s.el.dataset.dockNear = s.target > 0.08 ? "true" : "false";
    });
    dirty = true;
  }

  function reset(){
    dirty = true;
    for(const s of items){ s.target = 0; s.el.dataset.dockNear = "false"; }
  }

  function draw(){
    if(enabled && dirty){
      let moving = false;
      for(const s of items){
        s.velocity += (s.target - s.value) * OPT.spring;
        s.velocity *= OPT.damping;
        s.value    += s.velocity;
        if(Math.abs(s.target - s.value) < 0.001 && Math.abs(s.velocity) < 0.001){
          s.value = s.target; s.velocity = 0;
        } else { moving = true; }
      }
      apply();
      if(!moving) dirty = false;
    }
    frame = requestAnimationFrame(draw);
  }

  root.addEventListener("pointermove", e => setTargets(e.clientY));
  root.addEventListener("pointerleave", reset);
  root.addEventListener("click", reset);
  root.addEventListener("focusin", e=>{
    const item = e.target && e.target.closest ? e.target.closest("[data-dock-item]") : null;
    if(!enabled || !item) return;
    const idx = items.findIndex(s => s.el === item);
    items.forEach((s,i)=>{
      s.target = i === idx ? 1 : (Math.abs(i - idx) === 1 ? 0.24 : 0);
      s.el.dataset.dockNear = s.target > 0.08 ? "true" : "false";
    });
    dirty = true;
  });
  root.addEventListener("focusout", ()=> requestAnimationFrame(()=>{
    if(!root.contains(document.activeElement)) reset();
  }));

  reduced.addEventListener("change", measure);
  fine.addEventListener("change", measure);
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(measure);

  /* The rail is measured off the sidebar, not off itself: the sidebar's
     height is set by the layout, so a growing item can never resize the
     box we re-measure from and cancel the spring on the next frame. */
  if(typeof ResizeObserver === "function"){
    new ResizeObserver(measure).observe(root.closest("[data-dock-frame]") || root.parentElement || root);
  } else {
    window.addEventListener("resize", measure);
  }

  measure();
  frame = requestAnimationFrame(draw);
  dockRefresh = place;
}

function urgencyClass(dueDate){
  if(!dueDate) return "";

  if(d <= 2) return "amber";

  PIPELINE_STAGES.forEach((s,i)=>{

function renderOperations(main){
  let query="", line="", stage="";
  function draw(){
    const today=todayISO();
    let cards=state.pipeline.slice().sort((a,b)=>(a.forecastDate||"9999").localeCompare(b.forecastDate||"9999"));
    if(query) cards=cards.filter(c=>(c.title||"").toLowerCase().includes(query.toLowerCase())||clientName(c.clientId).toLowerCase().includes(query.toLowerCase())||(c.material||"").toLowerCase().includes(query.toLowerCase()));
    if(line) cards=cards.filter(c=>c.businessLine===line);
    if(stage) cards=cards.filter(c=>c.stage===stage);
    const active=state.pipeline.filter(c=>c.stage!=="entregue");
    const due7=active.filter(c=>c.forecastDate&&daysBetween(today,c.forecastDate)>=0&&daysBetween(today,c.forecastDate)<=7);
    const overdue=active.filter(c=>c.forecastDate&&c.forecastDate<today);
    const printed=active.filter(c=>hasPrinted(c.stage));
    const revenueOpen=state.invoices.filter(i=>["sent","overdue","partial"].includes(i.status)).reduce((s,i)=>s+balanceDue(i),0);
    const focus=[];
    if(overdue.length) focus.push({title:`${overdue.length} entrega(s) atrasada(s)`,sub:"Prioridade de produção",view:"pipeline",kind:"danger"});
    if(due7.length) focus.push({title:`${due7.length} entrega(s) nos próximos 7 dias`,sub:"Confirme capacidade e material",view:"operations",kind:"warn"});
    const low=state.inventory.filter(x=>Number(x.qty||0)<=Number(x.reorder||0));
    if(low.length) focus.push({title:`${low.length} item(ns) abaixo do mínimo`,sub:"Estoque pode bloquear produção",view:"inventory",kind:"warn"});
    const follow=estimatesNeedingFollowUp();
    if(follow.length) focus.push({title:`${follow.length} orçamento(s) sem retorno`,sub:"Oportunidade de follow-up",view:"estimates",kind:"warn"});
    if(!focus.length) focus.push({title:"Nenhuma exceção crítica",sub:"Operação dentro do esperado",view:null,kind:"good"});
    main.innerHTML=`<div class="view-header"><div><div class="view-title">Centro de Operações</div><div class="view-sub">Uma visão 360° do ciclo: orçamento → produção → entrega → pagamento.</div></div><button class="btn btn-primary" id="ops-new">+ Nova ordem de produção</button></div>
      <div class="ops-kpis"><div class="ops-kpi"><small>Em produção</small><strong>${active.length}</strong><span>${printed.length} já impressos</span></div><div class="ops-kpi"><small>Próximos 7 dias</small><strong>${due7.length}</strong><span>${overdue.length?overdue.length+" atrasada(s)":"Sem atrasos"}</span></div><div class="ops-kpi"><small>A receber</small><strong>${fmtMoney(revenueOpen)}</strong><span>faturas abertas</span></div><div class="ops-kpi"><small>Capacidade registrada</small><strong>${active.reduce((s,c)=>s+Number(c.horasMaquina||0),0).toFixed(1)} h</strong><span>horas de máquina</span></div></div>
      <div class="ops-toolbar"><input class="grow" type="search" id="ops-search" placeholder="Buscar processo, cliente ou material…" value="${escapeHTML(query)}"><select id="ops-line"><option value="">Todas as linhas</option><option value="Reverso Works" ${line==="Reverso Works"?"selected":""}>Reverso Works</option><option value="Reverso Studio" ${line==="Reverso Studio"?"selected":""}>Reverso Studio</option></select><select id="ops-stage"><option value="">Todas as etapas</option>${PIPELINE_STAGES.map(x=>`<option value="${x.id}" ${stage===x.id?"selected":""}>${x.label}</option>`).join("")}</select></div>
      <div class="ops-grid"><div class="card"><div class="command-section-title"><strong>Projetos em andamento</strong><span>${cards.length} processo(s)</span></div>${cards.length?cards.map(c=>{const p=operationsProgress(c.stage), late=c.forecastDate&&c.forecastDate<today&&c.stage!=="entregue";return `<div class="ops-project"><div class="ops-project-head"><div><div class="ops-project-title">${escapeHTML(c.title||"(sem título)")}</div><div class="ops-project-meta">${escapeHTML(clientName(c.clientId))} · ${escapeHTML(c.businessLine||"—")} · ${escapeHTML(c.material||"Material N/D")}</div></div><span class="badge ${late?'badge-line-works':'badge-platform'}">${escapeHTML(stageLabel(c.stage))}</span></div><div class="ops-progress" style="--progress:${p}%"><i></i></div><div class="ops-stage-row"><small>${p}% do fluxo</small><small class="${late?'danger-text':''}">${c.forecastDate?(late?'Atrasado · ':'Entrega · ')+fmtDate(c.forecastDate):'Sem previsão'}</small></div><div class="ops-actions ops-project-actions"><button class="btn btn-sm btn-primary" data-ops-open="${c.id}">Abrir ciclo</button><button class="btn btn-sm btn-ghost" data-ops-edit="${c.id}">Editar</button></div></div>`}).join(""):`<div class="ops-empty">Nenhum processo corresponde aos filtros.</div>`}</div>
      <div><div class="card"><div class="command-section-title"><strong>Foco agora</strong><span>prioridades</span></div><div class="ops-focus">${focus.slice(0,5).map(f=>`<div class="ops-focus-item ${f.kind==='good'?'good':''}" data-ops-focus="${f.view||''}"><i class="ops-focus-dot"></i><div><strong>${escapeHTML(f.title)}</strong><small>${escapeHTML(f.sub)}</small></div></div>`).join("")}</div></div><div class="card" style="margin-top:16px"><div class="command-section-title"><strong>Atalhos operacionais</strong><span>fluxo</span></div><div class="ops-focus"><div class="ops-focus-item" data-go="pipeline"><i class="ops-focus-dot"></i><div><strong>Funil de produção</strong><small>Mover etapas e acompanhar entregas.</small></div></div><div class="ops-focus-item" data-go="engineering"><i class="ops-focus-dot"></i><div><strong>Engenharia</strong><small>Validar material antes de imprimir.</small></div></div><div class="ops-focus-item" data-go="inventory"><i class="ops-focus-dot"></i><div><strong>Estoque</strong><small>Ver disponibilidade e reposição.</small></div></div></div></div></div></div>`;
    /* O calendário ocupa a área principal ao lado dos projetos; foco e atalhos
       passam para baixo, mantendo os dois blocos no mesmo nível visual. */
    const opsGrid=main.querySelector('.ops-grid');
    if(opsGrid){
      opsGrid.classList.add('ops-layout');
      const legacySide=opsGrid.lastElementChild;
      const bottom=document.createElement('div'); bottom.className='ops-bottom';
      Array.from(legacySide.children).forEach(card=>bottom.append(card));
      legacySide.remove();
      const calendar=document.createElement('div'); calendar.className='card ops-calendar-card';calendar.id='ops-calendar';
      const base=new Date();base.setHours(12,0,0,0); const year=base.getFullYear(),month=base.getMonth();
      const first=new Date(year,month,1);const start=new Date(year,month,1-first.getDay());
      const cells=[];for(let i=0;i<42;i++){const date=new Date(start);date.setDate(start.getDate()+i);const iso=date.toISOString().slice(0,10);const items=state.pipeline.filter(x=>x.forecastDate===iso&&x.stage!=='entregue').slice(0,2);cells.push(`<div class="ops-cal-day ${date.getMonth()!==month?'muted':''} ${iso===today?'today':''}"><strong>${date.getDate()}</strong>${items.map(x=>`<span class="ops-cal-event">${escapeHTML(x.title||'Processo')}</span>`).join('')}</div>`)}
      calendar.innerHTML=`<div class="command-section-title"><strong>${base.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}</strong><span>agenda de produção</span></div><div class="ops-calendar-grid">${['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].map(x=>`<div class="ops-cal-head">${x}</div>`).join('')}${cells.join('')}</div><div class="stat-hint" style="margin-top:12px">Clique para abrir a agenda semanal.</div>`;
      opsGrid.append(calendar);opsGrid.after(bottom);
      calendar.onclick=()=>openOperationsCalendar(today);
    }
    document.getElementById('ops-new').onclick=()=>{editingPipelineCard={data:newPipelineSkeleton(),isNew:true};currentView='pipeline';render();};
    document.getElementById('ops-search').oninput=e=>{query=e.target.value;draw();};
    document.getElementById('ops-line').onchange=e=>{line=e.target.value;draw();};
    document.getElementById('ops-stage').onchange=e=>{stage=e.target.value;draw();};
    main.querySelectorAll('[data-ops-open]').forEach(b=>b.onclick=()=>openOperationsProject(b.dataset.opsOpen));
    main.querySelectorAll('[data-ops-edit]').forEach(b=>b.onclick=()=>{const c=state.pipeline.find(x=>x.id===b.dataset.opsEdit);if(c){editingPipelineCard={data:JSON.parse(JSON.stringify(c)),isNew:false};currentView='pipeline';render();}});
    main.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{currentView=b.dataset.go;render();});
    main.querySelectorAll('[data-ops-focus]').forEach(b=>b.onclick=()=>{if(b.dataset.opsFocus){currentView=b.dataset.opsFocus;render();}});
  }
  draw();
}

function renderPipeline(main){
  let lineFilter = "";
  let search = "";

  function draw(){
    let cards = state.pipeline.slice();
    if(lineFilter) cards = cards.filter(c => c.businessLine === lineFilter);
    if(search) cards = cards.filter(c => (c.title||"").toLowerCase().includes(search.toLowerCase()) || clientName(c.clientId).toLowerCase().includes(search.toLowerCase()));

    main.innerHTML = `
      <div class="view-header">
        <div>
          <div class="view-title">Quadro de produção</div>
          <div class="view-sub">${state.pipeline.length} processo(s) — vinculado a pedidos, peças e documentos</div>
        </div>
        <button class="btn btn-primary" id="new-card">+ Nova ordem de produção</button>
      </div>
      <div class="toolbar">
        <input type="search" id="search-card" placeholder="Buscar por título ou cliente…" value="${escapeHTML(search)}">
        <select id="filter-line">
          <option value="">Todas as linhas</option>
          <option value="Reverso Works" ${lineFilter==="Reverso Works"?"selected":""}>Reverso Works</option>
          <option value="Reverso Studio" ${lineFilter==="Reverso Studio"?"selected":""}>Reverso Studio</option>
        </select>
      </div>
      <div class="kanban-board">
        ${PIPELINE_STAGES.map(stage => {
          const stageCards = cards.filter(c => c.stage === stage.id)
            .sort((a,b)=> (a.forecastDate||"9999").localeCompare(b.forecastDate||"9999"));
          return `
          <div class="kanban-col">
            <div class="kanban-col-header">${stage.label} <span class="kanban-count">${stageCards.length}</span></div>
            <div class="kanban-cards">
              ${stageCards.length===0 ? `<div class="kanban-empty">—</div>` : stageCards.map(c => `
                <div class="kanban-card">
                  <div class="kanban-card-title">${escapeHTML(c.title||"(sem título)")}</div>
                  <div class="kanban-card-meta">${escapeHTML(clientName(c.clientId))}</div>
                  <div class="kanban-card-meta"><span class="badge badge-line-${(c.businessLine||"").toLowerCase().includes("studio")?"studio":"works"}">${escapeHTML(c.businessLine||"—")}</span></div>
                  ${c.estimateId ? `<div class="kanban-card-link">Orç. ${escapeHTML((state.estimates.find(e=>e.id===c.estimateId)||{}).number || "")}</div>` : ""}
                  ${c.invoiceId ? `<div class="kanban-card-link">Fat. ${escapeHTML((state.invoices.find(i=>i.id===c.invoiceId)||{}).number || "")}</div>` : ""}
                  ${c.forecastDate ? `<div class="kanban-card-date ${urgencyClass(c.forecastDate)}">${daysBetween(todayISO(),c.forecastDate)<0 ? "atrasado — " : "previsto — "}${fmtDate(c.forecastDate)}</div>` : ""}
                  <div class="kanban-card-actions">
                    <select class="kanban-stage-select" data-move="${c.id}">
                      ${PIPELINE_STAGES.map(s2=>`<option value="${s2.id}" ${s2.id===c.stage?"selected":""}>${s2.label}</option>`).join("")}
                    </select>
                    <button class="btn btn-sm btn-ghost" data-edit-card="${c.id}">Abrir</button>
                  </div>
                </div>`).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>
    `;
    document.getElementById("new-card").onclick = ()=>{ editingPipelineCard = {data: newPipelineSkeleton(), isNew:true}; render(); };
    document.getElementById("search-card").oninput = e=>{ search=e.target.value; draw(); };
    document.getElementById("filter-line").onchange = e=>{ lineFilter=e.target.value; draw(); };
    const kanban=main.querySelector('.kanban-board');
    if(kanban) kanban.addEventListener('wheel',e=>{if(e.shiftKey){kanban.scrollLeft+=e.deltaY; e.preventDefault();}},{passive:false});
    main.querySelectorAll("[data-edit-card]").forEach(b=> b.onclick = ()=>{
      const c = state.pipeline.find(x=>x.id===b.dataset.editCard);
      editingPipelineCard = {data: JSON.parse(JSON.stringify(c)), isNew:false};
      render();
    });
    main.querySelectorAll("[data-move]").forEach(sel=> sel.onchange = async ()=>{
      const c = state.pipeline.find(x=>x.id===sel.dataset.move);
      if(!c) return;
      Object.assign(c, Model.stageChange(c, sel.value, todayISO()));
      if(hasPrinted(sel.value) && !c.printedAt) c.printedAt = todayISO();
      if(sel.value === "entregue" && !c.completedAt) c.completedAt = todayISO();
      await persist("pipeline", c.id);
      showToast("Etapa atualizada.");
      draw();
    });
    const alerts=[];
    const lowStock=state.inventory.filter(x=>(Number(x.qty)||0)<=(Number(x.reorder)||0));
    if(lowStock.length) alerts.push(`<span class="badge badge-line-works">${lowStock.length} item(ns) de estoque em reposição</span>`);
    const followups=estimatesNeedingFollowUp();
    if(followups.length) alerts.push(`<span class="badge badge-platform">${followups.length} orçamento(s) aguardando follow-up</span>`);
    if(alerts.length){ const a=document.createElement("div"); a.className="kpi-strip"; a.innerHTML=alerts.map(x=>`<div class="kpi-pill">${x}</div>`).join(""); main.querySelector(".view-header")?.after(a); }

  }
  draw();
}

function renderMaintenance(main){
  const info = maintenanceStatus();
  const s = state.settings;
  const contributingCards = state.pipeline
    .filter(c => Number(c.horasMaquina) > 0)
    .filter(c => {
      const ref = c.completedAt || c.forecastDate || c.createdAt;
      if(!s.lastCleaningDate) return true;
      return ref && ref >= s.lastCleaningDate;
    })
    .sort((a,b)=> (b.completedAt||b.forecastDate||b.createdAt||"").localeCompare(a.completedAt||a.forecastDate||a.createdAt||""));

  const dayPct = Math.max(0, Math.min(100, 100 - (info.daysLeft / (Number(s.cleaningIntervalDays)||14) * 100)));
  const hourPct = Math.max(0, Math.min(100, 100 - (info.hoursLeft / (Number(s.cleaningIntervalHours)||150) * 100)));
  const overdueStatus = info.daysLeft<=0 || info.hoursLeft<=0;

  main.innerHTML = `
    <div class="view-header">
      <div>
        <div class="view-title">Manutenção da máquina</div>
        <div class="view-sub">Limpeza da X2D — ventilação/segurança já é pré-requisito no roadmap; a limpeza recorrente evita falhas de impressão</div>
      </div>
      <button class="btn btn-primary" id="log-cleaning">Registrar limpeza hoje</button>
    </div>

    ${overdueStatus ? `<div class="card" style="border-color:rgba(255,69,58,0.35); background:var(--status-danger-bg); margin-bottom:16px;"><strong style="color:var(--status-danger);">Limpeza atrasada</strong> — registre a limpeza assim que possível.</div>` : ""}

    <div class="stat-grid cols-2">
      <div class="stat-card">
        <div class="stat-label">Dias desde a última limpeza</div>
        <div class="stat-value">${info.daysSince===null ? "—" : info.daysSince}</div>
        <div class="stat-hint">Intervalo alvo: ${s.cleaningIntervalDays} dias</div>
        <div class="gauge"><div class="gauge-fill ${info.daysLeft<=0?'danger':(info.daysLeft<=3?'amber':'')}" style="width:${dayPct}%;"></div></div>
        <div class="stat-hint">${info.daysLeft<=0 ? "Atrasada" : info.daysLeft + " dia(s) restante(s)"}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Horas de máquina desde a última limpeza</div>
        <div class="stat-value">${info.hoursSince.toFixed(1)} h</div>
        <div class="stat-hint">Intervalo alvo: ${s.cleaningIntervalHours} h (referência do roadmap: ~150h)</div>
        <div class="gauge"><div class="gauge-fill ${info.hoursLeft<=0?'danger':(info.hoursLeft<=20?'amber':'')}" style="width:${hourPct}%;"></div></div>
        <div class="stat-hint">${info.hoursLeft<=0 ? "Atrasada" : info.hoursLeft.toFixed(1) + " h restante(s)"}</div>
      </div>
    </div>

    <div class="card">
      <div class="section-title" style="margin-top:0;">Configuração</div>
      <div class="form-grid cols-3">

      <table style="margin-top:6px;">

        <tbody>

            <tr>
              <td>${escapeHTML(c.title||"—")}</td>
              <td>${escapeHTML(clientName(c.clientId))}</td>

              <td>${fmtDate(c.completedAt||c.forecastDate||c.createdAt)}</td>
            </tr>`).join("")}
        </tbody>
      </table>`}
    </div>
  `;

  document.getElementById("log-cleaning").onclick = async ()=>{
    s.lastCleaningDate = todayISO();
    await persist("settings");

  };
  document.getElementById("save-maint-settings").onclick = async ()=>{
    s.lastCleaningDate = document.getElementById("m-lastdate").value || null;
    s.cleaningIntervalDays = Number(document.getElementById("m-intervaldays").value) || 14;

function openClientFinancialSummary(clientId){
  const c=state.clients.find(x=>x.id===clientId); if(!c) return;
  const estimates=state.estimates.filter(x=>x.clientId===clientId).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const invoices=state.invoices.filter(x=>x.clientId===clientId).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const rows=(docs,type)=>docs.length?docs.map(d=>`<div class="calc-list-row"><div><div class="li-desc">${escapeHTML(d.number||'Sem número')}</div><div class="li-meta">${fmtDate(d.date||d.createdDate||todayISO())} · ${escapeHTML(statusLabel(type,type==='estimate'?effectiveEstimateStatus(d):d.status))}</div></div><div class="li-price">${fmtMoney(calcDocTotals(d).total)}</div></div>`).join(''):`<div class="stat-hint">Nenhum registro.</div>`;
  modalRoot.innerHTML=`<div class="modal-backdrop" id="client-summary-backdrop"><div class="modal-box"><div class="view-header"><div><div class="view-title" style="font-size:24px">${escapeHTML(c.name)}</div><div class="view-sub">Resumo comercial</div></div><button class="btn btn-ghost" id="client-summary-close">Fechar</button></div><div class="section-title">Orçamentos <span class="hint">${estimates.length}</span></div>${rows(estimates,'estimate')}<div class="section-title">Faturas <span class="hint">${invoices.length}</span></div>${rows(invoices,'invoice')}<div class="modal-actions"><button class="btn btn-primary" id="client-summary-profile">Ver perfil completo</button></div></div></div>`;
  document.getElementById('client-summary-close').onclick=()=>modalRoot.innerHTML='';
  document.getElementById('client-summary-backdrop').onclick=e=>{if(e.target.id==='client-summary-backdrop')modalRoot.innerHTML='';};
  document.getElementById('client-summary-profile').onclick=()=>{modalRoot.innerHTML='';viewingClient=clientId;currentView='clients';render();};
}
function renderClients(main){
  let search = "";
  function draw(){
    const list = state.clients.filter(c => (c.name||"").toLowerCase().includes(search.toLowerCase()));
    main.innerHTML = `
      <div class="view-header">
        <div>
          <div class="view-title">Clientes</div>
          <div class="view-sub">${state.clients.length} cadastrado(s)</div>
        </div>
        <button class="btn btn-primary" id="new-client">+ Novo cliente</button>
      </div>
      <div class="toolbar">
        <input type="search" id="search-client" placeholder="Buscar por nome…" value="${escapeHTML(search)}">
      </div>
      <div class="card" style="padding:0;">
        ${list.length===0 ? `<div class="empty-state"><div class="big">Nenhum cliente ainda</div>Cadastre o primeiro cliente pra começar a orçar.</div>` : `
        <table>
          <thead><tr><th>Nome</th><th>Telefone</th><th>Email</th><th></th><th></th></tr></thead>
          <tbody>
            ${list.map(c => `
              <tr>
                <td><a class="link-strong" data-client-summary="${c.id}">${escapeHTML(c.name)}</a></td>
                <td>${escapeHTML(c.phone||"—")}</td>
                <td>${escapeHTML(c.email||"—")}</td>
                <td>${c.type==="company" ? `<span class="badge badge-line-studio">Empresa</span>` : ""}</td>
                <td class="row-actions">
                  <button class="btn btn-sm btn-ghost" data-view-profile="${c.id}">Ver perfil</button>
                  <button class="btn btn-sm btn-ghost" data-edit="${c.id}">Editar</button>
                  <button class="btn btn-sm btn-danger" data-del="${c.id}">Excluir</button>
                </td>
              </tr>`).join("")}
          </tbody>
        </table>`}
      </div>
    `;
    document.getElementById("new-client").onclick = ()=>{ editingClient = newClientSkeleton(); render(); };
    document.getElementById("search-client").oninput = (e)=>{ search = e.target.value; draw(); };
    main.querySelectorAll("[data-client-summary]").forEach(el=> el.onclick=()=>openClientFinancialSummary(el.dataset.clientSummary));
    main.querySelectorAll("[data-view-profile]").forEach(el=> el.onclick = ()=>{
      viewingClient = el.dataset.viewProfile;
      render();
    });
    main.querySelectorAll("[data-edit]").forEach(b=> b.onclick = ()=>{
      editingClient = normalizeClient(state.clients.find(c=>c.id===b.dataset.edit));
      render();
    });
    main.querySelectorAll("[data-del]").forEach(b=> b.onclick = ()=>{
      if(state.orders.some(o=>o.clientId===b.dataset.del)||state.parts.some(p=>p.clientId===b.dataset.del)){showToast('Cliente vinculado a pedidos ou peças. Preserve o cadastro para manter o histórico.');return;}
      const vinc = state.estimates.filter(d=>d.clientId===b.dataset.del).length
                 + state.invoices.filter(d=>d.clientId===b.dataset.del).length
                 + state.pipeline.filter(d=>d.clientId===b.dataset.del).length;
      const aviso = vinc > 0
        ? `Este cliente tem ${vinc} registro(s) vinculado(s) (orçamentos, faturas ou cards do funil). Eles continuam contando nos relatórios, mas passam a exibir "(cliente removido)".`
        : "Isso não apaga orçamentos/faturas já criados, mas eles perdem a referência ao cliente.";
      confirmModal("Excluir cliente?", aviso, async ()=>{
        state.clients = state.clients.filter(c=>c.id!==b.dataset.del);
        await persist("clients", []);   // [] = só processa remoções
        showToast("Cliente excluído.");
        render();
      });
    });
  }
  draw();
}

        <div class="field"><label>País</label><input id="f-addr-country" value="${escapeHTML(c.address.country)}"></div>
      </div>

      <div class="section-title">Notas</div>
      <div class="form-grid">
        <div class="field full"><textarea id="f-notes">${escapeHTML(c.notes)}</textarea></div>
      </div>

      <div class="modal-actions" style="margin-top:20px;">
        <button class="btn btn-ghost" id="cancel">Cancelar</button>
        <button class="btn btn-primary" id="save">Salvar cliente</button>
      </div>
    </div>
  `;
  attachPhoneMask(document.getElementById("f-phone"));

  let selectedCategories = c.categories.slice();
  main.querySelectorAll("[data-cat]").forEach(btn=>{
    btn.onclick = ()=>{
      const cat = btn.dataset.cat;
      if(selectedCategories.includes(cat)){
        selectedCategories = selectedCategories.filter(x=>x!==cat);
        btn.classList.remove("chip-active");
      } else {
        selectedCategories.push(cat);
        btn.classList.add("chip-active");
      }
    };
  });
  document.getElementById("add-cat-custom").onclick = ()=>{
    const val = document.getElementById("f-cat-custom").value.trim();
    if(!val) return;
    if(!selectedCategories.includes(val)) selectedCategories.push(val);
    const chipBox = document.getElementById("f-categories");
    const chip = document.createElement("button");
    chip.type = "button"; chip.className = "chip chip-active"; chip.dataset.cat = val; chip.textContent = val;
    chip.onclick = ()=>{
      if(selectedCategories.includes(val)){ selectedCategories = selectedCategories.filter(x=>x!==val); chip.classList.remove("chip-active"); }
      else { selectedCategories.push(val); chip.classList.add("chip-active"); }
    };
    chipBox.appendChild(chip);
    document.getElementById("f-cat-custom").value = "";
  };

  document.getElementById("cancel").onclick = ()=>{ editingClient = null; render(); };
  document.getElementById("save").onclick = async ()=>{
    const name = document.getElementById("f-name").value.trim();
    if(!name){ showToast("Nome é obrigatório."); return; }
    const data = {
      id: c.id || uid(),
      name,
      type: document.getElementById("f-type").value,
      email: document.getElementById("f-email").value.trim(),
      phone: formatUSPhone(document.getElementById("f-phone").value),
      categories: selectedCategories,
      address: {
        line1: document.getElementById("f-addr-line1").value.trim(),
        line2: document.getElementById("f-addr-line2").value.trim(),
        city: document.getElementById("f-addr-city").value.trim(),
        state: document.getElementById("f-addr-state").value.trim(),
        zip: document.getElementById("f-addr-zip").value.trim(),
        country: document.getElementById("f-addr-country").value.trim() || "Estados Unidos"
      },
      tracking: c.tracking || [],
      notes: document.getElementById("f-notes").value.trim(),
      createdDate: c.createdDate || todayISO()
    };
    const idx = state.clients.findIndex(x=>x.id===data.id);
    if(idx>=0) state.clients[idx] = data; else state.clients.push(data);
    await persist("clients", data.id);
    editingClient = null;
    showToast("Cliente salvo.");
    render();
  };
}

/* =========================================================
   ESTIMATES / INVOICES
========================================================= */
function collectionFor(type){ return type==="estimate" ? "estimates" : "invoices"; }
function prefixFor(type){ return type==="estimate" ? "EST" : "INV"; }

function renderDocList(main, type){
  const col = collectionFor(type);
  let search = "";
  let statusFilter = "";

  function draw(){
    let list = state[col].slice().sort((a,b)=> (b.date||"").localeCompare(a.date||""));
    if(search) list = list.filter(d => clientName(d.clientId).toLowerCase().includes(search.toLowerCase()) || (d.number||"").toLowerCase().includes(search.toLowerCase()));
    if(statusFilter) list = list.filter(d => (type==="estimate" ? effectiveEstimateStatus(d) : d.status)===statusFilter);

    const statusOptions = type==="estimate"
      ? [["","Todos status"],["sent","Enviado"],["accepted","Aceito"],["expired","Expirado"]]
      : [["","Todos status"],["draft","Rascunho"],["sent","Enviada"],["partial","Parcialmente paga"],["paid","Paga"],["overdue","Atrasada"]];

    main.innerHTML = `
      <div class="view-header">
        <div>
          <div class="view-title">${type==="estimate" ? "Orçamentos" : "Faturas"}</div>
          <div class="view-sub">${state[col].length} no total</div>
        </div>
        <button class="btn btn-primary" id="new-doc">+ ${type==="estimate" ? "Novo orçamento" : "Nova fatura"}</button>
      </div>
      <div class="toolbar">
        <input type="search" id="search-doc" placeholder="Buscar por cliente ou número…" value="${escapeHTML(search)}">
        <select id="filter-status">${statusOptions.map(([v,l])=>`<option value="${v}" ${v===statusFilter?"selected":""}>${l}</option>`).join("")}</select>
      </div>
      <div class="card" style="padding:0;">
        ${list.length===0 ? `<div class="empty-state"><div class="big">Nada aqui ainda</div>Crie o primeiro ${type==="estimate"?"orçamento":"fatura"}.</div>` : `
        <table>
          <thead><tr>
            <th>Número</th><th>Cliente</th><th>Linha</th><th>Data</th>
            <th class="num">Total</th>${type==="invoice" ? '<th class="num">Saldo</th>' : ''}<th>Status</th><th></th>
          </tr></thead>
          <tbody>
            ${list.map(d => {
              const t = calcDocTotals(d);
              return `<tr>
                <td>${escapeHTML(d.number)}</td>
                <td>${escapeHTML(clientName(d.clientId))}</td>
                <td><span class="badge badge-line-${(d.businessLine||"").toLowerCase().includes("studio")?"studio":"works"}">${escapeHTML(d.businessLine||"—")}</span></td>
                <td>${fmtDate(d.date)}</td>
                <td class="num">${fmtMoney(t.total)}</td>
                ${type==="invoice" ? `<td class="num">${fmtMoney(balanceDue(d))}</td>` : ''}
                <td><span class="badge badge-${type==="estimate" ? effectiveEstimateStatus(d) : d.status}">${statusLabel(type, type==="estimate" ? effectiveEstimateStatus(d) : d.status)}</span></td>
                <td class="row-actions">
                  <button class="btn btn-sm btn-ghost" data-open="${d.id}">Abrir</button>
                  <button class="btn btn-sm btn-ghost" data-pipeline="${d.id}">${state.pipeline.some(c => (type==="estimate"?c.estimateId:c.invoiceId)===d.id) ? "Ver produção" : "+ Produção"}</button>
                  <button class="btn btn-sm btn-danger" data-del="${d.id}">Excluir</button>
                </td>
              </tr>`;
            }).join("")}
          </tbody>
        </table>`}
      </div>
    `;
    document.getElementById("new-doc").onclick = ()=> openDocEditor(type, null);
    document.getElementById("search-doc").oninput = e=>{ search=e.target.value; draw(); };
    document.getElementById("filter-status").onchange = e=>{ statusFilter=e.target.value; draw(); };
    main.querySelectorAll("[data-open]").forEach(b=> b.onclick = ()=> openDocEditor(type, state[col].find(x=>x.id===b.dataset.open)));
    main.querySelectorAll("[data-pipeline]").forEach(b=> b.onclick = ()=>{
      const doc = state[col].find(x=>x.id===b.dataset.pipeline);
      const existing = state.pipeline.find(c => (type==="estimate"?c.estimateId:c.invoiceId)===doc.id);
      if(existing){ currentView='pipeline'; editingPipelineCard = {data: JSON.parse(JSON.stringify(existing)), isNew:false}; render(); return; }
      if(type==='estimate'&&doc.status!=='accepted'){openDocEditor(type,doc);showToast('Registre a aprovação para iniciar a produção.');return;}
      const card = newPipelineSkeleton();
      card.clientId = doc.clientId;
      card.businessLine = doc.businessLine;
      card.title = (doc.items && doc.items[0] && doc.items[0].desc) ? doc.items[0].desc : (doc.number + " — " + clientName(doc.clientId));
      if(type==="estimate") card.estimateId = doc.id;
      else card.invoiceId = doc.id;
      card.orderId=doc.orderId||null;
      card.forecastDate=state.orders.find(o=>o.id===doc.orderId)?.deliveryDate||null;
      const rev=state.partRevisions.find(r=>r.id===doc.revisionId);
      if(rev)Object.assign(card,{revisionId:rev.id,partId:rev.partId,revisionSnapshot:Model.clone(rev),engineeringProjectId:rev.engineeringProjectId||null,material:rev.material||''});
      currentView='pipeline';
      editingPipelineCard = {data: card, isNew:true};
      render();
    });
    main.querySelectorAll("[data-del]").forEach(b=> b.onclick = ()=>{
      const target=state[col].find(x=>x.id===b.dataset.del);
      if(target?.orderId||state.pipeline.some(p=>(type==='estimate'?p.estimateId:p.invoiceId)===target?.id)||(! (type==='estimate')&&sumPayments(target)>0)){showToast('Documento vinculado a pedido, produção ou recebimentos. Preserve-o para manter o histórico.');return;}
      confirmModal(`Excluir ${type==="estimate"?"orçamento":"fatura"}?`, "Essa ação não pode ser desfeita.", async ()=>{
        state[col] = state[col].filter(x=>x.id!==b.dataset.del);
        await persist(col, []);
        showToast("Excluído.");
        draw();
      });
    });
  }
  draw();
}

/* Numeração resolvida NO SALVAMENTO, não na abertura do editor.
   Antes o número era fixado ao abrir e o contador só subia ao salvar:
   abrir dois documentos novos gerava duas faturas com o mesmo número,
   e ambas salvavam sem erro. O while() também pula números já usados,
   cobrindo contadores editados à mão em Configurações. */
function nextDocNumber(type){
  const settings = state.settings;
  const prefix = prefixFor(type);
  const col = collectionFor(type);
  const used = new Set(state[col].map(d => d.number));
  let n = Number(type==="estimate" ? settings.nextEstimateNumber : settings.nextInvoiceNumber) || 1;
  while(used.has(prefix + "-" + String(n).padStart(4,"0"))) n++;
  return {number: prefix + "-" + String(n).padStart(4,"0"), next: n + 1};
}

function newDocSkeleton(type){
  const settings = state.settings;
  const number = nextDocNumber(type).number;   // provisório até salvar
  const date = todayISO();
  return {
    id: uid(),
    number,
    /* Nasce sem cliente: "o primeiro da lista" varia conforme a ordenação
       e o documento saía com o cliente errado em silêncio. */
    clientId: null,
    businessLine: settings.defaultLine,
    date,
    validUntil: type==="estimate" ? addDays(date, 15) : null,
    dueDate: type==="invoice" ? addDays(date, 15) : null,
    status: "draft",
    createdAt: todayISO(),
    items: [{desc:"", qty:1, rate:0, taxable:true}],
    applyTax: false,
    taxRate: settings.salesTaxRate,
    notes: type==="estimate" ? settings.estimateNotes : settings.invoiceNotes,
    payments: type==="invoice" ? [] : undefined,
    paidDate: null,
    fromEstimateNumber: null,
    poNumber: "",
    requiresShipping: false,
    shippingAddress: {line1:"", line2:"", city:"", state:"", zip:"", country:"Estados Unidos"},
    materialsUsed: []
  };
}

function openDocEditor(type, doc, forceNew){
  const data = doc ? JSON.parse(JSON.stringify(doc)) : newDocSkeleton(type);
  if(type==="invoice" && !data.payments) data.payments = effectivePayments(data);
  if(!data.items) data.items = [{desc:"", qty:1, rate:0, taxable:true}];
  data.items.forEach(it => { if(it.taxable === undefined) it.taxable = true; });
  // Migração: documentos antigos tinham "shipTo" como texto livre.
  if(data.requiresShipping === undefined){
    data.requiresShipping = !!(data.shipTo && data.shipTo.trim());
  }
  if(!data.shippingAddress || typeof data.shippingAddress !== "object"){
    data.shippingAddress = data.shipTo
      ? {line1: data.shipTo, line2:"", city:"", state:"", zip:"", country:"Estados Unidos"}
      : {line1:"", line2:"", city:"", state:"", zip:"", country:"Estados Unidos"};
  }
  currentView=type==="estimate"?"estimates":"invoices";
  editingDoc = {type, data, isNew: forceNew === true ? true : !doc};
  render();
}

        ${rows.map(({it,idx})=>`
          <div class="material-row-grid" data-print-idx="${idx}">
            <div class="field"><label>${escapeHTML(it.desc||"Impressão")} — material</label>
              <select class="ph-material">
                <option value="">— selecione —</option>
                ${MATERIALS_CATALOG.map(m=>`<option value="${m.id}" ${it.materialId===m.id?"selected":""}>${escapeHTML(m.name)} (${fmtMoney(materialPriceG(m))}/g)</option>`).join("")}
              </select>
            </div>
            <div class="field"><label>Gramas</label><input type="number" inputmode="decimal" class="ph-grams" value="${it.grams||""}" placeholder="0"></div>
            <div class="field"><label>Custo do material ($/peça)</label><input class="ph-cost" value="${fmtMoney(materialPriceG(materialById(it.materialId))*(Number(it.grams)||0))}" disabled></div>
            <button class="btn btn-sm btn-ghost ph-apply" type="button">Aplicar à linha</button>
          </div>
        `).join("")}
      </div>
    `;
    host.querySelectorAll("[data-print-idx]").forEach(row=>{
      const idx = Number(row.dataset.printIdx);
      const matSel = row.querySelector(".ph-material");
      const gramsInp = row.querySelector(".ph-grams");
      const costInp = row.querySelector(".ph-cost");
      const applyBtn = row.querySelector(".ph-apply");
      const recalc = ()=>{
        data.items[idx].materialId = matSel.value || null;
        data.items[idx].grams = Number(gramsInp.value)||0;
        const cost = materialPriceG(materialById(data.items[idx].materialId)) * (Number(gramsInp.value)||0);
        costInp.value = fmtMoney(cost);
        return cost;
      };
      matSel.onchange = recalc;
      gramsInp.oninput = recalc;
      applyBtn.onclick = ()=>{
        const cost = recalc();
        data.items[idx].rate = cost;
        renderItemsBody();
        updateTotals();
        showToast("Preço unitário aplicado à linha de Impressão.");
      };
    });
  }

  function updateTotals(){
    data.applyTax = document.getElementById("f-applytax").checked;
    data.taxRate = Number(document.getElementById("f-taxrate").value)/100;
    const t = calcDocTotals(data);
    document.getElementById("t-subtotal").textContent = fmtMoney(t.subtotal);
    document.getElementById("t-taxable-base").textContent = fmtMoney(t.taxableBase);
    const overRow = document.getElementById("t-over-row");
    if(overRow){
      /* balanceDue trunca em zero; sem esta linha um pagamento a maior
         ficava completamente invisível. */
      const over = typeof sumPaymentsLocal === "function" ? Math.max(0, sumPaymentsLocal() - t.total) : 0;
      overRow.style.display = over > 0.005 ? "" : "none";
      if(over > 0.005) document.getElementById("t-over").textContent = fmtMoney(over);
    }
    document.getElementById("t-tax").textContent = fmtMoney(t.taxAmount);
    document.getElementById("t-total").textContent = fmtMoney(t.total);
    document.querySelectorAll("#items-body tr").forEach((tr,i)=>{
      const it = data.items[i];
      tr.querySelector(".amount-cell").textContent = fmtMoney(lineAmount(it));
      const hmmEl = tr.querySelector(".li-meta");
      if(hmmEl) hmmEl.textContent = hmmLabel(it.qty);
    });
    if(!isEstimate) updatePaymentTotals(t.total);
  }

  function updatePaymentTotals(total){
    const paid = sumPaymentsLocal();
    const bal = Math.max(0, total - paid);
    document.getElementById("t-paid").textContent = fmtMoney(paid);
    document.getElementById("t-balance").textContent = fmtMoney(bal);
  }

  function sumPaymentsLocal(){
    return (data.payments||[]).reduce((s,p)=> s+(Number(p.amount)||0), 0);
  }

  function renderPaymentsTable(){
    const tbl = document.getElementById("payments-table");
    const rows = data.payments || [];
    tbl.innerHTML = rows.length===0 ? `<tbody><tr><td style="color:var(--color-platinum); padding:8px 0;">Nenhum pagamento registrado ainda.</td></tr></tbody>` : `
      <thead><tr><th>Data</th><th>Nota</th><th class="num">Valor</th><th></th></tr></thead>
      <tbody>
        ${rows.map((p,i)=>`
          <tr>
            <td>${fmtDate(p.date)}</td>
            <td>${escapeHTML(p.note||"—")}</td>
            <td class="num">${fmtMoney(p.amount)}</td>
            <td class="row-actions">${p.id==="legacy" ? "" : `<button class="remove-line" data-rm-payment="${i}">&times;</button>`}</td>
          </tr>`).join("")}
      </tbody>`;
    tbl.querySelectorAll("[data-rm-payment]").forEach(btn=> btn.onclick = ()=>{
      data.payments.splice(Number(btn.dataset.rmPayment),1);
      renderPaymentsTable();
      syncStatusFromPayments();
      updateTotals();
    });
  }

  function syncStatusFromPayments(){
    const t = calcDocTotals(data);
    const paid = sumPaymentsLocal();
    const statusSel = document.getElementById("f-status");
    if(!statusSel) return;
    if(statusSel.value !== "paid" && statusSel.value !== "partial"){
      statusBeforePayments = statusSel.value;
    }
    if(paid <= 0){
      /* Removendo todos os pagamentos, a fatura precisa voltar a um estado
         não-pago. Antes ficava travada em "Paga" e sumia do contas-a-receber
         com saldo em aberto. */
      if(statusSel.value === "paid" || statusSel.value === "partial"){
        /* Volta ao status que a fatura tinha antes de qualquer pagamento;
           se ela já foi salva, "enviada" é o estado correto, não "rascunho". */
        statusSel.value = (statusBeforePayments && statusBeforePayments !== "paid" && statusBeforePayments !== "partial")
          ? statusBeforePayments
          : (isNew ? "draft" : "sent");
      }
      return;
    }
    statusSel.value = paid >= t.total - 0.005 ? "paid" : "partial";
  }

  /* ---- Cliente: busca com autocomplete + criação rápida via popup ---- */
  function renderClientDropdownLogic(){
    const input = document.getElementById("f-client-search");
    const dropdown = document.getElementById("client-dropdown");

    function selectClient(client){
      data.clientId = client.id;
      input.value = client.name;
      dropdown.style.display = "none";
      document.getElementById("client-type-badge").innerHTML = clientTypeBadgeHTML(client);
      const shipBtn = document.getElementById("copy-client-address");
      if(shipBtn) shipBtn.dataset.clientId = client.id;
      updateTotals();
    }

    function openDropdown(query){
      const q = query.trim().toLowerCase();
      const matches = q ? state.clients.filter(c=>c.name.toLowerCase().includes(q)) : state.clients.slice(0,8);
      let html = matches.slice(0,8).map(c=>`<div class="client-dropdown-item" data-id="${c.id}">${escapeHTML(c.name)}${c.type==="company"?' <span class="stat-hint">· empresa</span>':''}</div>`).join("");
      html += `<div class="client-dropdown-item client-dropdown-new" data-new="1">+ Criar cliente${q?` "${escapeHTML(query.trim())}"`:""}</div>`;
      dropdown.innerHTML = html;
      dropdown.style.display = "block";
      dropdown.querySelectorAll("[data-id]").forEach(el=> el.onclick = ()=> selectClient(state.clients.find(c=>c.id===el.dataset.id)));
      const newBtn = dropdown.querySelector("[data-new]");
      if(newBtn) newBtn.onclick = ()=>{
        dropdown.style.display = "none";
        openClientQuickCreateModal(query.trim(), (client)=> selectClient(client));
      };
    }

    input.addEventListener("focus", ()=> openDropdown(input.value));
    input.addEventListener("input", ()=> openDropdown(input.value));
    document.addEventListener("click", (e)=>{
      if(!dropdown.contains(e.target) && e.target!==input) dropdown.style.display = "none";
    });
  }

  /* ---- Envio ---- */
  const shipCheckbox = document.getElementById("f-requireshipping");
  const shipFieldsBox = document.getElementById("shipping-fields");
  shipCheckbox.onchange = ()=>{ shipFieldsBox.style.display = shipCheckbox.checked ? "block" : "none"; };
  const copyAddrBtn = document.getElementById("copy-client-address");
  if(copyAddrBtn) copyAddrBtn.onclick = ()=>{
    const client = clientById(data.clientId);
    if(!client){ showToast("Selecione um cliente primeiro."); return; }
    const addr = normalizeClient(client).address;
    document.getElementById("ship-line1").value = addr.line1;
    document.getElementById("ship-line2").value = addr.line2;
    document.getElementById("ship-city").value = addr.city;
    document.getElementById("ship-state").value = addr.state;
    document.getElementById("ship-zip").value = addr.zip;
    document.getElementById("ship-country").value = addr.country;
  };

  document.getElementById("add-item").onclick = ()=>{
    data.items.push({desc:"", qty:1, rate:0, taxable:true, catalogId:null});
    renderItemsBody();
    updateTotals();
  };
  document.getElementById("f-applytax").onchange = updateTotals;
  document.getElementById("f-taxrate").oninput = updateTotals;
  document.getElementById("back").onclick = ()=>{ editingDoc = null; render(); };
  document.getElementById("print-doc").onclick = ()=>{ commitFormToData(); printDoc(type, data); };

  function commitFormToData(){
    data.businessLine = document.getElementById("f-line").value;
    if(!isEstimate){
      data.status = document.getElementById("f-status").value;
    }
    data.date = document.getElementById("f-date").value;
    const due = document.getElementById("f-duedate").value;
    if(isEstimate) data.validUntil = due; else data.dueDate = due;
    const numInput = document.getElementById("f-number").value.trim();
    if(numInput && numInput !== data.number) manualNumberTouched = true;
    data.number = numInput || data.number;
    data.poNumber = document.getElementById("f-po").value.trim();
    data.requiresShipping = document.getElementById("f-requireshipping").checked;
    data.shippingAddress = {
      line1: document.getElementById("ship-line1").value.trim(),
      line2: document.getElementById("ship-line2").value.trim(),
      city: document.getElementById("ship-city").value.trim(),
      state: document.getElementById("ship-state").value.trim(),
      zip: document.getElementById("ship-zip").value.trim(),
      country: document.getElementById("ship-country").value.trim() || "Estados Unidos"
    };
    data.notes = document.getElementById("f-notes").value;
    data.applyTax = document.getElementById("f-applytax").checked;
    data.taxRate = Number(document.getElementById("f-taxrate").value)/100;
  }

  if(!isEstimate){
    document.getElementById("add-payment").onclick = ()=>{
      const amount = Number(document.getElementById("p-amount").value);
      const date = document.getElementById("p-date").value || todayISO();
      if(!amount || amount<=0){ showToast("Informe um valor de pagamento maior que zero."); return; }
      if(!data.payments) data.payments = [];
      data.payments.push({id: uid(), date, amount, note: document.getElementById("p-note").value.trim()});
      document.getElementById("p-amount").value = "";
      document.getElementById("p-note").value = "";
      renderPaymentsTable();
      syncStatusFromPayments();
      updateTotals();
      showToast("Pagamento registrado.");
    };
    document.getElementById("pay-balance").onclick = ()=>{
      const t = calcDocTotals(data);
      const bal = Math.max(0, t.total - sumPaymentsLocal());
      if(bal<=0){ showToast("Não há saldo pendente."); return; }
      if(!data.payments) data.payments = [];
      data.payments.push({id: uid(), date: todayISO(), amount: bal, note:"Saldo final"});
      renderPaymentsTable();
      syncStatusFromPayments();
      updateTotals();
      showToast("Saldo registrado como pago.");
    };
  } else {
    async function doConvertToInvoice(){
      if(data.status!=='accepted'){showToast('Registre a aprovação antes de gerar a fatura.');return;}
      if(!(await saveDocument(false)))return;
      const existing=state.invoices.find(i=>i.fromEstimateId===data.id||(!i.fromEstimateId&&i.fromEstimateNumber===data.number));
      if(existing){openDocEditor('invoice',existing);return;}
      const invSkeleton=newDocSkeleton('invoice');
      ['clientId','businessLine','items','applyTax','taxRate','requiresShipping','shippingAddress','materialsUsed','poNumber','orderId','revisionId'].forEach(k=>{if(data[k]!==undefined)invSkeleton[k]=Model.clone(data[k]);});
      invSkeleton.fromEstimateId=data.id;invSkeleton.fromEstimateNumber=data.number;
      if(data.notes&&data.notes!==state.settings.estimateNotes)invSkeleton.notes=data.notes;
      openDocEditor('invoice',invSkeleton,true);
      showToast('Revise e salve a fatura.');
    }
    const convBtn = document.getElementById("convert-invoice");
    if(convBtn && !isNew) convBtn.onclick = doConvertToInvoice;
    const convBtnTop = document.getElementById("convert-invoice-top");
    if(convBtnTop && !isNew) convBtnTop.onclick = doConvertToInvoice;
  }

  async function saveDocument(close=true, targetStatus=null){
    commitFormToData();
    data.orderId=document.getElementById('doc-order')?.value||null;
    data.revisionId=document.getElementById('doc-revision')?.value||null;
    if(!data.clientId){showToast('Selecione um cliente.');return false;}
    const linkedOrder=state.orders.find(o=>o.id===data.orderId);
    if(linkedOrder&&linkedOrder.businessLine!==data.businessLine){showToast('A linha de negócio deve ser a mesma do pedido.');return false;}
    if(linkedOrder&&linkedOrder.clientId!==data.clientId){showToast('O cliente deve ser o mesmo do pedido.');return false;}
    if(isEstimate&&data.status==='accepted'&&targetStatus){showToast('Este orçamento já foi aprovado.');return false;}
    data.items=data.items.filter(it=>(it.desc&&it.desc.trim())||Number(it.rate)>0);
    if(!data.items.length){showToast('Adicione pelo menos um item.');return false;}
    if(state[col].some(d=>d.id!==data.id&&d.number===data.number)){showToast('Número já utilizado.');return false;}
    const record=Model.clone(data);
    const records=[];
    if(editingDoc.isNew){
      const assigned=nextDocNumber(type);
      if(!manualNumberTouched)record.number=assigned.number;
      if(state[col].some(d=>d.id!==record.id&&d.number===record.number)){showToast('Número já utilizado.');return false;}
      records.push(['settings',{...state.settings,[isEstimate?'nextEstimateNumber':'nextInvoiceNumber']:assigned.next}]);
    }
    if(targetStatus==='sent'){record.status='sent';record.sentDate=record.sentDate||todayISO();}
    if(targetStatus==='accepted'||(isEstimate&&record.status==='accepted'&&!record.orderId)){
      let plan;try{plan=Model.approval(state,record,uid,todayISO());}catch(e){showToast(e.message);return false;}
      Object.assign(record,plan.estimate);records.push(['orders',plan.order]);if(plan.production)records.push(['pipeline',plan.production]);
    }
    records.push([col,record]);
    if(!isEstimate&&record.fromEstimateId&&state.invoices.some(i=>i.id!==record.id&&i.fromEstimateId===record.fromEstimateId)){showToast('Este orçamento já possui uma fatura. Abra a fatura existente.');return false;}
    if(!isEstimate&&record.orderId&&state.marketplaceSales.some(s=>s.projectId===record.orderId)){showToast('Este pedido já tem receita registrada no Marketplace. Preserve uma única origem de receita.');return false;}
    if(!isEstimate&&record.orderId){
      state.pipeline.filter(c=>c.orderId===record.orderId&&!c.invoiceId).forEach(c=>records.push(['pipeline',{...c,invoiceId:record.id}]));
    }
    if(!(await commitRecords(records)))return false;
    Object.assign(data,record);editingDoc.isNew=false;
    showToast(targetStatus==='accepted'?'Aprovação registrada. Pedido e produção disponíveis.':'Documento salvo.');
    if(close){editingDoc=null;if(record.orderId){activeOrderId=record.orderId;currentView='orders';}render();}
    return true;
  }
  document.getElementById('save-doc').onclick=()=>saveDocument();
  const context=document.createElement('div');context.className='wf-context';
  context.innerHTML=`<label>Pedido <select id="doc-order"><option value="">Sem vínculo — criado na aprovação</option>${state.orders.map(o=>`<option value="${o.id}" ${data.orderId===o.id?'selected':''}>${escapeHTML(o.number+' · '+o.title)}</option>`).join('')}</select></label><label>Peça / revisão <select id="doc-revision"><option value="">Selecionar depois</option>${revisionOptions(data.revisionId)}</select></label>`;
  main.querySelector('.view-header').after(context);
  if(isEstimate){
    const actions=main.querySelector('.view-header').lastElementChild;
    for(const [status,label] of [['sent','Marcar como enviado'],['accepted','Registrar aprovação']]){
      if(data.status==='accepted'||(status==='sent'&&data.status==='sent'))continue;
      const button=document.createElement('button');button.className='btn btn-ghost';button.textContent=label;button.onclick=()=>saveDocument(true,status);actions.append(button);
    }
    main.querySelectorAll('#convert-invoice,#convert-invoice-top').forEach(b=>{b.disabled=data.status!=='accepted';b.textContent='Gerar fatura';});
  }
  const receipt=main.querySelector('#print-receipt');if(receipt)receipt.onclick=()=>printPaymentReceipt(data);
  if(isEstimate&&data.status==='accepted'){
    main.querySelectorAll('input,select,textarea').forEach(el=>el.disabled=true);
    main.querySelectorAll('[data-remove],#add-item,#save-doc,#copy-client-address').forEach(el=>el.disabled=true);
    const note=document.createElement('p');note.className='wf-note';note.textContent='Orçamento aprovado: condições preservadas. Para alterar valores, crie um novo orçamento no pedido.';context.after(note);
  }


}

   PRINT

const LOGO_DATA_URI = "assets/reverso-works-logo-512.png";

function initials(name){
  const parts = (name||"").trim().split(/\s+/).filter(Boolean);
  if(parts.length===0) return "RG";
  return parts.slice(0,2).map(w=>w[0]).join("").toUpperCase();
}

function printDoc(type, data){
  const s = state.settings;
  const t = calcDocTotals(data);
  const client = state.clients.find(c=>c.id===data.clientId) || {name:"—"};
  const isEstimate = type==="estimate";
  const displayStatus = isEstimate ? effectiveEstimateStatus(data) : data.status;
  const statusColors = {
    draft:["#EEF0F3","#5b6472"], sent:["#E4EEF6","#2C6E9E"], paid:["#E7F5EC","#1E7A46"],
    partial:["#FDF3DC","#8A5A00"],
    overdue:["#FBEAE9","#B3261E"], accepted:["#E7F5EC","#1E7A46"], expired:["#FBEAE9","#B3261E"]
  };
  const sc = statusColors[displayStatus] || statusColors.draft;
  const paid = isEstimate ? 0 : sumPayments(data);
  const balance = isEstimate ? 0 : Math.max(0, t.total - paid);
  const docWord = isEstimate ? "Orçamento" : "Fatura";

  const metaRows = [
    ["Documento", docWord.toUpperCase() + " · " + escapeHTML(data.number)],
    ["Data", fmtDate(data.date)],
  ];
  if(data.poNumber) metaRows.push(["P.O. / Ref.", escapeHTML(data.poNumber)]);
  metaRows.push([isEstimate ? "Válido até" : "Vencimento", fmtDate(isEstimate ? data.validUntil : data.dueDate)]);

  const effectiveShipAddr = (data.shippingAddress && formatAddressLines(data.shippingAddress).length)
    ? data.shippingAddress
    : client.address;

  const html = `
    <div class="doc-page">
      <div class="doc-header-v2">
        <div class="doc-brand-block">
          <img class="doc-logo-img" src="${LOGO_DATA_URI}" alt="Reverso Works" width="96" height="96">
          <div class="doc-brandname">${escapeHTML(s.businessName)}</div>
          <div class="doc-company-block">
            ${escapeHTML(s.address||"").replace(/\n/g,"<br>")}${s.address ? "<br>" : ""}
            ${s.phone ? "Tel: "+escapeHTML(s.phone) : ""}${s.phone && s.email ? " · " : ""}${s.email ? "Email: "+escapeHTML(s.email) : ""}
            ${s.ein ? "<br>EIN: "+escapeHTML(s.ein) : ""}
          </div>
        </div>
        <div class="doc-type-block">
          <div class="doc-title-tag">${docWord.toUpperCase()}</div>
          <div class="doc-status-stamp" style="background:${sc[0]}; color:${sc[1]};">${statusLabel(type,displayStatus)}</div>
          ${data.businessLine ? `<div class="stat-hint" style="margin-top:6px;">${escapeHTML(data.businessLine)}</div>` : ""}
        </div>
      </div>

      <div class="doc-meta-row">
        <div class="doc-meta-col">
          <div class="label">Cobrar de</div>
          <div class="content">
            <strong>${escapeHTML(client.name)}</strong>${client.type==="company" ? ' <span style="font-size:10.5px; color:#8991A0;">(Empresa)</span>' : ""}<br>
            ${formatAddressHTML(client.address)}${formatAddressLines(client.address).length ? "<br>" : ""}
            ${escapeHTML(client.email||"")}${client.phone ? " · "+escapeHTML(client.phone) : ""}
          </div>
        </div>
        ${data.requiresShipping ? `
        <div class="doc-meta-col">
          <div class="label">Enviar para</div>
          <div class="content">${formatAddressHTML(effectiveShipAddr) || "<span style='color:#B3261E;'>Endereço de envio não informado</span>"}</div>
        </div>` : ""}
        <div class="doc-meta-col" style="flex:0 0 auto;">
          <table class="doc-meta-table">
            ${metaRows.map(([k,v])=>`<tr><td class="k">${k}</td><td class="v">${v}</td></tr>`).join("")}
          </table>
        </div>
      </div>

      <table class="doc-items-v2">
        <thead><tr>
          <th style="width:10%">Qtd.</th>
          <th style="width:48%">Descrição</th>
          <th class="num" style="width:20%">Preço unit.</th>
          <th class="num" style="width:22%">Total</th>
        </tr></thead>
        <tbody>
          ${data.items.map(it=>{
            const cat = it.catalogId ? state.catalog.find(c=>c.id===it.catalogId) : null;
            const isHours = cat && (cat.pricingMode==="hours" || cat.pricingMode==="hours_material");
            return `
            <tr>
              <td>${isHours ? hmmLabel(it.qty) : it.qty}</td>
              <td>${escapeHTML(it.desc)}</td>
              <td class="num">${fmtMoney(it.rate)}</td>
              <td class="num">${fmtMoney(lineAmount(it))}</td>
            </tr>`;}).join("")}
        </tbody>
      </table>

      <div class="doc-totals">
        <div class="row"><span>Subtotal</span><span>${fmtMoney(t.subtotal)}</span></div>
        ${data.applyTax ? `<div class="row"><span>Imposto sobre vendas ${(data.taxRate*100).toFixed(2)}%</span><span>${fmtMoney(t.taxAmount)}</span></div>` : ""}
        <div class="row grand"><span>TOTAL</span><span>${fmtMoney(t.total)}</span></div>
        ${!isEstimate && paid>0 ? `
        <div class="row"><span>Pago</span><span>${fmtMoney(paid)}</span></div>
        <div class="row balance"><span>Saldo devedor</span><span>${fmtMoney(balance)}</span></div>` : ""}
      </div>

      ${data.fromEstimateNumber ? `<div style="font-size:11.5px; color:#8991A0; margin-top:6px;">Gerado do orçamento ${escapeHTML(data.fromEstimateNumber)}</div>` : ""}

      ${s.ownerName ? `
      <div style="margin-top:36px;">
        <div class="doc-sig-script">${escapeHTML(s.ownerName)}</div>
        <div style="border-top:1px solid var(--color-smoke); width:210px; margin-top:2px; padding-top:4px; font-size:10.5px; color:#8991A0;">
          ${escapeHTML(s.ownerName)}${s.businessName ? " — "+escapeHTML(s.businessName) : ""}
        </div>
      </div>` : ""}
      ${isEstimate ? `<div class="doc-sign"><div class="line">Aceito por (assinatura do cliente)</div><div class="line">Data</div></div>` : ""}

      <div class="doc-thankyou">Obrigado!</div>

      ${data.notes ? `
      <div class="doc-terms">
        <div class="bar"></div>
        <div class="content">
          <div class="heading">${isEstimate ? "Condições" : "Termos e condições"}</div>
          ${escapeHTML(data.notes).replace(/\n/g,"<br>")}
        </div>
      </div>` : ""}

      ${(data.materialsUsed||[]).length ? `
      <div class="doc-terms" style="margin-top:14px;">
        <div class="bar"></div>
        <div class="content">
          <div class="heading">Materiais utilizados</div>
          ${(data.materialsUsed||[]).map(materialById).filter(Boolean).map(m => `

/* Líquido real do vendedor.
   Antes era só bruto − taxas: o frete pago do próprio bolso não entrava e
   o imposto recolhido pela plataforma (marketplace facilitator) era contado
   como receita. Ambos inflavam o "líquido" de toda venda com frete embutido. */
function netSale(sale){
  return (Number(sale.grossAmount)||0)
       - (Number(sale.feesAmount)||0)
       - (Number(sale.shippingPaid)||0)
       - (Number(sale.taxCollectedByPlatform)||0);
}
/* Margem real da venda contra a meta da Calculadora Studio. */
function saleMargin(sale){
  const net = netSale(sale);
  const cogs = Number(sale.cogs)||0;
  return {lucro: net - cogs, margem: net > 0 ? (net - cogs)/net : 0};
}

/* =========================================================

========================================================= */
function renderTax(main){
  const years = new Set([Number(todayISO().slice(0,4))]);
  /* Pagamento de jan/2027 referente a fatura de dez/2026 precisa criar 2027. */
  allPaymentsFlat().forEach(p=> p.date && years.add(Number(String(p.date).slice(0,4))));
  state.invoices.forEach(i=> i.date && years.add(Number(i.date.slice(0,4))));
  state.expenses.forEach(e=> e.date && years.add(Number(e.date.slice(0,4))));
  state.marketplaceSales.forEach(s=> s.date && years.add(Number(s.date.slice(0,4))));
  const yearList = Array.from(years).sort((a,b)=>b-a);

  let year = yearList[0];
  let quarter = "all";

  function draw(){
    const qRanges = {
      all: [`${year}-01-01`, `${year}-12-31`],
      1:[`${year}-01-01`,`${year}-03-31`], 2:[`${year}-04-01`,`${year}-06-30`],
      3:[`${year}-07-01`,`${year}-09-30`], 4:[`${year}-10-01`,`${year}-12-31`]
    };
    const [start,end] = qRanges[quarter];

    const periodPayments = allPaymentsFlat().filter(p => p.date>=start && p.date<=end);
    const paySplit = splitPayments(periodPayments);
    const invoiceIncome = paySplit.receita;        // sem sales tax
    const salesTaxCollected = paySplit.imposto;    // passivo CDTFA

    const marketplaceIncome = state.marketplaceSales
      .filter(sale => sale.date>=start && sale.date<=end)
      .reduce((s,sale)=> s+netSale(sale), 0);

    const income = invoiceIncome + marketplaceIncome;

    /* Despesas marcadas como não dedutíveis ficam de fora do Schedule C. */
    const exps = state.expenses.filter(e=> e.date>=start && e.date<=end && e.deductible !== false);
    const expenseTotal = exps.reduce((s,e)=> s+(Number(e.amount)||0),0);
    const byCategoryMap = {};
    exps.forEach(e=>{ byCategoryMap[e.category] = (byCategoryMap[e.category]||0) + (Number(e.amount)||0); });
    const byCategory = Object.entries(byCategoryMap).sort((a,b)=>b[1]-a[1]);
    const net = income - expenseTotal;
    /* IRS: SE tax incide sobre 92,35% do lucro líquido, e só a partir de
       $400 de base. A versão anterior aplicava 15,3% sobre 100%. */
    const seBase = net > 0 ? net * 0.9235 : 0;
    const seTax  = seBase >= 400 ? seBase * 0.153 : 0;
    const periodLabel = quarter==="all" ? `Ano ${year}` : `${year} — T${quarter}`;

    main.innerHTML = `
      <div class="view-header">
        <div>
          <div class="view-title">Relatório Fiscal</div>
          <div class="view-sub">Organização simples pra Schedule C — não substitui contador.</div>
        </div>
        <button class="btn btn-ghost" id="print-report">Imprimir / PDF</button>
      </div>
      <div class="toolbar">
        <select id="f-year">${yearList.map(y=>`<option value="${y}" ${y===year?"selected":""}>${y}</option>`).join("")}</select>
        <select id="f-quarter">
          <option value="all" ${quarter==="all"?"selected":""}>Ano todo</option>
          <option value="1" ${quarter==="1"?"selected":""}>1º trimestre</option>
          <option value="2" ${quarter==="2"?"selected":""}>2º trimestre</option>
          <option value="3" ${quarter==="3"?"selected":""}>3º trimestre</option>
          <option value="4" ${quarter==="4"?"selected":""}>4º trimestre</option>
        </select>
      </div>

      <div class="stat-grid">
        <div class="stat-card">
          <div class="stat-label">Receita bruta</div>
          <div class="stat-value" style="color:var(--status-good)">${fmtMoney(income)}</div>
          <div class="stat-hint">Faturas: ${fmtMoney(invoiceIncome)} · Marketplace: ${fmtMoney(marketplaceIncome)}</div>
        </div>
        <div class="stat-card"><div class="stat-label">Despesas dedutíveis</div><div class="stat-value amber">${fmtMoney(expenseTotal)}</div></div>
        <div class="stat-card"><div class="stat-label">Lucro líquido</div><div class="stat-value ${net<0?'danger':''}">${fmtMoney(net)}</div></div>
        <div class="stat-card">
          <div class="stat-label">Imposto sobre vendas retido</div>
          <div class="stat-value blueprint">${fmtMoney(salesTaxCollected)}</div>
          <div class="stat-hint">A recolher à CDTFA — não é receita</div>
        </div>
      </div>

      <div class="card">
        <strong>Despesas por categoria</strong>
        ${byCategory.length===0 ? `<div class="empty-state">Sem despesas no período.</div>` : `
        <table style="margin-top:10px;">
          <thead><tr><th>Categoria</th><th class="num">Total</th></tr></thead>
          <tbody>${byCategory.map(([cat,val])=>`<tr><td>${escapeHTML(cat)}</td><td class="num">${fmtMoney(val)}</td></tr>`).join("")}</tbody>
        </table>`}
      </div>

      <div class="note-banner">
        <strong>Lembretes (Schedule C + Schedule SE):</strong> self-employment tax de 15,3% sobre 92,35% do lucro líquido
        (base: ${fmtMoney(seBase)} · estimado aqui: ${fmtMoney(seTax)}${seBase>0 && seBase<400 ? " — abaixo do piso de $400" : ""}) ·
        estimated taxes trimestrais recomendados acima de ~$1.000/ano de lucro projetado ·
        vendas via marketplace já recolhem imposto automaticamente (AB 147), vendas diretas são responsabilidade própria ·
        receita de marketplace já está líquida de taxas da plataforma.
        Isto é organizacional — confirme os números com seu contador antes de declarar.
      </div>
    `;
    const taxTools = document.createElement("div");
    taxTools.innerHTML = renderTaxTools(main, year);
    main.appendChild(taxTools);
    const atp=document.getElementById("add-tax-payment"); if(atp) atp.onclick=()=>openTaxPaymentModal();
    const an=document.getElementById("add-1099"); if(an) an.onclick=()=>open1099Modal();
    const eh=document.getElementById("edit-home-office"); if(eh) eh.onclick=()=>{ currentView="settings"; render(); setTimeout(()=>{ const b=document.querySelector('[data-tab="calculo"]'); if(b) b.click(); },0); };
    document.getElementById("f-year").onchange = e=>{ year=Number(e.target.value); draw(); };
    document.getElementById("f-quarter").onchange = e=>{ quarter=e.target.value; draw(); };
    document.getElementById("print-report").onclick = ()=> printTaxReport({periodLabel, income, invoiceIncome, marketplaceIncome, expenseTotal, net, byCategory, salesTaxCollected, seBase, seTax});
  }
  draw();
}

function mileageRateForDate(date){
  const y=String(date||todayISO()).slice(0,4);
  if(y!=='2026') return Number((state.settings.mileageRates||{})[y]||0);
  return (String(date||todayISO()) < '2026-07-01') ? 0.725 : 0.76;
}

  let year=Number(todayISO().slice(0,4));

    const rows=state.mileageLogs.filter(x=>String(x.date||'').startsWith(String(year))).sort((a,b)=>(b.date||'').localeCompare(a.date||''));

/* =========================================================
   TAX PAYMENTS + 1099 RECONCILIATION + HOME OFFICE
========================================================= */
function taxYearTotals(year){
  const start=`${year}-01-01`,end=`${year}-12-31`;
  const income=allPaymentsFlat().filter(p=>p.date>=start&&p.date<=end).reduce((s,p)=>s+(Number(p.amount)||0)-((Number(p.salesTax)||0)),0)+state.marketplaceSales.filter(x=>x.date>=start&&x.date<=end).reduce((s,x)=>s+netSale(x),0);
  const expenses=state.expenses.filter(x=>x.date>=start&&x.date<=end&&x.deductible!==false).reduce((s,x)=>s+(Number(x.amount)||0),0);
  const mileage=state.mileageLogs.filter(x=>x.date>=start&&x.date<=end).reduce((s,x)=>s+(Number(x.amount)||0),0);
  const office=(state.settings.homeOfficeMethod==='simplified'?Math.min(Number(state.settings.homeOfficeSqFt)||0,300)*5:(Number(state.settings.homeOfficeSqFt)||0)*(Number(state.settings.homeOfficeUsePercent)||0)/100);return {income,expenses,mileage,office,profit:income-expenses-mileage-office};
}
function renderTaxTools(main,year){
  const t=taxYearTotals(year), paid=state.taxPayments.filter(x=>String(x.date||'').startsWith(String(year))).reduce((s,x)=>s+(Number(x.amount)||0),0), est=Math.max(0,t.profit)*Number(state.settings.estimatedTaxRate||0.25), remaining=Math.max(0,est-paid);
  const periods=[['Q1',`${year}-04-15`],['Q2',`${year}-06-15`],['Q3',`${year}-09-15`],['Q4',`${year+1}-01-15`]];
  const filing=periods.map(([q,d])=>{const amount=est/4,p=state.taxPayments.filter(x=>x.year===year&&x.quarter===q).reduce((s,x)=>s+(Number(x.amount)||0),0);return `<tr><td>${q}</td><td>${fmtDate(d)}</td><td class="num">${fmtMoney(amount)}</td><td class="num">${fmtMoney(p)}</td><td>${p>=amount?'✓ Pago':'Pendente'}</td></tr>`}).join('');
  const nine=state.tax1099.filter(x=>Number(x.year)===Number(year));
  const reported={};state.marketplaceSales.filter(x=>String(x.date||'').startsWith(String(year))).forEach(x=>{const p=x.platform||'Outra';reported[p]=(reported[p]||0)+(Number(x.grossAmount)||0)});
  const nineRows=[...new Set([...Object.keys(reported),...nine.map(x=>x.payer||'')])].filter(Boolean).map(p=>{const form=nine.filter(x=>x.payer===p).reduce((s,x)=>s+(Number(x.amount)||0),0),app=reported[p]||0,diff=app-form;return `<tr><td>${escapeHTML(p)}</td><td class="num">${fmtMoney(app)}</td><td class="num">${fmtMoney(form)}</td><td class="num ${Math.abs(diff)>.01?'danger':''}">${fmtMoney(diff)}</td></tr>`}).join('');
  return `<details class="section-collapse" open><summary>Estimated taxes</summary><div class="collapse-body"><div class="stat-grid"><div class="stat-card"><div class="stat-label">Lucro usado na projeção</div><div class="stat-value">${fmtMoney(t.profit)}</div></div><div class="stat-card"><div class="stat-label">Reserva anual estimada</div><div class="stat-value amber">${fmtMoney(est)}</div><div class="stat-hint">Taxa editável nas configurações</div></div><div class="stat-card"><div class="stat-label">Pagamentos registrados</div><div class="stat-value">${fmtMoney(paid)}</div></div><div class="stat-card"><div class="stat-label">Ainda não registrado</div><div class="stat-value ${remaining?'danger':''}">${fmtMoney(remaining)}</div></div></div><table><thead><tr><th>Período</th><th>Vencimento</th><th class="num">Estimativa</th><th class="num">Pago</th><th>Status</th></tr></thead><tbody>${filing}</tbody></table><button class="btn btn-sm btn-amber" id="add-tax-payment" style="margin-top:12px">+ Registrar pagamento</button></div></details>
  <details class="section-collapse"><summary>Reconciliação 1099-K / plataformas</summary><div class="collapse-body"><div class="note-banner">Compare o bruto informado pelas plataformas com o valor do formulário 1099-K que você recebeu. Diferenças devem ser investigadas antes da declaração.</div><table><thead><tr><th>Plataforma</th><th class="num">Vendas no Gestor</th><th class="num">1099</th><th class="num">Diferença</th></tr></thead><tbody>${nineRows||'<tr><td colspan="4">Nenhuma plataforma para comparar.</td></tr>'}</tbody></table><button class="btn btn-sm btn-amber" id="add-1099" style="margin-top:12px">+ Informar 1099</button></div></details>
  <details class="section-collapse"><summary>Home office</summary><div class="collapse-body"><p style="color:var(--color-platinum);font-size:13px">Método simplificado: até 300 ft² × $5/ft². O resultado abaixo é organizacional; confirme elegibilidade e método com seu contador.</p><div class="stat-grid"><div class="stat-card"><div class="stat-label">Área</div><div class="stat-value">${Number(state.settings.homeOfficeSqFt)||0} ft²</div></div><div class="stat-card"><div class="stat-label">Dedução estimada</div><div class="stat-value">${fmtMoney(t.office)}</div></div></div><button class="btn btn-sm btn-ghost" id="edit-home-office">Editar em Configurações</button></div></details>`;
}
