function open1099Modal(){modalRoot.innerHTML=`<div class="modal-backdrop"><div class="modal-box"><h3>Informar 1099</h3><div class="form-grid"><div class="field"><label>Ano</label><input type="number" id="n-year" value="${todayISO().slice(0,4)}"></div><div class="field"><label>Pagador / plataforma</label><input id="n-payer" placeholder="Etsy"></div><div class="field"><label>Valor bruto do 1099</label><input type="number" step="0.01" id="n-amount"></div></div><div class="modal-actions"><button class="btn btn-ghost" id="n-cancel">Cancelar</button><button class="btn btn-primary" id="n-save">Salvar</button></div></div></div>`;document.getElementById('n-cancel').onclick=()=>modalRoot.innerHTML='';document.getElementById('n-save').onclick=async()=>{const x={id:uid(),year:Number(document.getElementById('n-year').value),payer:document.getElementById('n-payer').value.trim(),amount:Number(document.getElementById('n-amount').value)||0};if(!x.payer){showToast('Informe o pagador.');return}state.tax1099.push(x);await persist('tax1099',x.id);modalRoot.innerHTML='';showToast('1099 registrado.');render()}}

function openCalculatorHandoff(type, businessLine, items){
  const skeleton = newDocSkeleton(type);
  skeleton.businessLine = businessLine;
  skeleton.orderId=calculatorContext?.orderId||null;
  skeleton.revisionId=calculatorContext?.revisionId||null;
  skeleton.clientId=state.orders.find(o=>o.id===skeleton.orderId)?.clientId||null;
  if(items && items.length) skeleton.items = items;
  if(type==="invoice" && !skeleton.payments) skeleton.payments = [];
  editingDoc = {type, data: skeleton, isNew: true};
  currentView = type==="estimate" ? "estimates" : "invoices";
  render();
  showToast("Itens da calculadora prontos — escolha o cliente e revise antes de salvar.");

      ["etsy", "Etsy", result.etsy],

        <div>
          <div class="view-title">Calculadora Studio</div>
          <div class="view-sub">Preço por canal — venda direta, Etsy, eBay e Amazon lado a lado</div>
        </div>

        <div class="card">
          <div class="section-title">Item</div>
          <div class="field" style="margin-bottom:12px;">
            <label>Nome do item</label>

              <optgroup label="Filamentos do catálogo">
                ${MATERIALS_CATALOG.map(m=>`<option value="${escapeHTML(m.id)}" ${m.id===form.material?"selected":""}>${escapeHTML(m.name)} — ${fmtMoney(m.priceKg)}/kg</option>`).join("")}

            <input type="number" step="0.001" id="c-manualprice" value="${form.manualPrice}">

            <div class="field"><label>Tempo impressão (h.mm)</label><input type="number" inputmode="decimal" step="0.01" id="c-tempo" value="${form.tempo}" placeholder="2.30 = 2h30min"></div>
            <div class="field"><label>Pós-processo (min)</label><input type="number" inputmode="decimal" id="c-pos" value="${form.pos}" placeholder="0"></div>
          </div>
          <button class="btn btn-primary btn-sm" id="calc-run" type="button" style="width:100%; justify-content:center; margin-top:16px;">Calcular</button>
        </div>

        <div class="card">
          <div class="section-title">Custo</div>
          <div class="calc-cost-line"><span>Material</span><span>${fmtMoney(result.custoMaterial)}</span></div>
          <div class="calc-cost-line"><span>Máquina</span><span>${fmtMoney(result.custoMaquina)}</span></div>
          <div class="calc-cost-line"><span>Mão de obra</span><span>${fmtMoney(result.custoMaoObra)}</span></div>
          <div class="calc-cost-line total"><span>Custo total</span><span>${fmtMoney(result.custoTotal)}</span></div>

          <div class="section-title" style="margin-top:22px;">Preço por canal<span class="hint">clique pra escolher o canal desta cotação</span></div>
          <div class="channel-tiles">
            ${channels.map(([key,label,r])=>`
              <div class="channel-tile ${form.channel===key?"selected":""}" data-channel="${key}">
                <div class="ch-name">${label}<span class="ch-check"></span></div>
                <div class="ch-price">${r.impossivel ? "—" : fmtMoney(r.preco)}</div>
                <div class="ch-profit">${r.impossivel ? "margem inviável" : "lucro " + fmtMoney(r.lucro)}</div>
              </div>`).join("")}
          </div>
          ${channels.some(([,,r])=>r.impossivel) ? `
          <div class="calc-warning">
            A margem-alvo (${((Number(pricing.margemAlvoMarketplace)||0)*100).toFixed(0)}%) somada à taxa da plataforma
            chega a 100% ou mais — não existe preço que feche essa conta. Reduza a margem-alvo em
            Configurações → Premissas de Cálculo.
          </div>` : ""}
          <button class="btn btn-amber btn-sm" id="add-to-list" style="margin-top:16px;">+ Adicionar à cotação</button>
        </div>
      </div>

      <div class="card" style="margin-top:16px;">
        <div class="section-title">Itens desta cotação<span class="hint">${list.length} item(ns) · total ${fmtMoney(listTotal)}</span></div>
        ${list.length===0 ? `<div class="calc-empty-hint">Adicione itens acima pra montar uma cotação com vários produtos.</div>` :
          list.map((it,i)=>`
            <div class="calc-list-row">
              <div>
                <div class="li-desc">${escapeHTML(it.desc)}</div>
                <div class="li-meta">${escapeHTML(it.channelLabel)}</div>
              </div>
              <div style="display:flex; align-items:center; gap:12px;">
                <div class="li-price">${fmtMoney(it.rate)}</div>
                <button class="remove-line" data-remove-item="${i}">&times;</button>
              </div>
            </div>`).join("")
        }
        ${list.length>0 ? `
        <div class="modal-actions" style="margin-top:16px; justify-content:flex-start;">
          <button class="btn btn-primary" id="handoff-estimate">Criar orçamento com estes itens</button>
        </div>` : ""}
      </div>
    `;

    document.getElementById("c-nome").oninput = e=>{ form.nome = e.target.value; };
    document.getElementById("c-material").onchange = e=>{ form.material = e.target.value; draw(); };
    const mp = document.getElementById("c-manualprice");
    if(mp) mp.oninput = e=>{ form.manualPrice = e.target.value; };
    document.getElementById("c-peso").oninput = e=>{ form.peso = e.target.value; };
    document.getElementById("c-tempo").oninput = e=>{ form.tempo = e.target.value; };
    document.getElementById("c-pos").oninput = e=>{ form.pos = e.target.value; };
    document.getElementById("calc-run").onclick = ()=> draw();
    main.querySelectorAll("[data-channel]").forEach(tile=> tile.onclick = ()=>{ form.channel = tile.dataset.channel; draw(); });

    document.getElementById("add-to-list").onclick = ()=>{
      if(!form.nome.trim()){ showToast("Dê um nome pro item antes de adicionar."); return; }
      const chosen = channels.find(c=>c[0]===form.channel);
      if(chosen[2].impossivel){ showToast("Este canal não tem preço viável com a margem-alvo atual."); return; }
      list.push({ desc: form.nome.trim(), channelLabel: chosen[1], rate: chosen[2].preco });
      form.nome=""; form.peso=""; form.tempo=""; form.pos=""; form.manualPrice="";
      draw();
      showToast("Item adicionado.");
    };
    main.querySelectorAll("[data-remove-item]").forEach(btn=> btn.onclick = ()=>{
      list.splice(Number(btn.dataset.removeItem),1);
      draw();
    });
    const handoffBtn = document.getElementById("handoff-estimate");
    if(handoffBtn){
      handoffBtn.onclick = ()=>{
        const items = list.map(it => ({desc: it.desc + " (" + it.channelLabel + ")", qty:1, rate: it.rate, taxable:true}));
        openCalculatorHandoff("estimate", "Reverso Studio", items);
      };
    }
  }
  draw();
}

    document.getElementById("add-to-list").onclick = ()=>{
      if(!form.nome.trim()){ showToast("Dê um nome pra peça antes de adicionar."); return; }
      list.push(Object.assign({nome: form.nome.trim()}, result));
      form.nome=""; form.peso=""; form.tempo=""; form.pos=""; form.horasNRE=""; form.manualPrice=""; form.repeticao=false;
      draw();
      showToast("Peça adicionada.");
    };
    main.querySelectorAll("[data-remove-item]").forEach(btn=> btn.onclick = ()=>{
      list.splice(Number(btn.dataset.removeItem),1);
      draw();
    });
    const handoffBtn = document.getElementById("handoff-estimate");

          if(it.precoNRE > 0){
            items.push({desc: it.nome + " — NRE (escaneamento/CAD)", qty:1, rate: it.precoNRE, taxable:false});
          }
        });
        /* O pedido mínimo era calculado e nunca avisado no handoff. */
        const totalCotacao = list.reduce((acc,it)=> acc + (Number(it.totalPedido)||0), 0);
        const minimo = Number(state.settings.pricing.pedidoMinimo)||0;

          showToast("Atenção: " + fmtMoney(totalCotacao) + " está abaixo do pedido mínimo de " + fmtMoney(minimo) + ".");
        }
        openCalculatorHandoff("estimate", "Reverso Works", items);
      };
    }
  }
  draw();
}

function renderSettingsCatalogo(body, s){
  let search = "";

  function draw(){
    const list = state.catalog
      .filter(c => (c.name||"").toLowerCase().includes(search.toLowerCase()))
      .filter(c => !filterType || c.type===filterType)
      .sort((a,b)=> (a.type===b.type ? 0 : a.type==="service" ? -1 : 1) || a.name.localeCompare(b.name));

    body.innerHTML = `
      <div class="note-banner">
        <strong>Serviços</strong> cobrados por hora usam o formato h.mm (1.45 = 1h45min) na quantidade do orçamento/fatura. <strong>Itens</strong> têm unidade única e o preço fica em aberto até você definir na hora do orçamento/fatura.
      </div>
      <div class="card" style="padding:0;">
        <div class="toolbar" style="padding:16px 16px 0 16px; margin-bottom:0;">
          <input type="search" id="cat-search" placeholder="Buscar por nome…" value="${escapeHTML(search)}">
          <select id="cat-filter">
            <option value="">Todos os tipos</option>
            <option value="service" ${filterType==='service'?'selected':''}>Serviços</option>
            <option value="item" ${filterType==='item'?'selected':''}>Itens</option>
          </select>
          <div class="spacer"></div>
          <button class="btn btn-primary btn-sm" id="cat-new">+ Novo item/serviço</button>
        </div>
        <div style="padding:16px;">
        ${list.length===0 ? `<div class="empty-state"><div class="big">Nada encontrado</div>Crie um item ou serviço novo pra começar.</div>` : `
        <table>
          <thead><tr><th>Nome</th><th>Tipo</th><th>Cobrança</th><th class="num">Preço</th><th></th></tr></thead>
          <tbody>
            ${list.map(c => `
              <tr data-id="${c.id}">
                <td><input class="cat-name" value="${escapeHTML(c.name)}"></td>
                <td>
                  <select class="cat-type">
                    <option value="item" ${c.type==='item'?'selected':''}>Item</option>
                    <option value="service" ${c.type==='service'?'selected':''}>Serviço</option>
                  </select>
                </td>
                <td>
                  <select class="cat-mode">
                    <option value="fixed" ${(c.pricingMode||'fixed')==='fixed'?'selected':''}>Valor fixo</option>
                    <option value="hours" ${c.pricingMode==='hours'?'selected':''}>Por hora (h.mm)</option>
                    <option value="hours_material" ${c.pricingMode==='hours_material'?'selected':''}>Hora × material (Impressão)</option>
                  </select>
                </td>
                <td class="num">
                  ${c.pricingMode==='hours_material'
                    ? `<span class="stat-hint">definido por peça</span>`
                    : `<input class="cat-price num-input" type="number" inputmode="decimal" step="0.01" value="${c.price}">`}
                </td>
                <td class="row-actions">
                  <button class="btn btn-sm btn-danger" data-del="${c.id}">Excluir</button>
                </td>
              </tr>`).join("")}
          </tbody>
        </table>`}
        </div>
      </div>
    `;

    document.getElementById("cat-search").oninput = e=>{ search = e.target.value; draw(); };
    document.getElementById("cat-filter").onchange = e=>{ filterType = e.target.value; draw(); };
    document.getElementById("cat-new").onclick = ()=>{
      openCatalogQuickCreateModal("", ()=>{ draw(); });
    };
    body.querySelectorAll("tr[data-id]").forEach(tr=>{
      const id = tr.dataset.id;
      const entry = state.catalog.find(c=>c.id===id);
      if(!entry) return;
      const nameInp = tr.querySelector(".cat-name");
      const typeSel = tr.querySelector(".cat-type");
      const modeSel = tr.querySelector(".cat-mode");
      const priceInp = tr.querySelector(".cat-price");
      const save = async ()=>{
        entry.name = nameInp.value.trim() || entry.name;
        entry.type = typeSel.value;
        entry.pricingMode = modeSel.value;
        entry.unit = entry.pricingMode==="fixed" ? "un" : "h";
        if(priceInp) entry.price = Number(priceInp.value)||0;
        await persist("catalog", entry.id);
      };
      nameInp.onchange = save;
      typeSel.onchange = save;
      modeSel.onchange = ()=>{ save(); draw(); };
      if(priceInp) priceInp.onchange = save;
    });
    body.querySelectorAll("[data-del]").forEach(btn=> btn.onclick = ()=>{
      confirmModal("Excluir do catálogo?", "Orçamentos/faturas já criados com este item não são afetados.", async ()=>{
        state.catalog = state.catalog.filter(c=>c.id!==btn.dataset.del);
        await persist("catalog", []);
        showToast("Removido do catálogo.");
        draw();
      });
    });
  }
  draw();
}

      <div class="field"><label for="login-password">Senha</label><input type="password" id="login-password" autocomplete="${authMode==='signup'?'new-password':'current-password'}" aria-describedby="login-error"></div>
      <div class="login-actions">
        <button class="btn btn-primary" id="login-submit">${authMode==="signup" ? "Criar conta" : "Entrar"}</button>
      </div>
      <a class="btn btn-ghost" href="?demo=1">Explorar demonstração</a>
      <div class="login-toggle">
        ${authMode==="signup"
          ? `Já tem conta? <button type="button" id="to-login">Entrar</button>`
          : `Primeiro acesso? <button type="button" id="to-signup">Criar conta</button>`}
      </div>
    </div>
  `;
  document.getElementById("login-submit").onclick = handleAuthSubmit;
  const pwField = document.getElementById("login-password");
  pwField.addEventListener("keydown", e=>{ if(e.key==="Enter") handleAuthSubmit(); });
  const toSignup = document.getElementById("to-signup");
  if(toSignup) toSignup.onclick = ()=>{ authMode="signup"; renderLoginScreen(); };
  const toLogin = document.getElementById("to-login");
  if(toLogin) toLogin.onclick = ()=>{ authMode="login"; renderLoginScreen(); };
}

async function handleAuthSubmit(){
  if(!auth){renderLoginScreen("Conexão com autenticação indisponível. Recarregue e tente novamente.");return;}
  const email = document.getElementById("login-email").value.trim();
  const password = document.getElementById("login-password").value;
  if(!email || !password){ renderLoginScreen("Preencha email e senha."); return; }
  try{
    if(authMode==="signup"){
      await auth.createUserWithEmailAndPassword(email, password);
    } else {
      await auth.signInWithEmailAndPassword(email, password);
    }
    // onAuthStateChanged cuida do resto
  }catch(e){
    renderLoginScreen(translateAuthError(e));
  }
}

function translateAuthError(e){
  const code = e && e.code || "";
  const map = {
    "auth/user-not-found": "Email não encontrado. Crie uma conta primeiro.",
    "auth/wrong-password": "Senha incorreta.",
    "auth/invalid-email": "Email inválido.",
    "auth/email-already-in-use": "Este email já tem conta — clique em \"Entrar\".",
    "auth/weak-password": "Senha muito curta (mínimo 6 caracteres).",
    "auth/too-many-requests": "Muitas tentativas. Aguarde um pouco e tente de novo."
  };
  return map[code] || "Não foi possível autenticar. Tente novamente.";
}

async function commitRecords(records){
  if(writeBusy){showToast('Aguarde a gravação atual.');return false;}
  if(records.length>450){showToast('Este conjunto excede 450 registros. É necessária uma restauração administrativa para este volume. Nenhum dado foi alterado.');return false;}
  writeBusy=true;
  try{
    if(!demoMode){
      const batch=db.batch();
      records.forEach(([col,row,remove])=>{const ref=col==='settings'?userDocRef():userColRef(col).doc(String(row.id));if(remove)batch.delete(ref);else if(col==='settings')batch.set(ref,Model.clone(row),{merge:true});else batch.set(ref,Model.clone(row));});
      await batch.commit();
    }
    records.forEach(([col,row,remove])=>{
      if(col==='settings'){state.settings=Model.clone(row);return;}
      const i=state[col].findIndex(x=>x.id===row.id);
      if(remove){if(i>=0)state[col].splice(i,1);}else if(i<0)state[col].push(Model.clone(row));else state[col][i]=Model.clone(row);
      if(!demoMode){const known=_persistedIds[col]||(_persistedIds[col]=new Set());remove?known.delete(row.id):known.add(row.id);}
    });
    return true;
  }catch(e){showToast('Não foi possível salvar. Seus registros anteriores foram preservados. '+(e.code||''));return false;}finally{writeBusy=false;}
}

function renderParts(main){
  main.innerHTML=`<div class="view-header"><div><div class="view-title">Peças e revisões</div><div class="view-sub">A identidade da peça permanece. Cada fabricação tem sua própria ordem.</div></div><button class="btn btn-primary" id="new-part">Nova peça</button></div><div class="wf-actions"><button class="btn btn-ghost" id="import-local-parts">Importar fichas antigas</button><input type="file" id="legacy-parts-file" accept="application/json" hidden><button class="btn btn-ghost" id="import-part-file">Importar fichas de arquivo</button></div>${state.parts.map(p=>{const revs=state.partRevisions.filter(r=>r.partId===p.id);return `<section class="wf-section"><h2>${h(p.partNumber)} · ${h(p.name)}</h2><p>${h(p.clientId?clientName(p.clientId):'Sem cliente específico')} · ${h(p.oem||'Sem referência OEM')}</p>${revs.map(r=>`<div class="wf-record"><span><strong>${h(r.rev)} · ${h(r.material||'Material a definir')}</strong><small>${h(r.application||'')} · ${r.engineeringProjectId?'Análise vinculada':'Sem análise vinculada'}</small></span><div class="wf-actions"><button class="btn btn-ghost" data-revise="${r.id}">Nova revisão</button><button class="btn btn-ghost" data-analyze="${r.id}">Engenharia</button><button class="btn btn-ghost" data-print-part="${r.id}">Imprimir ficha</button></div></div>`).join('')}</section>`;}).join('')||'<div class="empty-state">Cadastre sua primeira peça para reutilizar especificações e manter revisões.</div>'}`;
  document.getElementById('new-part').onclick=()=>editPart();main.querySelectorAll('[data-revise]').forEach(b=>b.onclick=()=>editPart(state.partRevisions.find(r=>r.id===b.dataset.revise)));main.querySelectorAll('[data-analyze]').forEach(b=>b.onclick=()=>{engineeringContext={revisionId:b.dataset.analyze};selectedAnalysisId=state.partRevisions.find(r=>r.id===b.dataset.analyze)?.engineeringProjectId||null;currentView='engineering';render();});
  main.querySelectorAll('[data-print-part]').forEach(b=>b.onclick=()=>printPart(state.partRevisions.find(r=>r.id===b.dataset.printPart)));
  document.getElementById('import-local-parts').onclick=()=>{try{importLegacyParts(JSON.parse(localStorage.getItem('reverso_v11_parts')||'[]'));}catch(e){showToast('Não foi possível ler as fichas antigas.');}};
  document.getElementById('import-part-file').onclick=()=>document.getElementById('legacy-parts-file').click();document.getElementById('legacy-parts-file').onchange=async e=>{try{importLegacyParts(JSON.parse(await e.target.files[0].text()));}catch(err){showToast('Arquivo de fichas inválido.');}};
}
function editPart(previous,orderId){
  const part=state.parts.find(p=>p.id===previous?.partId),rev=previous||{},order=state.orders.find(o=>o.id===orderId);
  dialog(previous?'Criar nova revisão':'Nova peça',field('Código da peça','part-number',part?.partNumber||'','text',part?'readonly':'required')+field('Nome da peça','part-name',part?.name||'','text',part?'readonly':'required')+field('Revisão','part-rev',previous?'R'+String(state.partRevisions.filter(r=>r.partId===part.id).length+1).padStart(2,'0'):'R01','text','required')+selectField('Cliente','part-client','<option value="">Sem cliente específico</option>'+state.clients.map(c=>`<option value="${c.id}" ${(part?.clientId||order?.clientId)===c.id?'selected':''}>${h(c.name)}</option>`).join(''))+field('Referência OEM','part-oem',part?.oem)+field('Aplicação','part-application',rev.application)+field('Material especificado','part-material',rev.material)+field('Notas técnicas','part-notes',rev.notes),async()=>{
    const partId=part?.id||uid();
    if(!part&&state.parts.some(p=>p.partNumber.toLowerCase()===value('part-number').toLowerCase()))throw Error('Código existente. Abra a peça e crie uma nova revisão.');
    if(state.partRevisions.some(r=>r.partId===partId&&r.rev.toLowerCase()===value('part-rev').toLowerCase()))throw Error('Essa revisão já existe.');
    const nextPart=part||{id:partId,partNumber:value('part-number'),name:value('part-name'),clientId:value('part-client')||null,oem:value('part-oem'),createdAt:todayISO()};
    const nextRev={id:uid(),partId,rev:value('part-rev'),application:value('part-application'),material:value('part-material'),notes:value('part-notes'),engineeringProjectId:null,createdAt:todayISO()};
    const records=[['parts',nextPart],['partRevisions',nextRev]];if(order)records.push(['orders',{...order,revisionIds:[...(order.revisionIds||[]),nextRev.id]}]);
    if(await commitRecords(records)){closeModal();if(order)orderOpen(order.id,'Peças');else render();}
  });
}
async function importLegacyParts(rows){
  if(rows&&Array.isArray(rows.parts))rows=rows.parts;
  if(!Array.isArray(rows))throw Error('Arquivo deve conter uma lista de fichas.');
  const fresh=rows.filter(p=>p&&typeof p.id==='string'&&!state.parts.some(x=>x.legacyId===p.id));
  if(!fresh.length){showToast('Nenhuma ficha nova encontrada neste navegador. Para outro endereço, importe um arquivo JSON.');return;}
  confirmModal('Importar '+fresh.length+' ficha(s)?','As fichas serão adicionadas à conta atual. Os registros locais originais serão preservados. Etapas antigas serão mantidas como referência, sem criar produção duplicada.',async()=>{
    const records=[];for(const old of fresh){const id=uid(),part={id,legacyId:old.id,partNumber:String(old.partId||'LEG-'+id),name:String(old.name||'Peça importada'),clientId:state.clients.find(c=>c.name===old.client)?.id||null,oem:String(old.oem||''),legacy:Model.clone(old),createdAt:todayISO()};const revision={id:uid(),partId:id,rev:String(old.rev||'R01'),material:String(old.material||''),application:String(old.application||''),notes:String(old.notes||''),engineeringProjectId:null,createdAt:todayISO()};records.push(['parts',part],['partRevisions',revision]);}
    if(await commitRecords(records)){showToast('Fichas importadas.');render();}
  });
}
function printPart(rev){const p=state.parts.find(p=>p.id===rev.partId);const area=document.getElementById('print-area');area.innerHTML=`<article class="wf-print"><h1>${h(p.partNumber)} · ${h(rev.rev)}</h1><h2>${h(p.name)}</h2><p>Cliente: ${h(clientName(p.clientId))}</p><p>Aplicação: ${h(rev.application)}</p><p>Material: ${h(rev.material)}</p><p>${h(rev.notes)}</p></article>`;window.print();setTimeout(()=>area.innerHTML='',500);}
function renderEngineering(main){
  legacyRenderEngineering(main);
  const saved=state.engineeringProjects.find(p=>p.id===selectedAnalysisId),ctx=document.createElement('div');ctx.className='wf-context';ctx.innerHTML=selectField('Vincular análise à peça / revisão','eng-revision','<option value="">Análise independente</option>'+revisionOptions(saved?.revisionId||engineeringContext?.revisionId));main.querySelector('.view-header').after(ctx);
  const rev=state.partRevisions.find(r=>r.id===(saved?.revisionId||engineeringContext?.revisionId));if(!saved&&rev){const el=document.getElementById('eng-name');el.value=revisionLabel(rev);el.dispatchEvent(new Event('input'));}
  const history=document.createElement('div');history.className='wf-section';history.innerHTML='<h2>Abrir análise salva</h2>'+state.engineeringProjects.map(p=>`<button class="btn btn-ghost" data-analysis="${p.id}">${h(p.name||'Análise')} · ${h((p.createdAt||'').slice(0,10))}</button>`).join('');main.append(history);history.querySelectorAll('button').forEach(b=>b.onclick=()=>{selectedAnalysisId=b.dataset.analysis;render();});
}
function renderPipelineEditor(main){
  legacyRenderPipelineEditor(main);
  const data=editingPipelineCard.data;
  const context=document.createElement('div');context.className='wf-context';context.innerHTML=selectField('Pedido','production-order','<option value="">Sem vínculo</option>'+state.orders.map(o=>`<option value="${o.id}" ${data.orderId===o.id?'selected':''}>${h(o.number+' · '+o.title)}</option>`).join(''))+selectField('Peça / revisão','production-part','<option value="">Sem peça vinculada</option>'+revisionOptions(data.revisionId));main.querySelector('.view-header').after(context);
  context.insertAdjacentHTML('beforeend',selectField('Análise desta fabricação','production-analysis','<option value="">Sem análise vinculada</option>'+state.engineeringProjects.map(p=>`<option value="${p.id}" ${data.engineeringProjectId===p.id?'selected':''}>${h(p.name||'Análise')} · ${h(p.recommendationName)}</option>`).join('')));
  if(['imprimindo','pos_processamento','qualidade','pronto','entregue'].includes(data.stage))document.getElementById('production-analysis').disabled=true;
  if(data.revisionSnapshot){document.getElementById('production-part').disabled=true;document.getElementById('c-material').readOnly=true;}
  document.getElementById('production-order').onchange=e=>{const o=state.orders.find(o=>o.id===e.target.value);if(o){document.getElementById('c-client').value=o.clientId;document.getElementById('c-line').value=o.businessLine;}};
  document.getElementById('production-part').onchange=e=>{const r=state.partRevisions.find(r=>r.id===e.target.value);if(r)document.getElementById('c-material').value=r.material||'';};
  document.getElementById('save-card').onclick=async()=>{
    const order=state.orders.find(o=>o.id===value('production-order')),rev=state.partRevisions.find(r=>r.id===value('production-part'));
    if(!value('c-title')){showToast('Dê um título à ordem.');return;}
    if(order&&order.clientId!==value('c-client')){showToast('O cliente deve ser o mesmo do pedido.');return;}
    for(const [id,col] of [['c-estimate','estimates'],['c-invoice','invoices']]){const doc=state[col].find(x=>x.id===value(id));if(doc&&(doc.clientId!==value('c-client')||(order&&doc.orderId&&doc.orderId!==order.id))){showToast('Documento pertence a outro cliente ou pedido.');return;}}
    const next=Model.stageChange(data,value('c-stage'),todayISO());Object.assign(next,{title:value('c-title'),clientId:value('c-client')||null,businessLine:value('c-line'),orderId:order?.id||null,estimateId:value('c-estimate')||null,invoiceId:value('c-invoice')||null,forecastDate:value('c-forecast')||null,horasMaquina:Number(value('c-hours'))||0,notes:value('c-notes'),material:value('c-material')});
    if(rev&&!next.revisionSnapshot)Object.assign(next,{revisionId:rev.id,partId:rev.partId,revisionSnapshot:Model.clone(rev),engineeringProjectId:rev.engineeringProjectId||null,material:rev.material||''});
    const analysisId=value('production-analysis')||next.engineeringProjectId||null;
    const analysis=state.engineeringProjects.find(p=>p.id===analysisId);
    if(analysis?.revisionId&&analysis.revisionId!==next.revisionId){showToast('A análise deve pertencer à revisão desta fabricação.');return;}
    next.engineeringProjectId=analysisId;
    const records=[['pipeline',next]];
    if(order){for(const [id,col] of [['c-estimate','estimates'],['c-invoice','invoices']]){const doc=state[col].find(x=>x.id===value(id));if(doc&&!doc.orderId)records.push([col,{...doc,orderId:order.id}]);}}
    if(order&&rev)records.push(['orders',{...order,revisionIds:[...new Set([...(order.revisionIds||[]),rev.id])]}]);
    if(await commitRecords(records)){editingPipelineCard=null;showToast('Ordem salva.');if(order)orderOpen(order.id,'Produção');else render();}
  };
  if(!editingPipelineCard.isNew){
    const block=document.createElement('div');block.className='wf-section';const movements=state.stockMovements.filter(m=>m.productionId===data.id);block.innerHTML=`<h2>Consumo de material</h2><p>${movements.reduce((n,m)=>n+m.grams,0)} g registrados · ${fmtMoney(movements.reduce((n,m)=>n+m.cost,0))}</p><button class="btn btn-ghost" id="consume-stock">Registrar consumo de lote</button><h2>Histórico de etapas</h2>${(data.history||[]).map(e=>`<p>${h(stageLabel(e.stage))} · ${fmtDate(e.at)}</p>`).join('')||'<p>Registro anterior sem histórico de transições.</p>'}`;main.append(block);document.getElementById('consume-stock').onclick=()=>consumeStock(data);
  }
}
function consumeStock(card){dialog('Registrar consumo',selectField('Lote disponível','consume-item','<option value="">Selecione</option>'+state.inventory.map(i=>`<option value="${i.id}">${h(i.name+' · '+(i.lot||'sem lote'))} · ${Number(i.qty).toFixed(3)} kg</option>`).join(''))+field('Quantidade consumida (g)','consume-grams','','number','min="0.001" step="0.001" required'),async()=>{const item=state.inventory.find(i=>i.id===value('consume-item'));if(!item)throw Error('Selecione um lote.');const plan=Model.stockConsumption(item,card,Number(value('consume-grams')),uid,todayISO());if(await commitRecords([['inventory',plan.item],['stockMovements',plan.movement]])){closeModal();showToast('Consumo registrado e estoque atualizado.');render();}});}
function renderClientProfile(main){legacyRenderClientProfile(main);const section=document.createElement('section');section.className='wf-section';section.innerHTML='<h2>Pedidos deste cliente</h2>'+state.orders.filter(o=>o.clientId===viewingClient).map(o=>`<button class="wf-record" data-customer-order="${o.id}"><strong>${h(o.number)} · ${h(o.title)}</strong><span>Abrir →</span></button>`).join('');main.append(section);section.querySelectorAll('button').forEach(b=>b.onclick=()=>orderOpen(b.dataset.customerOrder));}
function renderDashboard(main){legacyRenderDashboard(main);const quick=main.querySelector('[data-quick="engineering"]');if(quick)quick.onclick=()=>{currentView='parts';render();editPart();};const actions=main.querySelector('.quick-grid');if(actions){const b=document.createElement('button');b.className='quick-action';b.innerHTML='<strong>Novo pedido</strong><span>Organizar um novo trabalho</span>';b.onclick=()=>editOrder();actions.prepend(b);}}
function renderAgenda(main){
  main.innerHTML=`<div class="view-header"><div><div class="view-title">Agenda de produção</div><div class="view-sub">Prazos de fabricação e entrega, separados dos vencimentos financeiros.</div></div></div><label class="wf-field">Semana de<input type="date" id="agenda-date" value="${todayISO()}"></label><div id="agenda-week"></div>`;
  const draw=()=>{const start=new Date(value('agenda-date')+'T12:00:00');if(!Number.isFinite(start.getTime()))return;start.setDate(start.getDate()-start.getDay());let html='';for(let i=0;i<7;i++){const day=new Date(start);day.setDate(day.getDate()+i);const iso=localISO(day),runs=state.pipeline.filter(c=>c.forecastDate===iso);html+=`<section class="wf-agenda-day"><h2>${h(day.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'short'}))}</h2>${runs.map(c=>`<button class="wf-record" data-agenda-run="${c.id}"><strong>${h(c.title)}</strong><span>${h(stageLabel(c.stage))} →</span></button>`).join('')||'<p class="wf-note">Sem entregas previstas</p>'}</section>`;}document.getElementById('agenda-week').innerHTML=html;main.querySelectorAll('[data-agenda-run]').forEach(b=>b.onclick=()=>{editingPipelineCard={data:Model.clone(state.pipeline.find(c=>c.id===b.dataset.agendaRun)),isNew:false};currentView='pipeline';render();});};document.getElementById('agenda-date').onchange=draw;draw();
}
function seedDemo(){
  state.settings=Model.clone(DEFAULT_SETTINGS);COLLECTION_NAMES.forEach(k=>state[k]=[]);
  state.clients=[{...newClientSkeleton(),id:'demo-client',name:'Oficina Horizonte',type:'individual',email:'oficina@example.com',phone:'',address:{},categories:[],tracking:[]}];
  state.parts=[{id:'demo-part',partNumber:'RW-001',name:'Suporte de sensor',clientId:'demo-client',oem:'REF-001',createdAt:todayISO()}];
  state.partRevisions=[{id:'demo-rev',partId:'demo-part',rev:'R01',application:'Fixação de sensor',material:'PETG HF',notes:'Conferir dimensões antes de fabricar.',engineeringProjectId:null,createdAt:todayISO()}];
  const estimate=newDocSkeleton('estimate');Object.assign(estimate,{id:'demo-est',number:'EST-0001',clientId:'demo-client',revisionId:'demo-rev',items:[{desc:'Suporte de sensor — R01',qty:2,rate:45,taxable:true}],status:'sent',sentDate:todayISO()});state.estimates=[estimate];
  const plan=Model.approval(state,estimate,uid,todayISO());plan.order.deliveryDate=addDays(todayISO(),3);plan.order.title='Suporte de sensor · lote inicial';plan.production.forecastDate=plan.order.deliveryDate;plan.production.stage='escaneamento_cad';plan.production.history.push({stage:'escaneamento_cad',at:todayISO()});state.orders=[plan.order];state.pipeline=[plan.production];state.estimates=[plan.estimate];
  state.inventory=[{id:'demo-stock',name:'PETG HF',lot:'DEMO-01',qty:1.5,costKg:24,reorder:.25,color:'Preto'}];
  state.settings.nextEstimateNumber=2;seedDefaultCatalog();ready=true;currentUser={email:'Demonstração',uid:'demo'};
  document.getElementById('login-screen').style.display='none';document.getElementById('app').style.display='flex';document.getElementById('user-email').textContent='Demonstração';currentView='orders';render();
}
function operationsTimeline(c){
  const events=[{label:'Ordem criada',date:c.createdAt,done:true,detail:'Registro de fabricação.'}];
  if(c.history?.length)c.history.forEach(e=>events.push({label:stageLabel(e.stage),date:e.at,done:true,detail:'Etapa registrada'}));
  else events.push({label:stageLabel(c.stage),date:c.updatedAt||null,done:true,detail:'Etapa atual. Registro anterior sem histórico.'});
  return events;
}
function openCommandPalette(){
  modalRoot.innerHTML='<div class="modal-backdrop"><div class="modal-box" role="dialog" aria-modal="true" aria-label="Buscar seção"><label class="wf-field">Buscar seção<input id="wf-command" placeholder="Pedidos, peças, produção…"></label><div id="wf-results"></div><button class="btn btn-ghost" id="wf-command-close">Fechar</button></div></div>';
  const input=document.getElementById('wf-command');const draw=()=>{const q=input.value.toLowerCase();const rows=GROUPS.flatMap(g=>g.views.map(v=>({id:v[0],label:g.label+' / '+v[1]}))).filter(v=>v.label.toLowerCase().includes(q));document.getElementById('wf-results').innerHTML=rows.map(v=>`<button class="wf-record" data-command-view="${v.id}">${h(v.label)}</button>`).join('');modalRoot.querySelectorAll('[data-command-view]').forEach(b=>b.onclick=()=>{const view=b.dataset.commandView;closeModal();navigate(view);});};input.oninput=draw;document.getElementById('wf-command-close').onclick=closeModal;draw();input.focus();
}
function renderSaleEditor(main){legacyRenderSaleEditor(main);const ctx=document.createElement('div');ctx.className='wf-context';ctx.innerHTML=selectField('Pedido interno (opcional)','sale-project','<option value="">Sem vínculo</option>'+state.orders.map(o=>`<option value="${o.id}" ${editingSale.projectId===o.id?'selected':''}>${h(o.number+' · '+o.title)}</option>`).join(''));main.querySelector('.view-header').after(ctx);}

// Associate labels after legacy views redraw their own forms.
const fieldObserver=new MutationObserver(()=>{
  [document.getElementById('workspace-view'),modalRoot].forEach(root=>root.querySelectorAll('.field').forEach((field,i)=>{
    const label=field.querySelector('label'),input=field.querySelector('input,select,textarea');
    if(label&&input){if(!input.id)input.id='auto-field-'+i;if(label.htmlFor!==input.id)label.htmlFor=input.id;}
  }));
});
fieldObserver.observe(document.getElementById('workspace-view'),{childList:true,subtree:true});
fieldObserver.observe(modalRoot,{childList:true,subtree:true});
if(demoMode)seedDemo();else if(auth){auth.onAuthStateChanged(async user=>{currentUser=user;resetEditors();activeOrderId=null;selectedAnalysisId=null;calculatorContext=null;engineeringContext=null;if(user)await showApp();else showLogin();});}else renderLoginScreen('Autenticação indisponível. Confira a conexão ou explore a demonstração.');
})();

</script>
