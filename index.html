    main.querySelectorAll("[data-open]").forEach(b=> b.onclick = ()=> openDocEditor(type, state[col].find(x=>x.id===b.dataset.open)));
    main.querySelectorAll("[data-pipeline]").forEach(b=> b.onclick = ()=>{
      const doc = state[col].find(x=>x.id===b.dataset.pipeline);
      const existing = state.pipeline.find(c => (type==="estimate"?c.estimateId:c.invoiceId)===doc.id);
      if(existing){ editingPipelineCard = {data: JSON.parse(JSON.stringify(existing)), isNew:false}; render(); return; }
      const card = newPipelineSkeleton();
      card.clientId = doc.clientId;
      card.businessLine = doc.businessLine;
      card.title = (doc.items && doc.items[0] && doc.items[0].desc) ? doc.items[0].desc : (doc.number + " — " + clientName(doc.clientId));
      if(type==="estimate"){ card.estimateId = doc.id; card.forecastDate = doc.validUntil; }
      else { card.invoiceId = doc.id; card.forecastDate = doc.dueDate; }
      editingPipelineCard = {data: card, isNew:true};
      render();

    main.querySelectorAll("[data-del]").forEach(b=> b.onclick = ()=>{
      confirmModal(`Excluir ${type==="estimate"?"orçamento":"fatura"}?`, "Essa ação não pode ser desfeita.", async ()=>{

        await persist(col);
        showToast("Excluído.");
        draw();
      });
    });
  }
  draw();
}

function newDocSkeleton(type){
  const settings = state.settings;
  const number = prefixFor(type) + "-" + String(type==="estimate" ? settings.nextEstimateNumber : settings.nextInvoiceNumber).padStart(4,"0");
  const date = todayISO();
  return {
    id: uid(),
    number,
    clientId: state.clients[0] ? state.clients[0].id : null,
    businessLine: settings.defaultLine,
    date,
    validUntil: type==="estimate" ? addDays(date, 15) : null,
    dueDate: type==="invoice" ? addDays(date, 15) : null,
    status: "draft",
    items: [{desc:"", qty:1, rate:0, taxable:true}],
    applyTax: false,
    taxRate: settings.salesTaxRate,
    notes: type==="estimate" ? settings.estimateNotes : settings.invoiceNotes,
    payments: type==="invoice" ? [] : undefined,
    paidDate: null,
    fromEstimateNumber: null,
    poNumber: "",
    requiresShipping: false,
    shippingAddress: {line1:"", line2:"", city:"", state:"", zip:"", country:"Estados Unidos"},
    materialsUsed: []
  };
}

function openDocEditor(type, doc){
  const data = doc ? JSON.parse(JSON.stringify(doc)) : newDocSkeleton(type);
  if(type==="invoice" && !data.payments) data.payments = effectivePayments(data);
  if(!data.items) data.items = [{desc:"", qty:1, rate:0, taxable:true}];
  data.items.forEach(it => { if(it.taxable === undefined) it.taxable = true; });
  // Migração: documentos antigos tinham "shipTo" como texto livre.
  if(data.requiresShipping === undefined){
    data.requiresShipping = !!(data.shipTo && data.shipTo.trim());
  }
  if(!data.shippingAddress || typeof data.shippingAddress !== "object"){
    data.shippingAddress = data.shipTo
      ? {line1: data.shipTo, line2:"", city:"", state:"", zip:"", country:"Estados Unidos"}
      : {line1:"", line2:"", city:"", state:"", zip:"", country:"Estados Unidos"};
  }
  editingDoc = {type, data, isNew: !doc};
  render();
}

function renderDocEditor(main){
  const {type, data, isNew} = editingDoc;
  const col = collectionFor(type);
  const isEstimate = type==="estimate";
  const totals = calcDocTotals(data);
  const paidSoFar = isEstimate ? 0 : sumPayments(data);
  const balance = isEstimate ? 0 : Math.max(0, totals.total - paidSoFar);

  main.innerHTML = `
    <div class="view-header">
      <div>
        <div class="view-title">${escapeHTML(data.number)}</div>
        <div class="view-sub">${isEstimate ? "Orçamento" : "Fatura"}${!isEstimate && data.status ? " — "+statusLabel(type, data.status) : ""}${isEstimate && !isNew ? " — "+statusLabel(type, effectiveEstimateStatus(data)) : ""}</div>
      </div>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <button class="btn btn-ghost" id="back">&larr; Voltar</button>

    <div class="doc-panel" data-panel="itens">

      <div class="section-title" style="margin-top:0;">Itens<span class="hint">selecione do catálogo ou digite manualmente — "Tributável" define se o imposto de vendas incide sobre a linha</span></div>
      <div class="note-banner">Serviços cobrados por hora (Escaneamento 3D, CAD, Impressão, Pós-Processamento, Controle de Qualidade) usam a Qtd. no formato <strong>h.mm</strong> — 1.45 = 1h45min, não decimal puro. A Impressão também tem um cálculo auxiliar de horas × material logo abaixo da tabela.</div>

      </table>

      <div class="totals-box">
        <div class="checkbox-field" style="margin-bottom:8px; justify-content:flex-end;">

        <div class="totals-row"><span>Base tributável</span><span id="t-taxable-base">${fmtMoney(totals.taxableBase)}</span></div>
        <div class="totals-row"><span>Imposto</span><span id="t-tax">${fmtMoney(totals.taxAmount)}</span></div>
        <div class="totals-row grand"><span>Total</span><span id="t-total">${fmtMoney(totals.total)}</span></div>
        ${!isEstimate ? `
        <div class="totals-row"><span>Já pago</span><span id="t-paid">${fmtMoney(paidSoFar)}</span></div>
        <div class="totals-row balance"><span>Saldo devedor</span><span id="t-balance">${fmtMoney(balance)}</span></div>` : ""}
      </div>

    </div>

    <div class="doc-panel" data-panel="material">
    <div class="card">
      <div class="section-title" style="margin-top:0;">Material<span class="hint">marque os materiais usados nesta peça — a ficha completa (uso, temperatura, segurança) entra no documento impresso</span></div>
      <div class="chip-select" id="material-chip-select">
        ${MATERIALS_CATALOG.map(m => `<span class="chip ${((data.materialsUsed||[]).includes(m.id))?"chip-active":""}" data-material="${m.id}">${escapeHTML(m.name)}</span>`).join("")}

      <div id="material-detail-body" style="margin-top:18px;"></div>

    <div class="doc-panel" data-panel="notas">
    <div class="card">
      <div class="section-title" style="margin-top:0;">Notas / condições</div>
      <div class="field full"><textarea id="f-notes" style="min-height:80px;">${escapeHTML(data.notes)}</textarea></div>

      ${!isEstimate ? `
      <div class="section-title">Pagamentos</div>
      <table class="payments-table" id="payments-table"></table>
      <div class="payments-add-row">
        <div class="field"><label>Data</label><input type="date" id="p-date" value="${todayISO()}"></div>
        <div class="field"><label>Valor</label><input type="number" step="0.01" id="p-amount" placeholder="0.00"></div>
        <div class="field" style="flex:2;"><label>Nota (opcional)</label><input id="p-note" placeholder="Ex.: depósito de 50%, PIX, cheque…"></div>
        <button class="btn btn-sm btn-amber" id="add-payment" type="button">Registrar pagamento</button>
        <button class="btn btn-sm btn-ghost" id="pay-balance" type="button">Registrar saldo total hoje</button>
      </div>` : `
      <div class="section-title">Converter</div>
      <p style="font-size:13px; color:var(--color-platinum);">Depois de salvo, você pode transformar este orçamento numa fatura sem redigitar os itens.</p>
      <button class="btn btn-sm btn-primary" id="convert-invoice" type="button" ${isNew ? "disabled":""}>Converter em fatura</button>
      `}
    </div>
    </div>
  `;

  main.querySelectorAll("#doc-tabbar button").forEach(btn=>{
    btn.onclick = ()=>{
      main.querySelectorAll("#doc-tabbar button").forEach(b=> b.classList.remove("active"));
      btn.classList.add("active");
      main.querySelectorAll(".doc-panel").forEach(p=> p.classList.toggle("active", p.dataset.panel===btn.dataset.panel));
    };
  });

  renderItemsBody();
  renderMaterialTab();
  if(!isEstimate) renderPaymentsTable();
  renderClientDropdownLogic();

  function renderMaterialTab(){
    main.querySelectorAll("#material-chip-select .chip").forEach(chip=> chip.onclick = ()=>{
      const id = chip.dataset.material;
      data.materialsUsed = data.materialsUsed || [];
      const idx = data.materialsUsed.indexOf(id);
      if(idx>=0) data.materialsUsed.splice(idx,1); else data.materialsUsed.push(id);
      chip.classList.toggle("chip-active");
      drawMaterialDetails();
    });
    drawMaterialDetails();
  }
  function drawMaterialDetails(){
    const el = document.getElementById("material-detail-body");
    const chosen = (data.materialsUsed||[]).map(materialById).filter(Boolean);
    el.innerHTML = chosen.length===0
      ? `<div class="calc-empty-hint">Nenhum material selecionado ainda — marque acima o(s) filamento(s) usados nesta peça.</div>`
      : chosen.map(m => `
        <div class="card" style="margin-bottom:12px;">
          <div class="section-title" style="margin-top:0; font-size:16px;">${escapeHTML(m.name)}<span class="hint">${fmtMoney(m.priceKg)}/kg</span></div>
          <p style="font-size:13px; color:var(--color-platinum); line-height:1.6; margin:0 0 8px 0;">${escapeHTML(m.description)}</p>
          <p style="font-size:13px; color:var(--color-frost-white); line-height:1.6; margin:0 0 12px 0;"><strong>Uso:</strong> ${escapeHTML(m.use)}</p>
          <div class="stat-grid" style="grid-template-columns:repeat(4,1fr); margin-bottom:10px;">
            <div class="stat-card"><div class="stat-label">Bico</div><div class="stat-value" style="font-size:15px;">${m.nozzleMin}–${m.nozzleMax}°C</div></div>
            <div class="stat-card"><div class="stat-label">Mesa</div><div class="stat-value" style="font-size:15px;">${m.bedMin}–${m.bedMax}°C</div></div>
            <div class="stat-card"><div class="stat-label">Limite de uso</div><div class="stat-value amber" style="font-size:15px;">~${m.maxServiceTemp}°C</div></div>
            <div class="stat-card"><div class="stat-label">Ventilação</div><div class="stat-value ${m.ventilation?'danger':''}" style="font-size:15px;">${m.ventilation?"Obrigatória":"Opcional"}</div></div>
          </div>
          <div class="note-banner" style="margin-bottom:0;"><strong>Segurança / liability:</strong> ${escapeHTML(m.safety)}</div>
        </div>`).join("");
  }

  function catalogOptionsHTML(selectedId){
    return `<option value="" ${!selectedId?"selected":""}>— manual —</option>` +
      state.catalog.map(c=>`<option value="${c.id}" ${c.id===selectedId?"selected":""}>${escapeHTML(c.name)} (${c.type==="item"?"item":"serviço"})</option>`).join("") +
      `<option value="__new__">+ Novo item/serviço…</option>`;
  }

  function renderItemsBody(){
    const tbody = document.getElementById("items-body");
    tbody.innerHTML = data.items.map((it,idx)=>{
      const cat = it.catalogId ? state.catalog.find(c=>c.id===it.catalogId) : null;
      const isHours = cat && cat.pricingMode==="hours";
      const qtyLabel = isHours ? hmmLabel(it.qty) : "";
      return `
      <tr data-idx="${idx}">
        <td><select class="catalog-select">${catalogOptionsHTML(it.catalogId)}</select></td>
        <td><input class="desc-input" value="${escapeHTML(it.desc)}" placeholder="Descrição do item/serviço"></td>
        <td>
          <input class="num-input qty-input" type="number" inputmode="decimal" step="any" value="${it.qty}" placeholder="${isHours?'h.mm':'0'}">
          ${isHours ? `<div class="li-meta" style="text-align:right; margin-top:2px;">${qtyLabel}</div>` : ""}
        </td>
        <td><input class="num-input rate-input" type="number" inputmode="decimal" step="any" value="${it.rate}"></td>
        <td class="tax-cell"><input type="checkbox" class="taxable-input" ${it.taxable!==false ? "checked":""}></td>
        <td class="amount-cell">${fmtMoney(lineAmount(it))}</td>
        <td><button class="remove-line" data-remove="${idx}" title="Remover">&times;</button></td>
      </tr>`;
    }).join("");
    renderPrintHelper();

    tbody.querySelectorAll(".catalog-select").forEach((el,i)=> el.onchange = e=>{
      const val = e.target.value;
      if(val === "__new__"){
        const typedDesc = data.items[i].desc;
        openCatalogQuickCreateModal(typedDesc, (entry)=>{
          data.items[i].catalogId = entry.id;
          data.items[i].desc = entry.name;
          data.items[i].rate = entry.price;
          data.items[i].taxable = entry.type === "item";
          renderItemsBody();
          updateTotals();
        });
        e.target.value = data.items[i].catalogId || "";
        return;
      }
      if(!val){ data.items[i].catalogId = null; return; }
      const entry = state.catalog.find(c=>c.id===val);
      if(entry){
        data.items[i].catalogId = entry.id;
        data.items[i].desc = entry.name;
        data.items[i].rate = entry.price;
        data.items[i].taxable = entry.type === "item";
        renderItemsBody();
        updateTotals();
      }
    });
    tbody.querySelectorAll(".desc-input").forEach((el,i)=> el.oninput = e=>{ data.items[i].desc = e.target.value; });
    tbody.querySelectorAll(".qty-input").forEach((el,i)=> el.oninput = e=>{ data.items[i].qty = e.target.value; updateTotals(); });
    tbody.querySelectorAll(".rate-input").forEach((el,i)=> el.oninput = e=>{ data.items[i].rate = e.target.value; updateTotals(); });
    tbody.querySelectorAll(".taxable-input").forEach((el,i)=> el.onchange = e=>{ data.items[i].taxable = e.target.checked; updateTotals(); });
    tbody.querySelectorAll("[data-remove]").forEach(btn=> btn.onclick = ()=>{
      if(data.items.length<=1) return;
      data.items.splice(Number(btn.dataset.remove),1);
      renderItemsBody();
      updateTotals();
    });
  }

  function renderPrintHelper(){
    const host = document.getElementById("print-helper-body");
    if(!host) return;
    const rows = data.items.map((it,idx)=>({it,idx})).filter(({it})=>{
      const cat = it.catalogId ? state.catalog.find(c=>c.id===it.catalogId) : null;
      return cat && cat.pricingMode === "hours_material";
    });
    if(rows.length===0){ host.innerHTML=""; return; }
    host.innerHTML = `
      <div class="card" style="background:var(--color-carbon);">
        <div class="section-title" style="margin-top:0; font-size:15px;">Impressão — horas × material<span class="hint">calcula o preço unitário da linha (grama × $/g) — o total da linha continua sendo horas × esse valor</span></div>
        ${rows.map(({it,idx})=>`
          <div class="material-row-grid" data-print-idx="${idx}">
            <div class="field"><label>${escapeHTML(it.desc||"Impressão")} — material</label>
              <select class="ph-material">
                <option value="">— selecione —</option>
                ${MATERIALS_CATALOG.map(m=>`<option value="${m.id}" ${it.materialId===m.id?"selected":""}>${escapeHTML(m.name)} (${fmtMoney(materialPriceG(m))}/g)</option>`).join("")}
              </select>
            </div>
            <div class="field"><label>Gramas</label><input type="number" inputmode="decimal" class="ph-grams" value="${it.grams||""}" placeholder="0"></div>
            <div class="field"><label>Custo do material ($/peça)</label><input class="ph-cost" value="${fmtMoney(materialPriceG(materialById(it.materialId))*(Number(it.grams)||0))}" disabled></div>
            <button class="btn btn-sm btn-ghost ph-apply" type="button">Aplicar à linha</button>
          </div>
        `).join("")}
      </div>
    `;
    host.querySelectorAll("[data-print-idx]").forEach(row=>{
      const idx = Number(row.dataset.printIdx);
      const matSel = row.querySelector(".ph-material");
      const gramsInp = row.querySelector(".ph-grams");
      const costInp = row.querySelector(".ph-cost");
      const applyBtn = row.querySelector(".ph-apply");
      const recalc = ()=>{
        data.items[idx].materialId = matSel.value || null;
        data.items[idx].grams = Number(gramsInp.value)||0;
        const cost = materialPriceG(materialById(data.items[idx].materialId)) * (Number(gramsInp.value)||0);
        costInp.value = fmtMoney(cost);
        return cost;
      };
      matSel.onchange = recalc;
      gramsInp.oninput = recalc;
      applyBtn.onclick = ()=>{
        const cost = recalc();
        data.items[idx].rate = cost;
        renderItemsBody();
        updateTotals();
        showToast("Preço unitário aplicado à linha de Impressão.");
      };
    });
  }

  function updateTotals(){
    data.applyTax = document.getElementById("f-applytax").checked;
    data.taxRate = Number(document.getElementById("f-taxrate").value)/100;
    const t = calcDocTotals(data);
    document.getElementById("t-subtotal").textContent = fmtMoney(t.subtotal);
    document.getElementById("t-taxable-base").textContent = fmtMoney(t.taxableBase);
    document.getElementById("t-tax").textContent = fmtMoney(t.taxAmount);
    document.getElementById("t-total").textContent = fmtMoney(t.total);
    document.querySelectorAll("#items-body tr").forEach((tr,i)=>{
      const it = data.items[i];
      tr.querySelector(".amount-cell").textContent = fmtMoney(lineAmount(it));
      const hmmEl = tr.querySelector(".li-meta");
      if(hmmEl) hmmEl.textContent = hmmLabel(it.qty);
    });
    if(!isEstimate) updatePaymentTotals(t.total);
  }

  function updatePaymentTotals(total){
    const paid = sumPaymentsLocal();
    const bal = Math.max(0, total - paid);
    document.getElementById("t-paid").textContent = fmtMoney(paid);
    document.getElementById("t-balance").textContent = fmtMoney(bal);
  }

  function sumPaymentsLocal(){
    return (data.payments||[]).reduce((s,p)=> s+(Number(p.amount)||0), 0);
  }

  function renderPaymentsTable(){
    const tbl = document.getElementById("payments-table");
    const rows = data.payments || [];
    tbl.innerHTML = rows.length===0 ? `<tbody><tr><td style="color:var(--color-platinum); padding:8px 0;">Nenhum pagamento registrado ainda.</td></tr></tbody>` : `
      <thead><tr><th>Data</th><th>Nota</th><th class="num">Valor</th><th></th></tr></thead>
      <tbody>
        ${rows.map((p,i)=>`
          <tr>
            <td>${fmtDate(p.date)}</td>
            <td>${escapeHTML(p.note||"—")}</td>
            <td class="num">${fmtMoney(p.amount)}</td>
            <td class="row-actions">${p.id==="legacy" ? "" : `<button class="remove-line" data-rm-payment="${i}">&times;</button>`}</td>
          </tr>`).join("")}
      </tbody>`;
    tbl.querySelectorAll("[data-rm-payment]").forEach(btn=> btn.onclick = ()=>{
      data.payments.splice(Number(btn.dataset.rmPayment),1);
      renderPaymentsTable();
      syncStatusFromPayments();
      updateTotals();
    });
  }

  function syncStatusFromPayments(){
    const t = calcDocTotals(data);
    const paid = sumPaymentsLocal();
    const statusSel = document.getElementById("f-status");
    if(!statusSel || paid <= 0) return; // leave whatever the user had set (draft/sent/overdue)
    if(paid >= t.total - 0.005){
      statusSel.value = "paid";
    } else {
      statusSel.value = "partial";
    }
  }

  /* ---- Cliente: busca com autocomplete + criação rápida via popup ---- */
  function renderClientDropdownLogic(){
    const input = document.getElementById("f-client-search");
    const dropdown = document.getElementById("client-dropdown");

    function selectClient(client){
      data.clientId = client.id;
      input.value = client.name;
      dropdown.style.display = "none";
      document.getElementById("client-type-badge").innerHTML = clientTypeBadgeHTML(client);
      const shipBtn = document.getElementById("copy-client-address");
      if(shipBtn) shipBtn.dataset.clientId = client.id;
      updateTotals();
    }

    function openDropdown(query){
      const q = query.trim().toLowerCase();
      const matches = q ? state.clients.filter(c=>c.name.toLowerCase().includes(q)) : state.clients.slice(0,8);
      let html = matches.slice(0,8).map(c=>`<div class="client-dropdown-item" data-id="${c.id}">${escapeHTML(c.name)}${c.type==="company"?' <span class="stat-hint">· empresa</span>':''}</div>`).join("");
      html += `<div class="client-dropdown-item client-dropdown-new" data-new="1">+ Criar cliente${q?` "${escapeHTML(query.trim())}"`:""}</div>`;
      dropdown.innerHTML = html;
      dropdown.style.display = "block";
      dropdown.querySelectorAll("[data-id]").forEach(el=> el.onclick = ()=> selectClient(state.clients.find(c=>c.id===el.dataset.id)));
      const newBtn = dropdown.querySelector("[data-new]");
      if(newBtn) newBtn.onclick = ()=>{
        dropdown.style.display = "none";
        openClientQuickCreateModal(query.trim(), (client)=> selectClient(client));
      };
    }

    input.addEventListener("focus", ()=> openDropdown(input.value));
    input.addEventListener("input", ()=> openDropdown(input.value));
    document.addEventListener("click", (e)=>{
      if(!dropdown.contains(e.target) && e.target!==input) dropdown.style.display = "none";
    });
  }

  /* ---- Envio ---- */
  const shipCheckbox = document.getElementById("f-requireshipping");
  const shipFieldsBox = document.getElementById("shipping-fields");
  shipCheckbox.onchange = ()=>{ shipFieldsBox.style.display = shipCheckbox.checked ? "block" : "none"; };
  const copyAddrBtn = document.getElementById("copy-client-address");
  if(copyAddrBtn) copyAddrBtn.onclick = ()=>{
    const client = clientById(data.clientId);
    if(!client){ showToast("Selecione um cliente primeiro."); return; }
    const addr = normalizeClient(client).address;
    document.getElementById("ship-line1").value = addr.line1;
    document.getElementById("ship-line2").value = addr.line2;
    document.getElementById("ship-city").value = addr.city;
    document.getElementById("ship-state").value = addr.state;
    document.getElementById("ship-zip").value = addr.zip;
    document.getElementById("ship-country").value = addr.country;
  };

  document.getElementById("add-item").onclick = ()=>{
    data.items.push({desc:"", qty:1, rate:0, taxable:true, catalogId:null});
    renderItemsBody();
    updateTotals();
  };
  document.getElementById("f-applytax").onchange = updateTotals;
  document.getElementById("f-taxrate").oninput = updateTotals;
  document.getElementById("back").onclick = ()=>{ editingDoc = null; render(); };
  document.getElementById("print-doc").onclick = ()=>{ commitFormToData(); printDoc(type, data); };

  function commitFormToData(){
    data.businessLine = document.getElementById("f-line").value;
    if(!isEstimate){
      data.status = document.getElementById("f-status").value;
    }
    data.date = document.getElementById("f-date").value;
    const due = document.getElementById("f-duedate").value;
    if(isEstimate) data.validUntil = due; else data.dueDate = due;
    data.number = document.getElementById("f-number").value.trim() || data.number;
    data.poNumber = document.getElementById("f-po").value.trim();
    data.requiresShipping = document.getElementById("f-requireshipping").checked;
    data.shippingAddress = {
      line1: document.getElementById("ship-line1").value.trim(),
      line2: document.getElementById("ship-line2").value.trim(),
      city: document.getElementById("ship-city").value.trim(),
      state: document.getElementById("ship-state").value.trim(),
      zip: document.getElementById("ship-zip").value.trim(),
      country: document.getElementById("ship-country").value.trim() || "Estados Unidos"
    };
    data.notes = document.getElementById("f-notes").value;
    data.applyTax = document.getElementById("f-applytax").checked;
    data.taxRate = Number(document.getElementById("f-taxrate").value)/100;
  }

  if(!isEstimate){
    document.getElementById("add-payment").onclick = ()=>{
      const amount = Number(document.getElementById("p-amount").value);
      const date = document.getElementById("p-date").value || todayISO();
      if(!amount || amount<=0){ showToast("Informe um valor de pagamento maior que zero."); return; }
      if(!data.payments) data.payments = [];
      data.payments.push({id: uid(), date, amount, note: document.getElementById("p-note").value.trim()});
      document.getElementById("p-amount").value = "";
      document.getElementById("p-note").value = "";
      renderPaymentsTable();
      syncStatusFromPayments();
      updateTotals();
      showToast("Pagamento registrado.");
    };
    document.getElementById("pay-balance").onclick = ()=>{
      const t = calcDocTotals(data);
      const bal = Math.max(0, t.total - sumPaymentsLocal());
      if(bal<=0){ showToast("Não há saldo pendente."); return; }
      if(!data.payments) data.payments = [];
      data.payments.push({id: uid(), date: todayISO(), amount: bal, note:"Saldo final"});
      renderPaymentsTable();
      syncStatusFromPayments();
      updateTotals();
      showToast("Saldo registrado como pago.");
    };
  } else {
    async function doConvertToInvoice(){
      const invSkeleton = newDocSkeleton("invoice");
      invSkeleton.clientId = data.clientId;
      invSkeleton.businessLine = data.businessLine;
      invSkeleton.items = JSON.parse(JSON.stringify(data.items));
      invSkeleton.applyTax = data.applyTax;
      invSkeleton.taxRate = data.taxRate;
      invSkeleton.fromEstimateNumber = data.number;
      invSkeleton.requiresShipping = data.requiresShipping;
      invSkeleton.shippingAddress = JSON.parse(JSON.stringify(data.shippingAddress));
      invSkeleton.materialsUsed = JSON.parse(JSON.stringify(data.materialsUsed||[]));
      state.settings.nextInvoiceNumber++;
      await persist("settings");
      // Marca o orçamento de origem como aceito (não é mais editável manualmente).
      data.status = "accepted";
      const idxEst = state.estimates.findIndex(x=>x.id===data.id);
      if(idxEst>=0){ state.estimates[idxEst] = data; await persist("estimates"); }
      openDocEditor("invoice", invSkeleton);
      showToast("Orçamento convertido em fatura — revise e salve.");
    }
    const convBtn = document.getElementById("convert-invoice");
    if(convBtn && !isNew) convBtn.onclick = doConvertToInvoice;
    const convBtnTop = document.getElementById("convert-invoice-top");
    if(convBtnTop && !isNew) convBtnTop.onclick = doConvertToInvoice;
  }

  document.getElementById("save-doc").onclick = async ()=>{
    commitFormToData();
    if(!data.clientId){ showToast("Selecione um cliente (digite o nome e escolha na lista)."); return; }
    data.items = data.items.filter(it => (it.desc && it.desc.trim()) || Number(it.rate)>0);
    if(data.items.length===0) data.items = [{desc:"", qty:1, rate:0, taxable:true, catalogId:null}];

    if(isEstimate && (!data.status || data.status === "draft")){
      data.status = "sent";
      data.sentDate = data.sentDate || todayISO();
    }

    const idx = state[col].findIndex(x=>x.id===data.id);
    if(idx>=0) state[col][idx] = data; else state[col].push(data);

    if(isNew){
      if(isEstimate) state.settings.nextEstimateNumber++; else state.settings.nextInvoiceNumber++;
      await persist("settings");
    }
    await persist(col);
    editingDoc.isNew = false;
    showToast("Salvo com sucesso.");
    editingDoc = null;
    render();
  };
}

function initials(name){
  const parts = (name||"").trim().split(/\s+/).filter(Boolean);
  if(parts.length===0) return "RG";
  return parts.slice(0,2).map(w=>w[0]).join("").toUpperCase();
}

function printDoc(type, data){
  const s = state.settings;
  const t = calcDocTotals(data);
  const client = state.clients.find(c=>c.id===data.clientId) || {name:"—"};
  const isEstimate = type==="estimate";
  const displayStatus = isEstimate ? effectiveEstimateStatus(data) : data.status;
  const statusColors = {
    draft:["#EEF0F3","#5b6472"], sent:["#E4EEF6","#2C6E9E"], paid:["#E7F5EC","#1E7A46"],
    partial:["#FDF3DC","#8A5A00"],
    overdue:["#FBEAE9","#B3261E"], accepted:["#E7F5EC","#1E7A46"], expired:["#FBEAE9","#B3261E"]
  };
  const sc = statusColors[displayStatus] || statusColors.draft;
  const paid = isEstimate ? 0 : sumPayments(data);
  const balance = isEstimate ? 0 : Math.max(0, t.total - paid);
  const docWord = isEstimate ? "Orçamento" : "Fatura";

  const metaRows = [
    ["Documento", docWord.toUpperCase() + " · " + escapeHTML(data.number)],
    ["Data", fmtDate(data.date)],
  ];
  if(data.poNumber) metaRows.push(["P.O. / Ref.", escapeHTML(data.poNumber)]);
  metaRows.push([isEstimate ? "Válido até" : "Vencimento", fmtDate(isEstimate ? data.validUntil : data.dueDate)]);

  const effectiveShipAddr = (data.shippingAddress && formatAddressLines(data.shippingAddress).length)
    ? data.shippingAddress
    : client.address;

  const html = `
    <div class="doc-page">
      <div class="doc-header-v2">
        <div class="doc-brand-block">
          <img class="doc-logo-img" src="${LOGO_DATA_URI}" alt="Logo">
          <div class="doc-brandname">${escapeHTML(s.businessName)}</div>
          <div class="doc-company-block">
            ${escapeHTML(s.address||"").replace(/\n/g,"<br>")}${s.address ? "<br>" : ""}
            ${s.phone ? "Tel: "+escapeHTML(s.phone) : ""}${s.phone && s.email ? " · " : ""}${s.email ? "Email: "+escapeHTML(s.email) : ""}
            ${s.ein ? "<br>EIN: "+escapeHTML(s.ein) : ""}
          </div>
        </div>
        <div class="doc-type-block">
          <div class="doc-title-tag">${docWord.toUpperCase()}</div>
          <div class="doc-status-stamp" style="background:${sc[0]}; color:${sc[1]};">${statusLabel(type,displayStatus)}</div>
          ${data.businessLine ? `<div class="stat-hint" style="margin-top:6px;">${escapeHTML(data.businessLine)}</div>` : ""}
        </div>
      </div>

      <div class="doc-meta-row">
        <div class="doc-meta-col">
          <div class="label">Cobrar de</div>
          <div class="content">
            <strong>${escapeHTML(client.name)}</strong>${client.type==="company" ? ' <span style="font-size:10.5px; color:#8991A0;">(Empresa)</span>' : ""}<br>
            ${formatAddressHTML(client.address)}${formatAddressLines(client.address).length ? "<br>" : ""}
            ${escapeHTML(client.email||"")}${client.phone ? " · "+escapeHTML(client.phone) : ""}
          </div>
        </div>
        ${data.requiresShipping ? `
        <div class="doc-meta-col">
          <div class="label">Enviar para</div>
          <div class="content">${formatAddressHTML(effectiveShipAddr) || "<span style='color:#B3261E;'>Endereço de envio não informado</span>"}</div>
        </div>` : ""}
        <div class="doc-meta-col" style="flex:0 0 auto;">
          <table class="doc-meta-table">
            ${metaRows.map(([k,v])=>`<tr><td class="k">${k}</td><td class="v">${v}</td></tr>`).join("")}
          </table>
        </div>
      </div>

      <table class="doc-items-v2">
        <thead><tr>
          <th style="width:10%">Qtd.</th>
          <th style="width:48%">Descrição</th>
          <th class="num" style="width:20%">Preço unit.</th>
          <th class="num" style="width:22%">Total</th>
        </tr></thead>
        <tbody>
          ${data.items.map(it=>{
            const cat = it.catalogId ? state.catalog.find(c=>c.id===it.catalogId) : null;
            const isHours = cat && (cat.pricingMode==="hours" || cat.pricingMode==="hours_material");
            return `
            <tr>
              <td>${isHours ? hmmLabel(it.qty) : it.qty}</td>
              <td>${escapeHTML(it.desc)}</td>
              <td class="num">${fmtMoney(it.rate)}</td>
              <td class="num">${fmtMoney(lineAmount(it))}</td>
            </tr>`;}).join("")}
        </tbody>
      </table>

      <div class="doc-totals">
        <div class="row"><span>Subtotal</span><span>${fmtMoney(t.subtotal)}</span></div>
        ${data.applyTax ? `<div class="row"><span>Imposto sobre vendas ${(data.taxRate*100).toFixed(2)}%</span><span>${fmtMoney(t.taxAmount)}</span></div>` : ""}
        <div class="row grand"><span>TOTAL</span><span>${fmtMoney(t.total)}</span></div>
        ${!isEstimate && paid>0 ? `
        <div class="row"><span>Pago</span><span>${fmtMoney(paid)}</span></div>
        <div class="row balance"><span>Saldo devedor</span><span>${fmtMoney(balance)}</span></div>` : ""}
      </div>

      ${data.fromEstimateNumber ? `<div style="font-size:11.5px; color:#8991A0; margin-top:6px;">Gerado do orçamento ${escapeHTML(data.fromEstimateNumber)}</div>` : ""}

      ${s.ownerName ? `
      <div style="margin-top:36px;">
        <div class="doc-sig-script">${escapeHTML(s.ownerName)}</div>
        <div style="border-top:1px solid var(--color-smoke); width:210px; margin-top:2px; padding-top:4px; font-size:10.5px; color:#8991A0;">
          ${escapeHTML(s.ownerName)}${s.businessName ? " — "+escapeHTML(s.businessName) : ""}
        </div>
      </div>` : ""}
      ${isEstimate ? `<div class="doc-sign"><div class="line">Aceito por (assinatura do cliente)</div><div class="line">Data</div></div>` : ""}

      <div class="doc-thankyou">Obrigado!</div>

      ${data.notes ? `
      <div class="doc-terms">
        <div class="bar"></div>
        <div class="content">
          <div class="heading">${isEstimate ? "Condições" : "Termos e condições"}</div>
          ${escapeHTML(data.notes).replace(/\n/g,"<br>")}
        </div>
      </div>` : ""}

      ${(data.materialsUsed||[]).length ? `
      <div class="doc-terms" style="margin-top:14px;">
        <div class="bar"></div>
        <div class="content">
          <div class="heading">Materiais utilizados</div>
          ${(data.materialsUsed||[]).map(materialById).filter(Boolean).map(m => `
            <div style="margin-bottom:8px;">
              <strong>${escapeHTML(m.name)}</strong> — ${escapeHTML(m.use)}<br>
              <span style="color:var(--color-platinum);">Limite de uso ~${m.maxServiceTemp}°C. ${escapeHTML(m.safety)}</span>
            </div>`).join("")}
        </div>
      </div>` : ""}

      ${s.disclaimerText ? `
      <div class="doc-terms" style="margin-top:14px;">

/* =========================================================
   TAX REPORT
========================================================= */
function renderTax(main){
  const years = new Set([new Date().getFullYear()]);
  state.invoices.forEach(i=> i.date && years.add(Number(i.date.slice(0,4))));
  state.expenses.forEach(e=> e.date && years.add(Number(e.date.slice(0,4))));
  state.marketplaceSales.forEach(s=> s.date && years.add(Number(s.date.slice(0,4))));
  const yearList = Array.from(years).sort((a,b)=>b-a);

  let year = yearList[0];
  let quarter = "all";

  function draw(){
    const qRanges = {
      all: [`${year}-01-01`, `${year}-12-31`],
      1:[`${year}-01-01`,`${year}-03-31`], 2:[`${year}-04-01`,`${year}-06-30`],
      3:[`${year}-07-01`,`${year}-09-30`], 4:[`${year}-10-01`,`${year}-12-31`]
    };
    const [start,end] = qRanges[quarter];

    const invoiceIncome = allPaymentsFlat()
      .filter(p => p.date>=start && p.date<=end)
      .reduce((s,p)=> s+(Number(p.amount)||0), 0);

    const marketplaceIncome = state.marketplaceSales
      .filter(sale => sale.date>=start && sale.date<=end)
      .reduce((s,sale)=> s+netSale(sale), 0);

    const income = invoiceIncome + marketplaceIncome;

    const exps = state.expenses.filter(e=> e.date>=start && e.date<=end);
    const expenseTotal = exps.reduce((s,e)=> s+(Number(e.amount)||0),0);
    const byCategoryMap = {};
    exps.forEach(e=>{ byCategoryMap[e.category] = (byCategoryMap[e.category]||0) + (Number(e.amount)||0); });
    const byCategory = Object.entries(byCategoryMap).sort((a,b)=>b[1]-a[1]);
    const net = income - expenseTotal;
    const seTax = net>0 ? net*0.153 : 0;
    const periodLabel = quarter==="all" ? `Ano ${year}` : `${year} — T${quarter}`;

    main.innerHTML = `
      <div class="view-header">
        <div>
          <div class="view-title">Relatório Fiscal</div>
          <div class="view-sub">Organização simples pra Schedule C — não substitui contador.</div>
        </div>
        <button class="btn btn-ghost" id="print-report">Imprimir / PDF</button>
      </div>
      <div class="toolbar">
        <select id="f-year">${yearList.map(y=>`<option value="${y}" ${y===year?"selected":""}>${y}</option>`).join("")}</select>
        <select id="f-quarter">
          <option value="all" ${quarter==="all"?"selected":""}>Ano todo</option>
          <option value="1" ${quarter==="1"?"selected":""}>1º trimestre</option>
          <option value="2" ${quarter==="2"?"selected":""}>2º trimestre</option>
          <option value="3" ${quarter==="3"?"selected":""}>3º trimestre</option>
          <option value="4" ${quarter==="4"?"selected":""}>4º trimestre</option>
        </select>
      </div>

      <div class="stat-grid" style="grid-template-columns:repeat(3,1fr);">
        <div class="stat-card">
          <div class="stat-label">Receita bruta</div>
          <div class="stat-value" style="color:var(--status-good)">${fmtMoney(income)}</div>
          <div class="stat-hint">Faturas: ${fmtMoney(invoiceIncome)} · Marketplace: ${fmtMoney(marketplaceIncome)}</div>
        </div>
        <div class="stat-card"><div class="stat-label">Despesas totais</div><div class="stat-value amber">${fmtMoney(expenseTotal)}</div></div>
        <div class="stat-card"><div class="stat-label">Lucro líquido</div><div class="stat-value ${net<0?'danger':''}">${fmtMoney(net)}</div></div>
      </div>

      <div class="card">
        <strong>Despesas por categoria</strong>
        ${byCategory.length===0 ? `<div class="empty-state">Sem despesas no período.</div>` : `
        <table style="margin-top:10px;">
          <thead><tr><th>Categoria</th><th class="num">Total</th></tr></thead>
          <tbody>${byCategory.map(([cat,val])=>`<tr><td>${escapeHTML(cat)}</td><td class="num">${fmtMoney(val)}</td></tr>`).join("")}</tbody>
        </table>`}
      </div>

      <div class="note-banner">
        <strong>Lembretes (Schedule C + Schedule SE):</strong> self-employment tax de 15,3% sobre o lucro líquido
        (estimado aqui: ${fmtMoney(seTax)}) · estimated taxes trimestrais recomendados acima de ~$1.000/ano de lucro projetado ·
        vendas via marketplace já recolhem imposto automaticamente (AB 147), vendas diretas são responsabilidade própria ·
        receita de marketplace já está líquida de taxas da plataforma.
        Isto é organizacional — confirme os números com seu contador antes de declarar.
      </div>
    `;
    document.getElementById("f-year").onchange = e=>{ year=Number(e.target.value); draw(); };
    document.getElementById("f-quarter").onchange = e=>{ quarter=e.target.value; draw(); };
    document.getElementById("print-report").onclick = ()=> printTaxReport({periodLabel, income, invoiceIncome, marketplaceIncome, expenseTotal, net, byCategory});
  }
  draw();
}

          <div class="calc-cost-line"><span>Máquina</span><span>${fmtMoney(result.custoMaquina)}</span></div>
          <div class="calc-cost-line"><span>Mão de obra</span><span>${fmtMoney(result.custoMaoObra)}</span></div>
          <div class="calc-cost-line total"><span>Custo total</span><span>${fmtMoney(result.custoTotal)}</span></div>

            ${channels.map(([key,label,r])=>`

                <div class="ch-price">${fmtMoney(r.preco)}</div>
                <div class="ch-profit">lucro ${fmtMoney(r.lucro)}</div>
              </div>`).join("")}
          </div>
          <button class="btn btn-amber btn-sm" id="add-to-list" style="margin-top:16px;">+ Adicionar à cotação</button>
        </div>
      </div>

        <div class="section-title">Itens desta cotação<span class="hint">${list.length} item(ns) · total ${fmtMoney(listTotal)}</span></div>

              <div>
                <div class="li-desc">${escapeHTML(it.desc)}</div>
                <div class="li-meta">${escapeHTML(it.channelLabel)}</div>
              </div>

        <div class="modal-actions" style="margin-top:16px; justify-content:flex-start;">
          <button class="btn btn-primary" id="handoff-estimate">Criar orçamento com estes itens</button>
        </div>` : ""}
      </div>
    `;

    document.getElementById("c-nome").oninput = e=>{ form.nome = e.target.value; };
    document.getElementById("c-material").onchange = e=>{ form.material = e.target.value; draw(); };
    const mp = document.getElementById("c-manualprice");
    if(mp) mp.oninput = e=>{ form.manualPrice = e.target.value; };
    document.getElementById("c-peso").oninput = e=>{ form.peso = e.target.value; };
    document.getElementById("c-tempo").oninput = e=>{ form.tempo = e.target.value; };
    document.getElementById("c-pos").oninput = e=>{ form.pos = e.target.value; };
    document.getElementById("calc-run").onclick = ()=> draw();
    main.querySelectorAll("[data-channel]").forEach(tile=> tile.onclick = ()=>{ form.channel = tile.dataset.channel; draw(); });

    document.getElementById("add-to-list").onclick = ()=>{
      if(!form.nome.trim()){ showToast("Dê um nome pro item antes de adicionar."); return; }
      const chosen = channels.find(c=>c[0]===form.channel);
      list.push({ desc: form.nome.trim(), channelLabel: chosen[1], rate: chosen[2].preco });
      form.nome=""; form.peso=""; form.tempo=""; form.pos=""; form.manualPrice="";
      draw();
      showToast("Item adicionado.");
    };
    main.querySelectorAll("[data-remove-item]").forEach(btn=> btn.onclick = ()=>{
      list.splice(Number(btn.dataset.removeItem),1);
      draw();
    });
    const handoffBtn = document.getElementById("handoff-estimate");
    if(handoffBtn){
      handoffBtn.onclick = ()=>{
        const items = list.map(it => ({desc: it.desc + " (" + it.channelLabel + ")", qty:1, rate: it.rate, taxable:true}));
        openCalculatorHandoff("estimate", "Reverso Studio", items);
      };
    }
  }
  draw();
}

    horasNRE: "", repeticao: false
  };

    const listTotal = list.reduce((s,it)=> s + it.totalPedido, 0);

    main.innerHTML = `
      <div class="view-header">
        <div>

          <div class="field" style="margin-bottom:12px;">
            <label>Preço manual ($/g)</label>
            <input type="number" step="0.001" id="c-manualprice" value="${form.manualPrice}">
          </div>` : ""}

          <div class="calc-cost-line"><span>Material</span><span>${fmtMoney(result.custoMaterial)}</span></div>
          <div class="calc-cost-line"><span>Máquina</span><span>${fmtMoney(result.custoMaquina)}</span></div>
          <div class="calc-cost-line"><span>Mão de obra</span><span>${fmtMoney(result.custoMaoObra)}</span></div>
          <div class="calc-cost-line"><span>Custo da peça</span><span>${fmtMoney(result.custoPeca)}</span></div>

              <div>
                <div class="li-desc">${escapeHTML(it.nome)}</div>

          <button class="btn btn-primary" id="handoff-estimate">Criar orçamento com estas peças</button>
        </div>` : ""}
      </div>
    `;

    document.getElementById("c-nome").oninput = e=>{ form.nome = e.target.value; };
    document.getElementById("c-material").onchange = e=>{ form.material = e.target.value; draw(); };
    const mp = document.getElementById("c-manualprice");
    if(mp) mp.oninput = e=>{ form.manualPrice = e.target.value; };
    document.getElementById("c-peso").oninput = e=>{ form.peso = e.target.value; };
    document.getElementById("c-tempo").oninput = e=>{ form.tempo = e.target.value; };
    document.getElementById("c-pos").oninput = e=>{ form.pos = e.target.value; };
    document.getElementById("c-horasnre").oninput = e=>{ form.horasNRE = e.target.value; };
    document.getElementById("c-repeticao").onchange = e=>{ form.repeticao = e.target.checked; draw(); };
    document.getElementById("calc-run").onclick = ()=> draw();

    document.getElementById("add-to-list").onclick = ()=>{
      if(!form.nome.trim()){ showToast("Dê um nome pra peça antes de adicionar."); return; }
      list.push(Object.assign({nome: form.nome.trim()}, result));
      form.nome=""; form.peso=""; form.tempo=""; form.pos=""; form.horasNRE=""; form.manualPrice=""; form.repeticao=false;
      draw();
      showToast("Peça adicionada.");
    };
    main.querySelectorAll("[data-remove-item]").forEach(btn=> btn.onclick = ()=>{
      list.splice(Number(btn.dataset.removeItem),1);
      draw();
    });
    const handoffBtn = document.getElementById("handoff-estimate");
    if(handoffBtn){
      handoffBtn.onclick = ()=>{
        const items = [];
        list.forEach(it=>{
          items.push({desc: it.nome + " — peça", qty:1, rate: it.precoPeca, taxable:true});
          if(it.precoNRE > 0){
            items.push({desc: it.nome + " — NRE (escaneamento/CAD)", qty:1, rate: it.precoNRE, taxable:false});
          }
        });
        openCalculatorHandoff("estimate", "Reverso Works", items);
      };
    }
  }
  draw();
}

      <button data-tab="materiais" class="${settingsTab==='materiais'?'active':''}">Materiais</button>
    </div>
    <div id="settings-tab-body"></div>
  `;
  main.querySelectorAll(".tabbar button").forEach(btn=>{
    btn.onclick = ()=>{ settingsTab = btn.dataset.tab; renderSettings(main); };

  const body = document.getElementById("settings-tab-body");

}

        <div class="field"><label>Refugo (%)</label><input class="m-refugo" type="number" step="0.1" value="${(m.refugo*100).toFixed(1)}"></div>
        <button class="remove-line" data-remove-material="${i}" title="Remover" type="button">&times;</button>
      </div>`).join("");
    el.querySelectorAll(".m-nome").forEach((inp,i)=> inp.oninput = e=>{ materials[i].nome = e.target.value; });
    el.querySelectorAll(".m-preco").forEach((inp,i)=> inp.oninput = e=>{ materials[i].precoG = Number(e.target.value)||0; });
    el.querySelectorAll(".m-refugo").forEach((inp,i)=> inp.oninput = e=>{ materials[i].refugo = (Number(e.target.value)||0)/100; });
    el.querySelectorAll("[data-remove-material]").forEach(btn=> btn.onclick = ()=>{
      if(materials.length<=1){ showToast("Mantenha ao menos um material."); return; }
      materials.splice(Number(btn.dataset.removeMaterial),1);
      drawMaterials();
    });
  }
  drawMaterials();
  document.getElementById("add-material").onclick = ()=>{
    materials.push({nome:"Novo material", precoG:0.025, refugo:0.05});
    drawMaterials();
  };

  document.getElementById("save-pricing").onclick = async ()=>{
    state.settings.pricing = {
      taxaMaquina: Number(document.getElementById("p-maquina").value)||0,
      taxaMaoObra: Number(document.getElementById("p-maoobra").value)||0,
      taxaNRE: Number(document.getElementById("p-nre").value)||0,
      depositoNRE: (Number(document.getElementById("p-deposito").value)||0)/100,
      pedidoMinimo: Number(document.getElementById("p-minimo").value)||0,
      royaltyRepeticao: (Number(document.getElementById("p-royalty").value)||0)/100,
      taxaRefugoGeral: (Number(document.getElementById("p-refugo").value)||0)/100,
      markupDireto: Number(document.getElementById("p-markup").value)||0,
      margemAlvoMarketplace: (Number(document.getElementById("p-margemalvo").value)||0)/100,
      materiais: materials.filter(m=>m.nome && m.nome.trim()),
      plataformas: {
        etsy: {variavel: (Number(document.getElementById("p-etsy-var").value)||0)/100, fixo: Number(document.getElementById("p-etsy-fix").value)||0},
        ebay: {variavel: (Number(document.getElementById("p-ebay-var").value)||0)/100, fixo: Number(document.getElementById("p-ebay-fix").value)||0},
        amazon: {variavel: (Number(document.getElementById("p-amazon-var").value)||0)/100, fixo: Number(document.getElementById("p-amazon-fix").value)||0}
      }
    };
    await persist("settings");
    showToast("Premissas de cálculo salvas.");
    render();
  };
}

/* =========================================================
   SETTINGS — Serviços & Itens (CRUD do catálogo)
========================================================= */
function renderSettingsCatalogo(body, s){
  let search = "";
  let filterType = "";

  function draw(){
    const list = state.catalog
      .filter(c => (c.name||"").toLowerCase().includes(search.toLowerCase()))
      .filter(c => !filterType || c.type===filterType)
      .sort((a,b)=> (a.type===b.type ? 0 : a.type==="service" ? -1 : 1) || a.name.localeCompare(b.name));

    body.innerHTML = `
      <div class="note-banner">
        <strong>Serviços</strong> cobrados por hora usam o formato h.mm (1.45 = 1h45min) na quantidade do orçamento/fatura. <strong>Itens</strong> têm unidade única e o preço fica em aberto até você definir na hora do orçamento/fatura.
      </div>
      <div class="card" style="padding:0;">
        <div class="toolbar" style="padding:16px 16px 0 16px; margin-bottom:0;">
          <input type="search" id="cat-search" placeholder="Buscar por nome…" value="${escapeHTML(search)}">
          <select id="cat-filter">
            <option value="">Todos os tipos</option>
            <option value="service" ${filterType==='service'?'selected':''}>Serviços</option>
            <option value="item" ${filterType==='item'?'selected':''}>Itens</option>
          </select>
          <div class="spacer"></div>
          <button class="btn btn-primary btn-sm" id="cat-new">+ Novo item/serviço</button>
        </div>
        <div style="padding:16px;">
        ${list.length===0 ? `<div class="empty-state"><div class="big">Nada encontrado</div>Crie um item ou serviço novo pra começar.</div>` : `
        <table>
          <thead><tr><th>Nome</th><th>Tipo</th><th>Cobrança</th><th class="num">Preço</th><th></th></tr></thead>
          <tbody>
            ${list.map(c => `
              <tr data-id="${c.id}">
                <td><input class="cat-name" value="${escapeHTML(c.name)}"></td>
                <td>
                  <select class="cat-type">
                    <option value="item" ${c.type==='item'?'selected':''}>Item</option>
                    <option value="service" ${c.type==='service'?'selected':''}>Serviço</option>
                  </select>
                </td>
                <td>
                  <select class="cat-mode">
                    <option value="fixed" ${(c.pricingMode||'fixed')==='fixed'?'selected':''}>Valor fixo</option>
                    <option value="hours" ${c.pricingMode==='hours'?'selected':''}>Por hora (h.mm)</option>
                    <option value="hours_material" ${c.pricingMode==='hours_material'?'selected':''}>Hora × material (Impressão)</option>
                  </select>
                </td>
                <td class="num">
                  ${c.pricingMode==='hours_material'
                    ? `<span class="stat-hint">definido por peça</span>`
                    : `<input class="cat-price num-input" type="number" inputmode="decimal" step="0.01" value="${c.price}">`}
                </td>
                <td class="row-actions">
                  <button class="btn btn-sm btn-danger" data-del="${c.id}">Excluir</button>
                </td>
              </tr>`).join("")}
          </tbody>
        </table>`}
        </div>
      </div>
    `;

    document.getElementById("cat-search").oninput = e=>{ search = e.target.value; draw(); };
    document.getElementById("cat-filter").onchange = e=>{ filterType = e.target.value; draw(); };
    document.getElementById("cat-new").onclick = ()=>{
      openCatalogQuickCreateModal("", ()=>{ draw(); });
    };
    body.querySelectorAll("tr[data-id]").forEach(tr=>{
      const id = tr.dataset.id;
      const entry = state.catalog.find(c=>c.id===id);
      if(!entry) return;
      const nameInp = tr.querySelector(".cat-name");
      const typeSel = tr.querySelector(".cat-type");
      const modeSel = tr.querySelector(".cat-mode");
      const priceInp = tr.querySelector(".cat-price");
      const save = async ()=>{
        entry.name = nameInp.value.trim() || entry.name;
        entry.type = typeSel.value;
        entry.pricingMode = modeSel.value;
        entry.unit = entry.pricingMode==="fixed" ? "un" : "h";
        if(priceInp) entry.price = Number(priceInp.value)||0;
        await persist("catalog");
      };
      nameInp.onchange = save;
      typeSel.onchange = save;
      modeSel.onchange = ()=>{ save(); draw(); };
      if(priceInp) priceInp.onchange = save;
    });
    body.querySelectorAll("[data-del]").forEach(btn=> btn.onclick = ()=>{
      confirmModal("Excluir do catálogo?", "Orçamentos/faturas já criados com este item não são afetados.", async ()=>{
        state.catalog = state.catalog.filter(c=>c.id!==btn.dataset.del);
        await persist("catalog");
        showToast("Removido do catálogo.");
        draw();
      });
    });
  }
  draw();
}

/* =========================================================
   AUTH & LOGIN SCREEN
========================================================= */
let authMode = "login"; // "login" | "signup"

function renderLoginScreen(errorMsg){
  const el = document.getElementById("login-screen");
  el.innerHTML = `
    <div class="login-card">
      <div class="login-brand">REVERSO<small>Gestor</small></div>
      <div class="login-error ${errorMsg ? "show" : ""}" id="login-error">${escapeHTML(errorMsg||"")}</div>
      <div class="field"><label>Email</label><input type="email" id="login-email" autocomplete="username"></div>
      <div class="field"><label>Senha</label><input type="password" id="login-password" autocomplete="${authMode==='signup'?'new-password':'current-password'}"></div>
      <div class="login-actions">
        <button class="btn btn-primary" id="login-submit">${authMode==="signup" ? "Criar conta" : "Entrar"}</button>
      </div>
      <div class="login-toggle">
        ${authMode==="signup"
          ? `Já tem conta? <a id="to-login">Entrar</a>`
          : `Primeiro acesso? <a id="to-signup">Criar conta</a>`}
      </div>
    </div>
  `;
  document.getElementById("login-submit").onclick = handleAuthSubmit;
  const pwField = document.getElementById("login-password");
  pwField.addEventListener("keydown", e=>{ if(e.key==="Enter") handleAuthSubmit(); });
  const toSignup = document.getElementById("to-signup");
  if(toSignup) toSignup.onclick = ()=>{ authMode="signup"; renderLoginScreen(); };
  const toLogin = document.getElementById("to-login");
  if(toLogin) toLogin.onclick = ()=>{ authMode="login"; renderLoginScreen(); };
}

async function handleAuthSubmit(){
  const email = document.getElementById("login-email").value.trim();
  const password = document.getElementById("login-password").value;
  if(!email || !password){ renderLoginScreen("Preencha email e senha."); return; }
  try{
    if(authMode==="signup"){
      await auth.createUserWithEmailAndPassword(email, password);
    } else {
      await auth.signInWithEmailAndPassword(email, password);
    }
    // onAuthStateChanged cuida do resto
  }catch(e){
    renderLoginScreen(translateAuthError(e));
  }
}

function translateAuthError(e){
  const code = e && e.code || "";
  const map = {
    "auth/user-not-found": "Email não encontrado. Crie uma conta primeiro.",
    "auth/wrong-password": "Senha incorreta.",
    "auth/invalid-email": "Email inválido.",
    "auth/email-already-in-use": "Este email já tem conta — clique em \"Entrar\".",
    "auth/weak-password": "Senha muito curta (mínimo 6 caracteres).",
    "auth/too-many-requests": "Muitas tentativas. Aguarde um pouco e tente de novo."
  };
  return map[code] || "Não foi possível autenticar. Tente novamente.";
}

/* =========================================================
   BOOTSTRAP — versão em nuvem (Firebase Auth + Firestore)
========================================================= */
async function showApp(){
  document.getElementById("login-screen").style.display = "none";
  document.getElementById("app").style.display = "flex";
  document.getElementById("user-email").textContent = currentUser.email || "";
  document.getElementById("main").innerHTML = "<p style='padding:20px;'>Carregando seus dados…</p>";
  await loadAll();
  render();
}

function showLogin(){
  document.getElementById("app").style.display = "none";
  document.getElementById("login-screen").style.display = "flex";
  ready = false;
  renderLoginScreen();
}

auth.onAuthStateChanged(async (user)=>{
  currentUser = user;
  if(user){
    await showApp();
  } else {
    showLogin();
  }
});

document.addEventListener("DOMContentLoaded", ()=>{
  const logoutBtn = document.getElementById("logout-btn");
  if(logoutBtn) logoutBtn.onclick = ()=> auth.signOut();
});
const __logoutBtnEarly = document.getElementById("logout-btn");
if(__logoutBtnEarly) __logoutBtnEarly.onclick = ()=> auth.signOut();

})();
</script>
